project:
  rootId: "ce064d2c-7c03-4eac-ae7d-89a14c2ba273"
  name: "TaskOrchestrator"

# Plugin and hook settings live under extensions.<tool>; the server stores them and never reads them (4.0).
# Hook-local (read by the plugin's orchestration-context, dispatch-model-guard and dispatch-hint hooks):
# orchestration.mode is workflow (default) | schema | off. retrospective is read by the retrospective hooks.
extensions:
  claude-code:
    orchestration:
      mode: workflow
    retrospective:
      mode: dispatch
      dispatchThreshold: 3
      github_feedback:
        enabled: true
        repo: jpicklyk/task-orchestrator

work_item_schemas:

  feature-implementation:
    lifecycle: auto
    default_traits: [delegated, session-tracked]
    notes:
      - key: feature-summary
        role: queue
        required: true
        description: "Lean feature-level summary — goal, findings-to-tasks mapping, dependency edges, non-goals pointer."
        skill: "spec-quality"
        guidance: "Keep this lean — target under 2k chars. Cover: (1) the goal in 2-3 sentences, (2) a findings→tasks table mapping brainstorm/research findings to the child task-scope items created for them, (3) dependency edges between those child tasks, (4) a pointer to where non-goals and alternatives are recorded — the full spec-quality bar (alternatives, blast radius, risk flags, test strategy) belongs in each child's task-scope note, not here."
      - key: implementation-notes
        role: work
        required: true
        description: "Context handoff for downstream agents — deviations, surprises, and decisions that affect dependent work."
        guidance: "Document decisions made during implementation that weren't in the feature-summary. Focus on what downstream agents need to know: deviations from the plan, API or interface surprises, assumptions that turned out wrong, and any patterns discovered that affect dependent tasks. Cover the substance — do not pad with boilerplate, restated spec content, or redundant summaries."
        maxLength: 3000
      - key: review-checklist
        role: review
        required: true
        description: "Quality gate — plan alignment, test quality, and simplification review."
        skill: "review-quality"
        maxLength: 4000
        guidance: "Verify: (1) what was built aligns with the feature-summary and each child's task-scope — flag planned items that were missed or unplanned changes that were added, (2) tests add specific value and cover the test strategy from the feature's planning notes — not strawman tests that pass without verifying real behavior, (3) if /simplify was run and made changes, verify those changes have test coverage — the reviewer does not run simplify or make fixes, only reports gaps. Also flag changes outside the feature's declared scope. This note is the item's findings register: number every finding once here (B1.. blocking, O1.. observation), one line each: location, what was expected, what was found, confidence. Sibling review notes cite these ids and never restate a finding. This note owns acceptance-criteria proof: state `AC n: met (<one citation>)` for each criterion and move on. Dispose a child's findings on the child when it closes; a parent review lists only feature-level findings and never re-lists a child's. Target 1500-2500 characters whatever the item size; the 4000 maxLength is a backstop. A review that needs more is a sign the plan should have been split, not that the note should grow."
      - key: orchestrator-confirmation
        role: review
        required: false
        maxLength: 2500
        description: "Disposition register: one line per review finding on THIS item, ending N of N disposed."
        guidance: "Written by the orchestrator when the item's review returns. One line per finding id from this item's review-checklist: `<id>: fixed <sha|PR> | follow-up <item-id> | accepted: <reason>`; a blocking finding can only be fixed; a follow-up item exists before its line is written. End with `N of N disposed`. Dispose a child's findings on the child when the child closes, never on the parent: the parent's note covers only the parent's own feature review. Re-check results from the same reviewer belong in the reviewer's note, not here. Target 300-1200 characters."

  feature-task:
    lifecycle: auto
    default_traits: [delegated, session-tracked]
    seats:
      - { name: planner,      phase: queue }
      - { name: implementer,  phase: work, enters: true }
      - { name: orchestrator, phase: work, after: [implementer] }
      - { name: reviewer,     phase: review }
    notes:
      - key: task-scope
        role: queue
        required: true
        seat: planner
        description: "What to build — target files, acceptance criteria, constraints."
        skill: "spec-quality"
        guidance: "Define the narrow scope of this task. Include: what to build (specific behavior or component), target files and modules, acceptance criteria (how to verify it works), and constraints or dependencies on other tasks. The parent feature specification covers the 'why' and alternatives — this note covers the 'what' for this specific task. Name test commands by file path or glob (node --test path/to/*.test.mjs), never by directory: Node 22 on Windows treats a directory argument as a module and fails. Size the note to the change: a docs-class or single-file item needs the goal, the file list, the acceptance criteria and the verify command, in under 3000 characters; the full spec-quality pass (alternatives, blast radius, risks) is for items that touch behaviour. Cite `file:line` for a fact the implementer must not re-derive, not for every file mentioned; more than about 30 citations means the verified-facts list should be a `page` document the note names."
        maxLength: 12000
      - key: amendments
        role: queue
        required: false
        seat: planner
        maxLength: 4000
        description: "Fix-cycle rulings A1.., rewritten in full each cycle: decision, files, test edits, red-proof; no line-level trace."
        guidance: "Written by the planner-a<n> seat after a review Fail; the frozen task-scope or diagnosis above is never edited. Rewrite this note in full each cycle so it describes the current ruling set: for each finding, one block of at most eight lines - the ruling (confirmed | refined | rejected, with the one-sentence reason), the implementer's change in behavioural terms (what, in which file; no line-by-line patch trace, the reviewer re-traces the code anyway), the test-author's edits by file, and the red-proof mutation it adds. Superseded rulings collapse to one line `A<n>: <what changed>, <sha>`. Target 1000-2500 characters; the 4000 maxLength is a backstop and was chosen because three accumulated amendments reached 22 KB on one item."
      - key: implementation-notes
        role: work
        required: true
        seat: implementer
        description: "Context handoff — deviations, surprises, and decisions that affect dependent work."
        guidance: "Document decisions made during implementation that weren't in the task scope. Focus on what downstream agents need to know: deviations from the plan, API or interface surprises, assumptions that turned out wrong, and any patterns discovered that affect dependent tasks. Cover the substance — do not pad with boilerplate, restated spec content, or redundant summaries. In a fix cycle (-a<n> seat), rewrite this note in full to describe the current state; replace superseded text rather than appending an amendment section, and keep history to a final 'Amendments:' list with one line per A<n> (what changed, commit SHA)."
        maxLength: 3000
      - key: orchestrator-confirmation
        role: review
        required: false
        seat: orchestrator
        maxLength: 2500
        description: "Disposition register: one line per review finding on THIS item, ending N of N disposed."
        guidance: "Written by the orchestrator when the item's review returns. One line per finding id from this item's findings register: its review-checklist, or, when the schema declares none, the first review-role note the reviewer filled (for example docs-accuracy-review or test-independence-audit): `<id>: fixed <sha|PR> | follow-up <item-id> | accepted: <reason>`; a blocking finding can only be fixed; a follow-up item exists before its line is written. End with `N of N disposed`. Dispose a child's findings on the child when the child closes, never on the parent: the parent's note covers only the parent's own feature review. Re-check results from the same reviewer belong in the reviewer's note, not here. Target 300-1200 characters."

  bug-fix:
    lifecycle: auto
    default_traits: [delegated, session-tracked, needs-test-author]
    seats:
      - { name: planner,      phase: queue }
      - { name: implementer,  phase: work, enters: true }
      - { name: orchestrator, phase: work, after: [implementer] }
      - { name: reviewer,     phase: review }
    notes:
      - key: diagnosis
        role: queue
        required: true
        seat: planner
        description: "Reproduction, root cause, and fix approach."
        skill: "spec-quality"
        maxLength: 6000
        guidance: "This note must cover: reproduction steps (exact inputs and expected vs actual output), root cause (specific file, function, and condition), the defect class (every other site that shares the root-cause pattern - same cast/fallback idiom, predicate, wildcard or error-classification path - found by a named sweep, each frozen as a decision or listed under Deferred with a reason), fix approach with alternatives considered (min 2 options + 'do nothing'), blast radius of the fix, and test strategy (regression test for the bug, edge cases around the fix). Read references/project-concerns.md for codebase-specific constraints. Target ~2500-3500 characters; the 6000 maxLength is a backstop, not a goal - a shorter note that cites file:line and states the decision is better than a longer one that restates context. Name test commands by file path or glob (node --test path/to/*.test.mjs), never by directory: Node 22 on Windows treats a directory argument as a module and fails."
      - key: amendments
        role: queue
        required: false
        seat: planner
        maxLength: 4000
        description: "Fix-cycle rulings A1.., rewritten in full each cycle: decision, files, test edits, red-proof; no line-level trace."
        guidance: "Written by the planner-a<n> seat after a review Fail; the frozen task-scope or diagnosis above is never edited. Rewrite this note in full each cycle so it describes the current ruling set: for each finding, one block of at most eight lines - the ruling (confirmed | refined | rejected, with the one-sentence reason), the implementer's change in behavioural terms (what, in which file; no line-by-line patch trace, the reviewer re-traces the code anyway), the test-author's edits by file, and the red-proof mutation it adds. Superseded rulings collapse to one line `A<n>: <what changed>, <sha>`. Target 1000-2500 characters; the 4000 maxLength is a backstop and was chosen because three accumulated amendments reached 22 KB on one item."
      - key: implementation-notes
        role: work
        required: true
        seat: implementer
        description: "Context handoff for downstream agents — what changed, deviations from the diagnosis, and patterns to apply elsewhere."
        guidance: "Document what was changed and why. Focus on what downstream agents need to know: deviations from the planned fix, whether the root cause was different than diagnosed, patterns that should be applied elsewhere (e.g., same bug exists in similar code paths), and any assumptions that turned out wrong. Cover the substance — do not pad with boilerplate, restated spec content, or redundant summaries. Target ~1500-2200 characters; the 3000 maxLength is a backstop, not a goal."
        maxLength: 3000
      - key: review-checklist
        role: review
        required: true
        seat: reviewer
        description: "Quality gate — fix alignment, test quality, and simplification review."
        skill: "review-quality"
        maxLength: 4000
        guidance: "Verify: (1) the fix addresses the diagnosed root cause and doesn't just mask symptoms, (2) a regression test exists that would have caught the original bug, (3) tests cover edge cases from the diagnosis test strategy, (4) if /simplify was run and made changes, verify those changes have test coverage — the reviewer does not run simplify or make fixes, only reports gaps. This note is the item's findings register: number every finding once here (B1.. blocking, O1.. observation), one line each: location, what was expected, what was found, confidence. Sibling review notes cite these ids and never restate a finding. This note owns acceptance-criteria proof: state `AC n: met (<one citation>)` for each criterion and move on. Dispose a child's findings on the child when it closes; a parent review lists only feature-level findings and never re-lists a child's. Target 1500-2500 characters whatever the item size; the 4000 maxLength is a backstop. A review that needs more is a sign the plan should have been split, not that the note should grow."
      - key: orchestrator-confirmation
        role: review
        required: false
        seat: orchestrator
        maxLength: 2500
        description: "Disposition register: one line per review finding on THIS item, ending N of N disposed."
        guidance: "Written by the orchestrator when the item's review returns. One line per finding id from this item's review-checklist: `<id>: fixed <sha|PR> | follow-up <item-id> | accepted: <reason>`; a blocking finding can only be fixed; a follow-up item exists before its line is written. End with `N of N disposed`. Dispose a child's findings on the child when the child closes, never on the parent: the parent's note covers only the parent's own feature review. Re-check results from the same reviewer belong in the reviewer's note, not here. Target 300-1200 characters."

  plugin-change:
    lifecycle: auto
    default_traits: [session-tracked]
    notes:
      - key: specification
        role: queue
        required: true
        description: "What is changing, why, and expected behavior after the change."
        guidance: "Describe the plugin/config change: what files are affected, what behavior changes, and how to verify. For skill changes, include the trigger phrase and expected output. For hook changes, include the event and matcher. **Plugin blast radius:** consider whether hook caching requires /mcp reconnect, whether CRLF line endings will break script execution, and whether new skill trigger phrases conflict with existing skills. No implementation-notes gate — config changes are self-documenting. Name test commands by file path or glob (node --test path/to/*.test.mjs), never by directory: Node 22 on Windows treats a directory argument as a module and fails."

  quick-fix:
    lifecycle: auto
    notes:
      - key: session-tracking
        role: work
        required: true
        description: "Brief record of what was changed and test results."
        guidance: "This feeds /session-retrospective — one-paragraph summary: what file(s) changed, what the fix was, test pass/fail count. No structured sections needed — keep it under 100 words."

  # Mirrors the global floor's improvement-proposal schema (deploy/global-config). A server
  # exact type now beats a per-root `default`, so the floor copy would resolve here without this
  # block; it is kept to pin the project's own copy of the gates. Keep in sync with the floor copy.
  improvement-proposal:
    lifecycle: auto
    notes:
      - key: proposal
        role: queue
        required: true
        description: "Problem, evidence, proposed change, expected measurable effect, and scope."
        guidance: "State: (1) the problem pattern with evidence — cite session-tracking notes, agent-observation items, or retrospective IDs (2+ occurrences preferred), (2) the concrete change (exact YAML for schema changes, file+section for skill/doc changes, event+matcher for hooks), (3) expected effect and HOW it will be measured in later sessions, (4) blast radius — which schemas, skills, or agents the change touches, (5) scope — **global** (server floor config, plugin skills/hooks, process containers) or **project-specific** (one project's per-root config or workflow); name the target rootId(s) when project-specific. Anchor project-specific proposals under that project's root; global proposals belong in the process-global Improvement Proposals container. If a GitHub issue tracks a global proposal upstream, record it as a final line: github-issue: <url>."
      - key: adoption-decision
        role: work
        required: true
        description: "Accepted / rejected / deferred, with rationale."
        guidance: "Record the decision and why. If accepted: link the implementing item or commit — or, for global proposals tracked upstream, the GitHub issue URL — and confirm the change landed in the layer matching its scope (global config/plugin vs the project's own config.yaml synced per-root). If rejected: state the reason so future retrospectives don't re-propose it. If deferred: state the trigger condition for revisiting."
      - key: outcome-verification
        role: review
        required: true
        description: "Did the change produce the expected effect?"
        guidance: "Compare post-change sessions against the expected effect stated in the proposal note. Cite specific retrospective or session-tracking evidence — scoped to the target project for project-specific changes. Verdict: **effective** | **ineffective** | **inconclusive**. Ineffective outcomes are as valuable as effective ones; say what to try instead. For proposals delegated upstream, 'delegated upstream — tracked in <issue-url>' is a valid closing body."

  container:
    # permanent: a container is a filing cabinet, never a work item — cascades must not
    # terminalize it over queued children, and it never auto-reopens (proposal 7b03dad6).
    lifecycle: permanent
    notes:
      - key: container-summary
        role: queue
        required: false
        description: "Optional high-level description of what this container organizes."
        guidance: "Brief description of the container's purpose and scope. Not required — containers exist to group work items, not to carry implementation detail."

  # The project anchor root (type "project") previously fell to `default`/auto and cascaded to
  # terminal whenever every container under it was terminal (proposal 7b03dad6, 2026-09-15).
  project:
    lifecycle: permanent
    notes: []

  default:
    lifecycle: auto
    default_traits: [session-tracked]
    notes: []

traits:
  needs-migration-review:
    notes:
      - key: migration-assessment
        role: queue
        seat: planner
        required: true
        description: "SQLite migration strategy — table recreation patterns, data migration, rollback plan."
        skill: "migration-review"
        guidance: "Document: (1) what schema changes are needed (new columns, table recreation, index changes), (2) SQLite constraints (no ALTER COLUMN — requires table recreation if modifying existing columns), (3) data migration strategy for existing rows, (4) Flyway migration file name and version number, (5) FTS trigger/rebuild impact if a table with FTS triggers is recreated (see the migration-review table-recreation template), (6) for any migration that copies, backfills or drops data: a Docker upgrade rehearsal on throwaway volumes named q<item>smoke-* (never a live volume) with expected before/after row counts, one injected malformed row, and the count log line the rehearsal must show. The implementer owns the rehearsal. Reference .claude/skills/spec-quality/references/project-concerns.md for SQLite-specific gotchas."

  needs-api-compat-review:
    notes:
      - key: api-compatibility
        role: review
        seat: reviewer
        required: true
        description: "Compatibility assessment for API changes — the MCP tool surface (dynamically re-discovered) and the REST surface (hardcoded clients) have different compatibility models."
        skill: "api-compat-review"
        guidance: "Assess the MCP surface and the REST surface separately — their compatibility models differ, see the api-compat-review skill for the full framework. For any REST-facing change, update openapi.yaml and api-rest.md."

  needs-plugin-update:
    notes:
      - key: plugin-impact
        role: review
        seat: reviewer
        required: true
        description: "Assessment of plugin skill and hook changes needed."
        skill: "plugin-impact-review"
        guidance: "Check: (1) which skills reference the changed behavior (grep skill files for affected tool names, config keys, or concepts), (2) which hooks inject context that references the changed behavior, (3) whether config-format.md needs updating, (4) whether the orchestration-context hook or the orchestrate skill need updating. List specific files and sections that need changes. Plugin content is cached — note if /mcp reconnect is needed."

  needs-security-review:
    notes:
      - key: security-assessment
        role: review
        seat: reviewer
        required: true
        description: "Security review of auth, data handling, and access control."
        skill: "security-review"
        guidance: "Apply the /security-review method to this item's owned-file diff in its worktree — `git -C <worktree> diff <baseSha>..HEAD -- <owned files>` — not by invoking the built-in command, which diffs the session cwd and is empty for a worktree branch. Record here only what the security lens adds: the threat the change addresses in one sentence, residual paths outside the plan's scope (one line each, severity and confidence), and for any validation predicate in the diff the adversarial inputs probed and their results (a table of inputs is fine; prose repeating the table is not). Every finding goes into `review-checklist` as B# or O#; here cite the id, never the finding. Closed paths are proved once, in the findings register's AC lines (review-checklist, or the first review-role note the reviewer filled on a schema without one); cite them here as `Closed paths: <register> AC n, AC m` and add only what the security lens sees beyond them. Verdict: no blocking finding | blocking (ids). Target 800-1500 characters; the 4000 maxLength is a backstop."
        maxLength: 4000

  needs-perf-review:
    notes:
      - key: performance-baseline
        role: queue
        seat: planner
        required: false
        description: "Performance impact assessment and measurement plan."
        skill: "perf-review"
        guidance: "Document: (1) which hot paths are affected (per-request, per-item loops, startup), (2) expected performance impact (new DB queries, JSON parsing, file I/O), (3) whether the change is O(n) where n could be large, (4) measurement plan — how to verify performance is acceptable. This note is optional — use it when the change touches known hot paths or adds significant new work."

  delegated:
    notes:
      - key: delegation-metadata
        role: work
        seat: orchestrator
        required: false
        description: "Model, isolation, rationale, and outcome for a delegated dispatch (orchestrator-filled)."
        guidance: "Filled by the orchestrator AFTER the run (the seats do not know their model). Line 1 MUST be the structured provenance line exactly as run-planner provenance generated it (Method A: <runDir>/provenance*.txt; Method B: run-planner provenance --usage), copied verbatim, never retyped. Line 2, when any seat ran outside the run (an -a<n> fix seat, a docs seat, a resumed or reseated reviewer), is extra-seats=<seat>:<model>:<tokens>,... taken from the reseat ledger or the Agent result usage. Prose (rationale, outcome) may follow on line 3 or later and must not restate a model the line already records. Optional; absent is tolerated, but a prose-only note is a defect the retrospective flags."
    dispatch:
      queue:
        seats:
          planner: { model: opus }
      work:
        agent: task-orchestrator:implementer
        seats:
          implementer:  { model: sonnet }
          test-author:  { agent: null, model: sonnet }   # blind test author: not the implementer agent
          orchestrator: { agent: null }                  # the main session, never dispatched
      review:
        agent: task-orchestrator:reviewer
        effort: high
        seats:
          reviewer: { model: opus }

  # Model-selection traits: seat-only dispatch overrides. A seat-only override that selects a model
  # wins over `delegated`'s seat defaults whatever the trait order (current/docs/config-reference.md,
  # "Seat dispatch precedence"), while inheriting its phase agent/effort. Both are opt-in, applied per
  # item at tier classification (/implement Step 1).
  complex-implementation:
    dispatch:
      work:
        seats:
          implementer: { model: opus }   # architecture-heavy / multi-file synthesis work

  high-stakes:
    dispatch:
      queue:
        seats:
          planner: { model: fable }      # a wrong plan is expensive to unwind
      review:
        seats:
          reviewer: { model: fable }     # security predicates, auth, data-loss paths

  needs-task-review:
    notes:
      - key: review-checklist
        role: review
        required: true
        seat: reviewer
        description: "Task-level quality gate — scope alignment and test coverage."
        maxLength: 4000
        guidance: "Verify: (1) what was built matches the task-scope note — flag scope creep or missed acceptance criteria, (2) tests cover the stated acceptance criteria and aren't strawman tests, (3) no unintended side effects on files outside the task scope. Task-level review does not run /simplify — that happens at the feature-container level. This note is the item's findings register: number every finding once here (B1.. blocking, O1.. observation), one line each: location, what was expected, what was found, confidence. Sibling review notes cite these ids and never restate a finding. This note owns acceptance-criteria proof: state `AC n: met (<one citation>)` for each criterion and move on. Dispose a child's findings on the child when it closes; a parent review lists only feature-level findings and never re-lists a child's. Target 1500-2500 characters whatever the item size; the 4000 maxLength is a backstop. A review that needs more is a sign the plan should have been split, not that the note should grow."

  needs-test-author:
    seats:
      - { name: test-author, phase: work, after: [implementer], reads_exclude: [implementation-notes, session-tracking] }
    notes:
      - key: test-plan
        role: queue
        seat: planner
        required: true
        description: "Numbered test scenarios with frozen oracles, derived from acceptance criteria before implementation begins."
        skill: "test-author"
        maxLength: 3500
        guidance: "Write numbered scenarios (S1, S2, ...) derived from the acceptance criteria, partitioned into happy path / failure / edge cases. For each scenario give: input, expected result, and **oracle source** — the spec clause, stated algorithm, or external reference the expected result comes from. Never derive an oracle from 'what the code returns' or from the ticket's worked example alone. Also include: an adversarial probe list (boundary/bypass inputs worth testing), the public signature the tests will compile against, and a separation declaration confirming this note is filled before implementation work begins. Queue placement is the structural lever — the oracle is frozen by this gate before any implementation exists, defeating implementation-derived oracles by ordering. Target ~2000-2800 characters; the 3500 maxLength is a backstop, not a goal."
      - key: test-manifest
        role: work
        seat: test-author
        required: true
        description: "Test-author record — files, commit SHA range, scenario coverage mapping, and forbidden-pattern declaration."
        skill: "test-author"
        maxLength: 3000
        guidance: "Filled by the test author after writing the tests: actor id, test file paths, and commit SHA range; an S-id -> test mapping (covered, or not-covered:reason for each scenario); the adversarial probes actually executed and their results; a forbidden-pattern declaration listing every assumeTrue/@Disabled/escape used, each with justification; an arbitration record for any red-test disputes; and any implementer modification to test files with rationale. This is the audit trail review checks against the test-plan. Target ~1500-2200 characters; the 3000 maxLength is a backstop, not a goal. In a fix cycle (-a<n> seat), rewrite this note in full to describe the current state; replace superseded text rather than appending an amendment section, and keep history to a final 'Amendments:' list with one line per A<n> (what changed, commit SHA)."
      - key: test-independence-audit
        role: review
        seat: reviewer
        required: true
        description: "Reviewer attestation that test authorship was independent of implementation."
        skill: "review-quality"
        maxLength: 2000
        guidance: "Attest to: separation held (test files first appear in the author's commit SHA range; actor id differs from the implementer's, or a temporal-only separation is explicitly declared), the coverage mapping spot-checked by opening at least two mapped tests and reading their bodies rather than trusting the manifest alone, at least one oracle traced back to its cited source, the declared probes actually run, and the forbidden-pattern declaration verified as true: fetch rules `forbidden-test-patterns` and `test-assertion-vacuity` with `docs_read` `get` (`kind` `rule`, `slug` the rule name, `rootId`), read the test bodies behind the manifest's declaration, and confirm every instance of a listed pattern is declared with a justification. An undeclared instance, or a declaration claiming none when instances exist, is BLOCKING regardless of suite pass/fail — the same weight as not-independent. Verdict — one of: **independent** | **independent-degraded** (temporal-only separation) | **not-independent** (blocking, regardless of suite pass/fail). Target ~900-1400 characters; the 2000 maxLength is a backstop, not a goal. Cite the review-checklist's build-state line instead of restating suite counts, and record a blocking finding only as its checklist id. The two-range ownership proof is one line per range (SHA, seat, files touched), not a commit narrative. Fix-cycle rulings live in the amendments note where the schema declares it; on a schema without the key (plugin-change) they are appended to the planning note under '## Amendment A<n>'; either way the frozen planning body above any amendment is never edited, so the planning note's modifiedAt (notes_read list) is its freeze time when the amendments key exists, and the amendment's own section is the only later edit otherwise; confirm the freeze predates the implementer's first commit."

  session-tracked:
    notes:
      - key: session-tracking
        role: work
        required: true
        seat: orchestrator
        description: "Session context — what was done, how it went, and anything the retrospective should know."
        guidance: "Record what happened during implementation. Structure: - **Outcome**: success | partial | failure - **Files changed**: list with brief rationale - **Deviations**: anything that differed from the specification or plan - **Friction**: tool errors, roundtrips, workarounds, API confusion (type + description) - **Gate interactions**: note fill attempts, gate failures encountered - **Observations**: anything worth tracking for process improvement - **Test results**: pass/fail counts, new tests added. Keep it factual and concise — this feeds the session retrospective. Cover the substance — do not pad with boilerplate, restated spec content, or redundant summaries. Target ~600-1200 characters; the 2000 maxLength is a backstop, not a goal. Do not list follow-up item ids or per-finding dispositions here; `orchestrator-confirmation` is their register. One line `Follow-ups: see orchestrator-confirmation` is enough."
        maxLength: 2000

  # Proposal a3f733b6: the orchestrator adds this trait when it writes the first carry-in-* note on an item.
  has-carry-ins:
    notes:
      - key: carry-in-dispositions
        role: queue
        seat: planner
        required: true
        maxLength: 3000
        description: "One line per carry-in-* note on this item: in scope (AC n) | deferred to <item-id> | rejected because <reason>."
        guidance: "List every note on this item whose key starts with carry-in, using the exact key, one line each: `<key>: in scope (AC n) | deferred to <item-id> | rejected because <reason>`. End with the row count as N of N. A carry-in added after you froze task-scope is added to this note by the orchestrator before dispatch. Target ~300-1200 characters; the 3000 maxLength is a backstop, not a goal."

  # Proposal 091bbb95: apply to docs, CHANGELOG and hook-text-only feature-tasks at materialization.
  needs-docs-accuracy-review:
    notes:
      - key: docs-accuracy-review
        role: review
        seat: reviewer
        required: true
        maxLength: 4000
        description: "Docs-accuracy gate: every behavioural claim in the changed docs verified against source before the item can leave review."
        guidance: "Open the file:line behind every claim that states nullability, redaction, ownership, defaults, limits, budgets, ordering or an honest limit and confirm it; wording copied from an existing doc is unverified until its source is opened. Check the Docs and CHANGELOG lines against git diff --name-only <base>...HEAD. Scan changed files for bytes below 0x20 other than TAB and LF, non-UTF-8 bytes and CR line endings. Verdict Pass or Fail, with numbered blocking findings (B1...) and non-blocking (N1...). An uncited semantic claim is an observation; a wrong one is blocking. List verified claims as `file:line -> source file:line` pairs, one per line, with no prose between them; findings B#/N# go into `review-checklist` when the item has one and are cited here by id. A docs-class item's planner lists `claim -> source file:line` pairs as its verified facts and nothing else; the reviewer's job is to open each pair."

