# A ROOT-scope and SERVER-scope document carrying the runs: block with every key set (item 8a71510c, R17).
# Oracle: task-scope Config runs: and the planner additions: stall_after in seconds (integer > 0), budgets with the four
# ceilings tokens, cost_usd (US dollars, number > 0), attempts_per_seat, max_active_seats (integers > 0). cost_usd 12.5 is
# 12500000 micro-USD.
work_item_schemas:
  feature-task:
    notes:
      - key: spec
        role: queue
        required: true
runs:
  stall_after: 300
  budgets:
    tokens: 2000000
    cost_usd: 12.5
    attempts_per_seat: 3
    max_active_seats: 4