# A ROOT-scope and SERVER-scope document carrying the runs: block with every key set (item 8a71510c, R17).
# Oracle: task-scope Config runs: and the planner additions: stall_after in seconds (integer > 0), budgets with the two
# ceilings attempts_per_seat, max_active_seats (integers > 0). tokens and cost_usd were removed in 4.0.1.
work_item_schemas:
  feature-task:
    notes:
      - key: spec
        role: queue
        required: true
runs:
  stall_after: 300
  budgets:
    attempts_per_seat: 3
    max_active_seats: 4