  /config/status-graph:
    get:
      summary: Structural role-transition graph
      operationId: getStatusGraph
      tags: [config]
      description: |
        IMPORTANT: This is the structural/schema-defined graph only. It does NOT reflect
        runtime gate enforcement (note gates, dependency blockers, claim ownership).
        Do not use to pre-compute which transitions to enable in UI — call advance and
        surface the 422 error instead.
      parameters:
        - name: If-None-Match
          in: header
          schema:
            type: string
      responses:
        "200":
          description: Status graph
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusGraphDto"
        "304":
          description: Not modified
        "401":
          $ref: "#/components/responses/Unauthorized"

  /roots/{rootId}/config:
    parameters:
      - name: rootId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Read back the stored per-root config (the head, or a specific version)
      operationId: getProjectConfig
      tags: [project-config]
      description: |
        Requires READ + scope (rootId must be within the token's rootIds when scoped). Mirrors
        the MCP manage_project_config tool's get operation — does not validate that the WorkItem
        itself exists, only that a config version has been pushed. Without `version` this is the
        head; a reset head reads as absent (404). With `version` it is that exact version (a
        reset version is returned with an empty configYaml).
      parameters:
        - name: If-None-Match
          in: header
          schema:
            type: string
          description: >-
            304 when it equals the returned version's `"cfg-v<version>"` or the legacy
            `"cfg-<fingerprint>"`.
        - name: version
          in: query
          schema:
            type: integer
            minimum: 1
          description: Return this exact version instead of the head. Non-integer or < 1 is 400.
        - name: fingerprint
          in: query
          schema:
            type: string
          description: >-
            Optional SHA-256 hex digest (BOM-stripped, CRLF-normalized before hashing — see
            ProjectConfigResponseDto.fingerprint); when supplied, adds a `relation` field
            ("current"/"superseded"/"unknown") to the response, classifying it against the
            root's stored versions.
      responses:
        "200":
          description: Stored config
          headers:
            ETag:
              schema:
                type: string
                description: '"cfg-v<version>"'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectConfigResponseDto"
        "304":
          description: Not modified
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "400":
          description: version is not an integer >= 1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "404":
          description: >-
            No config has been pushed for this root, its head is a reset, or the requested version
            does not exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"

    put:
      summary: Validate and store raw config YAML for a root
      operationId: putProjectConfig
      tags: [project-config]
      description: |
        Requires WRITE_CONFIG + scope. Delegates the full validate-then-persist pipeline
        (size cap -> root exists -> root is depth-0 -> SafeConstructor parse-validate ->
        embedded-rootId guard -> fast-forward fingerprint guard -> append the next version) to
        ConfigService — the SAME service the MCP manage_project_config tool's push
        operation calls, so both surfaces converge on identical DB state for the same payload.

        The embedded-rootId guard: if the parsed document has a top-level project.rootId that
        parses as a UUID and differs from {rootId}, the push is rejected as 422 rootid_mismatch
        unless ?force=true is set. An absent or non-UUID project.rootId is not an error.

        The fast-forward (known-old) guard: the incoming configYaml's fingerprint is classified
        against {rootId}'s stored versions. A fingerprint that is superseded (held by an earlier
        version of the current epoch, or by the pre-versioning history of a migrated root) is
        rejected as 409 superseded — distinct from 412 etag_mismatch, which is a concurrent-write
        guard rather than a known-old-content guard — unless ?force=true is set. current (the
        head's own content) and unknown (divergent edit, or no config yet) both proceed. A reset
        starts a new epoch: pre-reset content is unknown again.

        A byte-identical re-push appends nothing: 200 with the head's own version and
        appended=false.

        Validation is strict (4.0): the document is checked against the config JSON Schema (see
        GET /config/schema), the parser's former soft skips are errors, and semantic rules apply
        (server-only resources and actor_authentication are rejected, default_traits and trait
        resource keys must resolve). Any error rejects the push as 422 parse_error and nothing is
        stored; ?force=true does not bypass it. Plugin and hook settings go under `extensions`.
      parameters:
        - name: If-Match
          in: header
          schema:
            type: string
          description: >-
            Optional; `"cfg-v<n>"` is compared against the head's version, the legacy
            `"cfg-<fingerprint>"` against the head's fingerprint, anything else never matches.
            Evaluated atomically with the append when a head already exists; ignored on a first
            push (no head to match). Not skipped by ?force=true.
        - name: force
          in: query
          schema:
            type: boolean
            default: false
          description: >-
            Bypass push guards — skips both the embedded project.rootId mismatch check and the
            fast-forward fingerprint guard.
      requestBody:
        required: true
        content:
          application/yaml:
            schema:
              type: string
          text/plain:
            schema:
              type: string
      responses:
        "200":
          description: Config validated and stored (or unchanged, for a byte-identical re-push)
          headers:
            ETag:
              schema:
                type: string
                description: '"cfg-v<version>"'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectConfigResponseDto"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: rootId does not resolve to an existing WorkItem
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "409":
          description: >-
            configYaml's fingerprint is known-old (superseded) — held by an earlier version of
            the current epoch but not the head; retry with ?force=true to overwrite anyway
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "412":
          description: >-
            If-Match mismatch against the head (carries a refreshed ETag for the head's version)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "413":
          description: >-
            configYaml exceeds the 128 KiB cap (unchanged); now enforced before the body is fully
            buffered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "422":
          description: >-
            rootId is not depth-0, configYaml failed parse-validation or strict validation
            (parse_error; for validation `details.errors` lists `{path, reason}` pairs with RFC 6901
            JSON Pointer paths, and `details.warnings` any advisory findings), or configYaml embeds
            a mismatched project.rootId (rootid_mismatch)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"

    delete:
      summary: Reset the stored per-root config
      operationId: deleteProjectConfig
      tags: [project-config]
      description: |
        Requires WRITE_CONFIG + scope. Appends an empty version with source "reset" and moves the
        head to it; history is kept in full (every earlier version stays readable, listed by
        /history and a valid rollback target). After a reset the root resolves as one that never
        had a config. Records config.version_created.
      responses:
        "204":
          description: Reset
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: The root had no config, or its head is already a reset (nothing written)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"

  /roots/{rootId}/config/history:
    parameters:
      - name: rootId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: List the stored versions of a root's config, newest first
      operationId: getProjectConfigHistory
      tags: [project-config]
      description: |
        Requires READ + scope. A read view: a root without any config answers 200 with an empty
        versions array and no headVersion. Rollback and reset rows are included with their source.
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: before
          in: query
          schema:
            type: integer
          description: Exclusive upper bound on the version, for paging.
      responses:
        "200":
          description: Version metadata, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigHistoryResponseDto"
        "400":
          description: limit outside 1..200 (validation_error) or before not an integer (bad_request)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /roots/{rootId}/config/rollback:
    parameters:
      - name: rootId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      summary: Roll the config back to an earlier version
      operationId: rollbackProjectConfig
      tags: [project-config]
      description: |
        Requires WRITE_CONFIG + scope. Appends a copy of the requested version as the new head
        (source "rollback"). A target equal to the head writes nothing and answers 200 with
        appended=false. A migrated target whose canonical form is still missing is canonicalized in
        the same unit. Records config.version_created when a version is appended.
      parameters:
        - name: If-Match
          in: header
          schema:
            type: string
          description: Optional; same forms and semantics as on PUT.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version:
                  type: integer
                  minimum: 1
      responses:
        "200":
          description: Rolled back (or unchanged, when the target equals the head)
          headers:
            ETag:
              schema:
                type: string
                description: '"cfg-v<version>"'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectConfigResponseDto"
        "400":
          description: Body missing, not JSON, or version not an integer >= 1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No such version, or the root has no config at all
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "412":
          description: If-Match mismatch against the head
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"

  /roots/{rootId}/config/effective:
    parameters:
      - name: rootId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Effective (layered, per-root-over-global) config view for a root
      operationId: getEffectiveConfig
      tags: [project-config]
      description: |
        Additive route (AR-39/C5): every registered type (the union of this root's per-root
        work_item_schemas keys and the global schema service's keys) that resolves against rootId's
        layered config (one precedence rule: per-root type, global type, per-root default, global
        default), in one response — the same view EffectiveConfigResolver and MCP
        query_items(schema, type=K, rootId=R) already compute. Distinct from GET /config
        (GLOBAL-only) and GET /roots/{rootId}/config (the RAW stored YAML): reports each type's
        RESOLVED base schema only, with no trait merging. Purely additive — no existing /config*
        or /roots/{rootId}/config route, body, or ETag changes.

        Authorization/validation order: READ capability -> parse {rootId} as a UUID (400) ->
        ApiScope.rootIds scope check (403) -> root WorkItem exists (404) -> root is depth-0 (422)
        -> exactly one per-root config read, answered with the same config_unavailable 503 as
        the `advance` tool and GET /items/{id}/gate use.
      parameters:
        - name: If-None-Match
          in: header
          schema:
            type: string
      responses:
        "200":
          description: Effective config for this root
          headers:
            ETag:
              schema:
                type: string
                description: >-
                  '"eff-<fingerprint>"' — a composite SHA-256 over both layers' fingerprints;
                  distinct from the "cfg-" prefix /config* and /roots/{rootId}/config use.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EffectiveConfigDto"
        "304":
          description: Not modified
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: rootId does not resolve to an existing WorkItem
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "422":
          description: rootId resolves to a WorkItem that is not depth-0
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "500":
          description: >-
            The root-lookup read itself failed with a repository error other than not-found (a
            transient DB failure), distinct from the 404 case above.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "503":
          $ref: "#/components/responses/ConfigUnavailable"

  /roots/{rootId}/rules:
    parameters:
      - name: rootId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: List rule keys under a root, metadata only
      operationId: listRules
      tags: [rules]
      description: |
        Requires READ + scope. Returns {key, rulesVersion, updatedAt} for every valid
        rule/<key> plan document under {rootId}, sorted by key ascending, never the body.
        Read-only REST counterpart of the MCP query_rules tool's list operation; both
        surfaces converge on the same RuleService.
      responses:
        "200":
          description: Rule key summaries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleListResponseDto"
        "400":
          description: rootId is missing or not a valid UUID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: rootId does not resolve to an existing WorkItem
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "422":
          description: rootId resolves to a WorkItem that is not depth-0
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "500":
          description: The root-lookup or list read itself failed with a repository error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"

  /roots/{rootId}/rules/{key}:
    parameters:
      - name: rootId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: key
        in: path
        required: true
        schema:
          type: string
          pattern: "^[a-z0-9][a-z0-9._-]{0,99}$"
    get:
      summary: Read back one rule's body and rulesVersion
      operationId: getRule
      tags: [rules]
      description: |
        Requires READ + scope. Reads the rule/<key> plan document under {rootId} verbatim.
        Read-only REST counterpart of the MCP query_rules tool's direct (rootId+key) get
        lookup; both surfaces converge on the same RuleService, so rulesVersion (the backing
        document's contentHash) and body always agree between MCP and REST for the same key.
        REST has no item/skill-pointer mode -- use the MCP query_rules tool with
        itemId+noteKey for that resolution.
      responses:
        "200":
          description: The rule's body and rulesVersion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleResponseDto"
        "400":
          description: rootId is missing or not a valid UUID, or key fails the rule-key grammar
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: >-
            Either rootId does not resolve to an existing WorkItem (error: not_found), or
            rootId is a valid depth-0 root but no rule/<key> document exists there
            (error: rule_not_found).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "422":
          description: rootId resolves to a WorkItem that is not depth-0
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "500":
          description: The root-lookup or document read itself failed with a repository error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"

  /ops/{tool}:
    post:
      summary: Call a 4.0 tool (RPC)
      operationId: callOp
      tags: [ops]
      description: |
        The canonical RPC route over the 4.0 tool registry. The body is the tool's MCP arguments
        (`select` for a read tool, `ops[]` for a write tool, `describe: true` for its schema); the
        answer is the response envelope, byte-equal to what MCP returns for the same arguments and
        access, apart from `meta.reqId` (also the `X-Req-Id` header). The HTTP status comes from the
        envelope error code (200 for ok, 207 for a partial batch); no route picks one by hand.

        Identity is the bearer credential (`api:<tokenId>`); a body `actor` is ignored, so idempotency
        keys (`ops[].idempotencyKey`) are namespaced per token. Capability is checked per select/op
        (ADMIN grants all): a read select lacking it fails the whole call with `forbidden`
        (`scope: capability`), an op element lacking it fails alone and is never executed. The
        token's root/tag scope reaches every handler; an out-of-scope item is `forbidden`
        (`scope: root|tag`), list reads filter instead.

        Faults answer an envelope with status 400 `invalid_request`: a tool that is unknown or not in
        the served profile (field `tool`), a `Content-Type` other than `application/json` (field
        `Content-Type`; absent is accepted), an `Idempotency-Key` header (field `Idempotency-Key`; use
        `ops[].idempotencyKey`), or a body that is not a JSON object (field `$`). A body over 1 MiB
        is 413 `payload_too_large`. A missing or invalid credential keeps the legacy 401 body
        (see Unauthorized). Serves the orchestration profile.

        The `advance` tool (`/ops/advance`) replaces the 3.x `advance_item` and `claim_item` tools and the
        removed `POST /items/{id}/advance` route. Its `ops[]` elements are `transition` (apply a trigger),
        `claim` (by `itemId` or `select`), `release` and `heartbeat`, all needing the `advance` capability.
        Claim ownership and resource leases are enforced on this route exactly as on MCP.

        The `docs_read` and `docs_write` tools replace the 3.x `manage_plan_documents` tool and the removed
        `/roots/{rootId}/plans[/{slug}]` routes. `docs_read` selects are `get`, `list`, `history` and `links`
        (`READ`); `docs_write` ops are `upsert`, `archive`, `unarchive`, `delete`, `attach` and `detach`, all needing
        `write-config`. A document is addressed by `(rootId, kind, slug)`. `bodyFromFile` is refused on this route
        (`invalid_request`, no file read).
      parameters:
        - name: tool
          in: path
          required: true
          description: Registry tool name.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: The tool's arguments, exactly as in an MCP tools/call.
              additionalProperties: true
      responses:
        "200":
          description: Envelope with ok=true; every batch element succeeded (any failed element makes the call 207)
          headers:
            X-Req-Id:
              description: The call's correlation id, equal to meta.reqId.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpsEnvelope"
        "207":
          description: Partial batch - some ops[] elements failed (see results[].error)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpsEnvelope"
        "400":
          description: invalid_request or unknown_parameter envelope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpsEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: forbidden envelope (capability, root or tag scope) or another 403 catalog code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpsEnvelope"
        "413":
          description: payload_too_large envelope (body over 1 MiB)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpsEnvelope"
        "500":
          description: internal envelope (fixed message; detail only in the server log)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpsEnvelope"

  /resources/leases:
    get:
      summary: List active resource leases
      operationId: listResourceLeases
      tags: [resources]
      description: >-
        Cross-project, server-wide - not root-scoped, unlike the rest of this API. Backs the
        resource-lease gate of the `advance` tool's `transition` op and the resources: trait
        dimension. Answers the response envelope: a list page ordered by (resourceKey, holderItemId)
        whose `page.total` equals `items.length` (lease cardinality is bounded, so the list is never
        truncated). Item shape: `{resourceKey, holderItemId, acquiredByActorId?, acquiredAt,
        expiresAt, originalAcquiredAt}`; `acquiredByActorId` is present only for ADMIN callers.
        Requires `read`; a token without it gets `forbidden` (`scope: capability`).
      responses:
        "200":
          description: Envelope with ok=true and a list page of active leases
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpsEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: forbidden envelope (the token lacks `read`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpsEnvelope"

  /resources/leases/{key}:
    delete:
      summary: Force-release a resource lease (operator recovery)
      operationId: forceReleaseResourceLease
      tags: [resources]
      description: >-
        ADMIN only (`admin` capability; otherwise `forbidden` with `scope: capability`, `required:
        admin`). Recovers a lease stuck by a crashed holder without waiting out the TTL (up to 24h) or
        disabling enforcement server-wide; this is the only recovery path now that the advance
        `overrideResourceLeases` flag is gone. WARN-logged with the acting principal's token id.
        Answers the response envelope: `data = {resourceKey, releasedCount}`.
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-z0-9][a-z0-9\-_./]*$'
            maxLength: 128
      responses:
        "200":
          description: Envelope with ok=true; data is {resourceKey, releasedCount}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpsEnvelope"
        "400":
          description: invalid_request envelope (field `key` fails the pattern or length)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpsEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: forbidden envelope (the token lacks `admin`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpsEnvelope"
        "404":
          description: >-
            not_found envelope with detail kind `lease`: no active lease exists on this key (a repeat
            call after a successful release is a 404, not a second 200)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpsEnvelope"

  /resources/leases/history:
    get:
      summary: Lease-interval audit history (who held resource R at time T)
      operationId: listResourceLeaseHistory
      tags: [resources]
      description: >-
        Append-only lease-interval audit log - answers "who held resource R at time T" after a lease
        has already been released, stolen, or force-released, which the current-holders-only
        /resources/leases list cannot. No pruning/retention in v1. Answers the response envelope: a
        list page, newest-first by acquiredAt, with `page.total` equal to `items.length`. Item shape:
        `{resourceKey, holderItemId, acquiredByActorId?, acquiredAt, expiresAt, releasedAt?,
        releaseReason?, releasedByActorId?}`; the two actor ids are present only for ADMIN callers.
        Requires `read`.
      parameters:
        - name: key
          in: query
          required: false
          schema:
            type: string
            pattern: '^[a-z0-9][a-z0-9\-_./]*$'
            maxLength: 128
        - name: at
          in: query
          required: false
          description: >-
            ISO-8601 instant. When present, returns every interval held at that instant
            (acquiredAt <= at < coalesce(releasedAt, expiresAt)). When absent, returns the most
            recent intervals. An unparsable value is invalid_request on field `at`.
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          required: false
          description: Integer from 1 to 200, default 50. Any other value is invalid_request on field `limit`.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Envelope with ok=true and a list page of lease intervals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpsEnvelope"
        "400":
          description: invalid_request envelope (fields key, at or limit)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpsEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: forbidden envelope (the token lacks `read`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpsEnvelope"

  /info:
    get:
      summary: Server metadata and caller capabilities
      operationId: getInfo
      tags: [service]
      responses:
        "200":
          description: Service info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceInfoDto"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /health:
    get:
      summary: Health check — no authentication required
      operationId: healthCheck
      tags: [service]
      security: []
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthDto"
        "503":
          description: Degraded — database unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthDto"

  /.well-known/mcp-task-orchestrator.json:
    servers:
      - url: /
        description: Mounted at the server root, not under /api/v1
    get:
      summary: Service discovery document — no authentication required
      operationId: getWellKnown
      tags: [service]
      security: []
      responses:
        "200":
          description: Service descriptor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WellKnownDto"

  /events:
    get:
      summary: Server-Sent Events stream
      operationId: getEvents
      tags: [events]
      description: |
        Real-time SSE stream. Auth runs in a pre-flight plugin phase (before the SSE handler
        commits the 200 response). Requires read or admin capability.

        This route is exempted from the global auth plugin via publicPaths (matched against the
        request path only, not the full URI, so ?token= and other query strings still match) and
        honors API_AUTH_MODE=none + API_ALLOW_UNAUTHENTICATED=true (see api-rest.md §1) the same
        way the bearer route does — no token required when both opt-in keys are set.

        Browser clients cannot use native EventSource because it does not support custom headers.
        Use a fetch-based SSE library (e.g. @microsoft/fetch-event-source) with
        Authorization: Bearer, or enable API_ALLOW_QUERY_TOKEN_FOR_SSE=true for ?token= access.

        The stream is a projection of the durable events table (4.0, V20): event ids are the
        table's seq (above 10^12, monotonic, durable across restarts), writes from other processes
        sharing the database stream within about one second, and nothing a rolled-back write did
        is ever streamed. Rejections, lease, config and plan-document rows are table-only.

        Scope filtering: root scope (?root= intersected with principal.scope.rootIds) is applied
        identically to the live stream and to Last-Event-ID replay -- every row carries its root_id,
        so replay is not unfiltered. A root-scoped principal (non-null
        scope.rootIds) whose ?root= values do not intersect that scope gets 403 insufficient_scope
        before the SSE stream opens; ?root= present with zero valid UUIDs gets 400 validation_error
        (mixed valid/invalid values narrow and are accepted). A principal with scope.tags_include set
        is additionally filtered per event (live and replay alike), using the same allowsItemTags
        predicate as the REST collection endpoints; see api-rest.md §21/§3. KNOWN LIMITATION:
        item.deleted is dropped for a tag-scoped connection (its tags can no longer be resolved once
        the item is gone) -- see api-rest.md section 25.

        A tags_include-scoped token additionally requires the route's WorkItemRepository wiring;
        if that is unavailable the pre-flight plugin rejects the connection with 403
        insufficient_scope rather than serving an unfiltered stream.

        Event ID namespace is independent from /mcp SSE channel. Do NOT reuse Last-Event-ID
        values across the two channels.
      parameters:
        - name: root
          in: query
          schema:
            type: string
            format: uuid
          description: Root-subtree filter (repeatable); intersected with principal scope
        - name: types
          in: query
          schema:
            type: string
          description: >-
            Comma-separated event type filter. Exempt: sync.lost and auth.expired (control
            events) are always delivered regardless of this filter.
        - name: token
          in: query
          schema:
            type: string
          description: Bearer token (only accepted when API_ALLOW_QUERY_TOKEN_FOR_SSE=true)
        - name: Last-Event-ID
          in: header
          schema:
            type: string
          description: >-
            Resume from this event ID (a seq); replay is read from the events table and filtered
            by root and tags_include the same way the live stream is, deduplicated against live
            delivery by id. API_SSE_BUFFER_SIZE (default 1000) is the replay window. When the id
            is not replayable -- more than the window behind the newest event (buffer_evicted),
            above the newest event, below the 10^12 seq floor (any pre-4.0 ring-buffer id; the floor itself is a valid start-of-log cursor),
            or unparsable (unknown_event_id) -- the server emits a sync.lost event with that reason
            as the first frame, then immediately replays the whole window after it (replay resumes
            from the sentinel's own id, max(10^12, newest - window), not the client's cursor -- no
            second reconnect needed). A blank or absent header is not a resume attempt and never
            triggers sync.lost. API_SSE_BUFFER_SIZE=0 means no replay: every resume behind the
            newest event yields buffer_evicted with no events to replay.
      responses:
        "200":
          description: SSE stream (text/event-stream)
          content:
            text/event-stream:
              schema:
                type: string
                description: |
                  Each event: id:<n>\nevent:<type>\ndata:<ApiEvent JSON>\n\n
                  Event types: item.created, item.updated, item.deleted, item.advanced,
                  note.upserted, note.deleted, dependency.added, dependency.removed,
                  scope.entered, scope.left, sync.lost, auth.expired

                  ApiEvent JSON fields: id, event, itemId (null for sync.lost/auth.expired),
                  modifiedAt, newRole (item.advanced only), actor ({id, kind, parent?}, the writer;
                  domain events only; omitted when unknown, or for a non-admin caller when
                  API_REDACT_NOTE_ATTRIBUTION is true; never proof/verification), rootId (depth-0
                  ancestor of the item; present on every domain event since 4.0, live and on
                  replay; never redacted), and reason -- set only on sync.lost,
                  one of queue_overflow (per-connection queue overflowed), buffer_evicted
                  (resumed Last-Event-ID further behind than the replay window), or
                  unknown_event_id (resumed Last-Event-ID above the newest event, below the
                  seq floor, or unparsable); null/absent on every other event type.

                  auth.expired: sent and the stream closed when the connection's token expires
                  (checked every API_SSE_AUTH_CHECK_INTERVAL_SECONDS). Fires for every JWKS session
                  (exp is a required claim in jwks mode — a token with no exp is rejected at auth
                  time, 401 invalid_token). Does not fire for API_AUTH_MODE=none unauthenticated
                  sessions or for a bearer token with no expires_at — neither has an expiry to watch.
        "400":
          description: >-
            Pre-flight validation failure: ?root= present but yields zero valid UUIDs
            (validation_error, error_description body).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorDto"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
