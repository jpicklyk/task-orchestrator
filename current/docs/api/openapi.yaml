        "401":
          $ref: "#/components/responses/Unauthorized"

  /config/schema:
    get:
      summary: The JSON Schema every config document is validated against
      operationId: getConfigSchema
      tags: [config]
      description: >-
        The JSON Schema (draft 2020-12) for a config document, served byte for byte as
        application/schema+json (not wrapped in an envelope). The ETag changes exactly when the
        schema does.
      parameters:
        - name: If-None-Match
          in: header
          schema:
            type: string
      responses:
        "200":
          description: The schema document
          headers:
            ETag:
              schema:
                type: string
          content:
            application/schema+json:
