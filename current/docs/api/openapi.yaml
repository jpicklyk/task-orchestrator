                      data:
                        $ref: "#/components/schemas/ServiceInfoDto"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: config_invalid envelope (the stored server config head cannot be loaded)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpsEnvelope"
        "503":
          description: >-
            unavailable envelope: the server config head cannot be read, or (jwks verifier) the credential's key set is
            unavailable (no WWW-Authenticate); retry after error.retryAfterMs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpsEnvelope"

  /health:
    get:
      summary: Health check — no authentication required
      operationId: healthCheck
      tags: [service]
      security: []
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthDto"
        "503":
