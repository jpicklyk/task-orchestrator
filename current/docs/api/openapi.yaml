      responses:
        "200":
          description: Released
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceLeaseReleaseResponseDto"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No active lease exists on this key (idempotent-safe — a repeat call 404s, not a second 200)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"

  /resources/leases/history:
    get:
      summary: Lease-interval audit history (who held resource R at time T)
      operationId: listResourceLeaseHistory
      tags: [resources]
      description: >-
        Append-only lease-interval audit log — answers "who held resource R at time T" after a
        lease has already been released, stolen, or force-released, which the current-holders-only
        /resources/leases list cannot. No pruning/retention in v1.
      parameters:
        - name: key
          in: query
          required: false
          schema:
            type: string
            pattern: '^[a-z0-9][a-z0-9\-_./]*$'
            maxLength: 128
        - name: at
          in: query
          required: false
          description: >-
            ISO-8601 instant. When present, returns every interval held at that instant
            (acquiredAt <= at < coalesce(releasedAt, expiresAt)). When absent, returns the most
            recent intervals, newest-first.
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          required: false
          description: Default 100, clamped to [1, 500].
          schema:
            type: integer
      responses:
        "200":
          description: >-
            Matching intervals. acquiredByActorId / releasedByActorId are present per-entry only
            for ADMIN callers (omitted, not null, for others).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceLeaseHistoryResponseDto"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /transitions:
    get:
      summary: Recent transitions across all items
      operationId: listTransitions
      tags: [transitions]
      description: >-
        Scope-filtered by ancestor chain for root_ids-scoped tokens. A scope.tags_include token is
        additionally filtered to transitions on items carrying an allowed tag (item-level exact
        match) — a tag scope matching nothing returns 200 with an empty page, never 403.

        Scan cap: the underlying fetch is bounded at 1000 rows regardless of how many transitions
        match `since`. Beyond that cap, pages come back truncated (hasMore reads false even though
        older matching transitions exist past the scan limit). Narrow `since` rather than paging
        deeper to stay under the cap.
      parameters:
        - name: since
          in: query
          schema:
            type: string
            format: date-time
          description: Default 24 hours ago
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/pageSize"
      responses:
        "200":
          description: Scope-filtered transition history
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageDto"
                  - properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/RoleTransitionDto"
        "401":
          $ref: "#/components/responses/Unauthorized"

