openapi: "3.1.0"
info:
  title: MCP Task Orchestrator REST API
  version: "1.0"
  description: |
    HTTP REST API for the MCP Task Orchestrator. Operates alongside the MCP transport when
    API_ENABLED=true. Base URL: /api/v1

    NOTE: This file is hand-maintained and may lag edge-case behavior. The source code and
    api-rest.md are authoritative. See api-rest.md for full semantics including
    ETag formats, idempotency, audit model, and the SSE replay known limitation.

    Every operation also accepts the optional X-Client-Host request header
    (components/parameters/clientHost), which names the calling client in the call log.

servers:
  - url: /api/v1
    description: REST API base

security:
  - BearerAuth: []

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: |
        Static bearer token (API_AUTH_MODE=bearer) or JWT (API_AUTH_MODE=jwks).
        For SSE, use Authorization header or opt-in ?token= query param.
        Optional opt-in unauthenticated mode (API_AUTH_MODE=none + API_ALLOW_UNAUTHENTICATED=true)
        accepts requests with no Authorization header at all — loopback-only, see api-rest.md §1.

  parameters:
    clientHost:
      name: X-Client-Host
      in: header
      required: false
      description: >-
        Optional name of the calling client application, recorded as the host on the request's call_log
        and events rows. Precedence: this header, else the first User-Agent product token (the text before
        the first slash), else rest. Normalized: control characters dropped, trimmed, lowercased, capped at
        64 code points; an empty result counts as absent. Accepted on every operation. See api-rest.md section 6a.
      schema:
        type: string
    itemId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    noteKey:
      name: key
      in: path
      required: true
      schema:
        type: string
    page:
      name: page
      in: query
      schema:
        type: integer
        default: 1
        minimum: 1
        maximum: 100000
    pageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        default: 50
        minimum: 1
        maximum: 200

  schemas:
    ItemDto:
      type: object
      required: [id, title, summary, role, priority, requiresVerification, tags, traits, properties,
                 createdAt, modifiedAt, roleChangedAt, etag, depth, isClaimed]
      properties:
        id:
          type: string
          format: uuid
        parentId:
          type: string
          format: uuid
          nullable: true
        title:
          type: string
        description:
          type: string
          nullable: true
        summary:
          type: string
        type:
          type: string
          nullable: true
        role:
          type: string
          enum: [queue, work, review, terminal, blocked]
        previousRole:
          type: string
          enum: [queue, work, review]
          nullable: true
        statusLabel:
          type: string
          nullable: true
        priority:
          type: string
          enum: [high, medium, low]
        complexity:
          type: integer
          nullable: true
        requiresVerification:
          type: boolean
        tags:
          type: array
          items:
            type: string
        traits:
          type: array
          items:
            type: string
          description: The item's trait names in order. Always present, possibly empty.
        properties:
          type: object
        createdAt:
          type: string
          format: date-time
        modifiedAt:
          type: string
          format: date-time
        roleChangedAt:
          type: string
          format: date-time
        etag:
          type: string
          description: '"v1-<modifiedAtMillis>" — a conditional-read validator (If-None-Match)'
        depth:
          type: integer
        isClaimed:
          type: boolean
        notes:
          type: array
          items:
            $ref: "#/components/schemas/NoteDto"
          nullable: true
          description: Populated when ?include=notes
        children:
          type: array
          items:
            $ref: "#/components/schemas/ItemDto"
          nullable: true
          description: Populated when ?include=children
        dependencies:
          $ref: "#/components/schemas/DependenciesDto"

    NoteDto:
      type: object
      required: [key, role, body, createdAt, modifiedAt, etag]
      properties:
        key:
          type: string
        role:
          type: string
          enum: [queue, work, review]
        body:
          type: string
        createdAt:
          type: string
          format: date-time
        modifiedAt:
          type: string
          format: date-time
        etag:
          type: string
          description: '"v1-<modifiedAtMillis>" — use as If-Match on PUT'
        actor:
          $ref: "#/components/schemas/ActorClaimDto"
        verification:
          $ref: "#/components/schemas/VerificationDto"

    ActorClaimDto:
      type: object
      nullable: true
      required: [id, kind]
      properties:
        id:
          type: string
          description: "Server-synthesized: api:<tokenId>"
        kind:
          type: string
          enum: [orchestrator, subagent, user, external]
          description: Always "external" for REST API writes
        parent:
          type: string
          nullable: true

    VerificationDto:
      type: object
      nullable: true
      required: [status]
      properties:
        status:
          type: string
          enum: [absent, unchecked, verified, rejected, unavailable]
        verifier:
          type: string
          nullable: true
        reason:
          type: string
          nullable: true
        proof:
          allOf:
            - $ref: '#/components/schemas/ProofEvidenceDto'
          nullable: true
          description: >-
            Forensic evidence about the proof (SHA-256 hash + verified JWT claims), in place of
            the raw proof. Requires ADMIN capability; independent of API_REDACT_NOTE_ATTRIBUTION.
            Null when no proof was supplied, or for a non-admin caller.

    ProofEvidenceDto:
      type: object
      required: [sha256]
      properties:
        sha256:
          type: string
          description: Lowercase hex SHA-256 digest of the proof's UTF-8 bytes.
        iss:
          type: string
          nullable: true
        sub:
          type: string
          nullable: true
        aud:
          type: array
          items:
            type: string
          nullable: true
        jti:
          type: string
          nullable: true
        iat:
          type: integer
          format: int64
          nullable: true
          description: Epoch seconds.
        exp:
          type: integer
          format: int64
          nullable: true
          description: Epoch seconds.
        kid:
          type: string
          nullable: true
        alg:
          type: string
          nullable: true

    RoleTransitionDto:
      type: object
      required: [id, itemId, toRole, trigger, occurredAt]
      properties:
        id:
          type: string
          format: uuid
        itemId:
          type: string
          format: uuid
        fromRole:
          type: string
          nullable: true
        toRole:
          type: string
        trigger:
          type: string
        statusLabel:
          type: string
          nullable: true
        occurredAt:
          type: string
          format: date-time
        actor:
          $ref: "#/components/schemas/ActorClaimDto"
        verification:
          $ref: "#/components/schemas/VerificationDto"
        consumedCredentials:
          type: array
          nullable: true
          items:
            type: string
          description: >-
            Opaque audit labels for credentials/resources this transition consumed — caller-supplied
            credentialRefs unioned with any resource-lease keys the gate auto-derived. Omitted/null
            when empty. NOT subject to API_REDACT_NOTE_ATTRIBUTION — visible to any READ caller,
            unlike actor/verification on this same DTO.

    DependenciesDto:
      type: object
      required: [blocks, blockedBy, related]
      properties:
        blocks:
          type: array
          items:
            $ref: "#/components/schemas/DependencyEdgeDto"
        blockedBy:
          type: array
          items:
            $ref: "#/components/schemas/DependencyEdgeDto"
        related:
          type: array
          items:
            $ref: "#/components/schemas/DependencyEdgeDto"

    DependencyEdgeDto:
      type: object
      required: [id, fromItemId, toItemId, type, createdAt]
      properties:
        id:
          type: string
          format: uuid
        fromItemId:
          type: string
          format: uuid
        toItemId:
          type: string
          format: uuid
        type:
          type: string
          enum: [blocks, relates_to]
        unblockAt:
          type: string
          nullable: true
          enum: [queue, work, review, terminal]
        createdAt:
          type: string
          format: date-time

    ErrorDto:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          description: Machine-readable error code
        message:
          type: string
          description: Human-readable description
        details:
          type: object
          nullable: true

    AuthErrorDto:
      type: object
      description: >-
        OAuth/RFC 6750-style error body used by authentication/authorization rejections
        (401 invalid_request / invalid_token, 403 insufficient_scope) and the SSE pre-flight
        400 validation_error. Unlike ErrorDto it has error_description and no message.
      required: [error, error_description]
      properties:
        error:
          type: string
          description: Machine-readable error code
          enum: [invalid_request, invalid_token, insufficient_scope, validation_error]
        error_description:
          type: string
          description: Human-readable description

    PageDto:
      type: object
      required: [items, page, pageSize, hasMore]
      properties:
        items:
          type: array
          items: {}
        page:
          type: integer
        pageSize:
          type: integer
        totalItems:
          type: integer
          format: int64
          nullable: true
          description: May be null when computing an exact count is expensive.
        hasMore:
          type: boolean
        skipped:
          type: integer
          nullable: true
          description: >
            Count of rows in this page's query window dropped for failing domain validation
            (e.g. a corrupt/legacy row). Omitted when nothing was skipped. The row is still
            counted in totalItems. Invariant: items.size == min(pageSize, totalItems - offset)
            - skipped (clamped to the actual window). No route currently populates it (the item
            list routes moved to items_read in 4.0).

    SearchHitDto:
      type: object
      required: [itemId, field, snippet, score]
      properties:
        itemId:
          type: string
          format: uuid
        field:
          type: string
          description: >-
            The field that contains a match (title or summary for an item hit, title when both
            do; body for a note hit). snippet is taken from it.
        snippet:
          type: string
        score:
          type: number
          format: double
        noteKey:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
          description: >-
            Title of the owning work item (the item's own title for an item hit); omitted when the
            item could not be read.

    NoteSchemaEntryDto:
      type: object
      required: [key, role, required, description]
      properties:
        key:
          type: string
        role:
          type: string
          enum: [queue, work, review]
        required:
          type: boolean
        description:
          type: string
        guidance:
          type: string
          nullable: true
        skill:
          type: string
          nullable: true
        maxLength:
          type: integer
          description: Maximum note-body length configured for this entry. Present only when configured.

    DispatchProfileDto:
      type: object
      description: >-
        Dispatch routing profile for a phase — who/what should pick up the work. Declared per
        trait per phase under traits.<name>.dispatch.<phase> in .taskorchestrator/config.yaml.
        All fields are optional; at least one is present on any profile the server returns.
      properties:
        agent:
          type: string
          description: Opaque agent identifier (e.g. "task-orchestrator:implementer"), never validated against any registry.
        model:
          type: string
          description: Opaque model identifier/alias.
        effort:
          type: string
          enum: [low, medium, high, xhigh, max]
          description: Matched case-sensitively at config-parse time.

    ResourceRequirementDto:
      type: object
      required: [key, mode]
      description: A trait's declared shared-resource requirement.
      properties:
        key:
          type: string
        mode:
          type: string
          enum: [exclusive, advisory]
        ttlSeconds:
          type: integer
          description: Present only when configured.

    SchemaDto:
      type: object
      required: [type, lifecycleMode, hasReviewPhase, notes, defaultTraits]
      properties:
        type:
          type: string
        lifecycleMode:
          type: string
        hasReviewPhase:
          type: boolean
        notes:
          type: array
          items:
            $ref: "#/components/schemas/NoteSchemaEntryDto"
        defaultTraits:
          type: array
          items:
            type: string

    TraitDto:
      type: object
      required: [name, notes]
      description: >-
        dispatch and resources are omitted (not present) when the trait declares neither —
        never an empty map/array. Reflects GLOBAL config only; a per-root override of the
        same trait's dispatch/resources is not visible here.
      properties:
        name:
          type: string
        notes:
          type: array
          items:
            $ref: "#/components/schemas/NoteSchemaEntryDto"
        dispatch:
          type: object
          description: Map of lowercase phase name ("queue"|"work"|"review") to DispatchProfileDto. Omitted when the trait declares no dispatch profiles.
          additionalProperties:
            $ref: "#/components/schemas/DispatchProfileDto"
        resources:
          type: array
          description: Declared shared-resource requirements. Omitted when the trait declares none.
          items:
            $ref: "#/components/schemas/ResourceRequirementDto"

    ConfigSnapshotDto:
      type: object
      required: [schemas, traits, types, statusGraph]
      properties:
        schemas:
          type: array
          items:
            $ref: "#/components/schemas/SchemaDto"
        traits:
          type: array
          items:
            $ref: "#/components/schemas/TraitDto"
        types:
          type: array
          items:
            type: string
        statusGraph:
          $ref: "#/components/schemas/StatusGraphDto"
        defaultSchema:
          $ref: "#/components/schemas/SchemaDto"

    EffectiveSchemaDto:
      type: object
      required: [type, matchedType, configSource, lifecycleMode, hasReviewPhase, notes, defaultTraits]
      description: >-
        A single type's RESOLVED base schema (no trait merging), one entry of
        EffectiveConfigDto.schemas / EffectiveConfigDto.defaultSchema.
      properties:
        type:
          type: string
          description: The queried type key.
        matchedType:
          type: string
          description: >-
            The schema that actually answered the lookup — "default" when a default schema
            answered a miss on the queried type.
        configSource:
          type: string
          enum: [per-root, global]
          description: Which layer supplied the schema — same literal MCP query_items(schema) uses.
        configFingerprint:
          type: string
          nullable: true
          description: The supplying layer's fingerprint, omitted when that layer has none.
        lifecycleMode:
          type: string
        hasReviewPhase:
          type: boolean
        notes:
          type: array
          items:
            $ref: "#/components/schemas/NoteSchemaEntryDto"
        defaultTraits:
          type: array
          items:
            type: string

    EffectiveConfigDto:
      type: object
      required: [rootId, schemas, traits, types, statusGraph]
      description: >-
        Full per-root EFFECTIVE (layered) config view returned by
        GET /roots/{rootId}/config/effective — every registered type resolved against rootId's
        per-root config over the global fallback, in one response. Additive: distinct from
        ConfigSnapshotDto (GLOBAL-only) and the raw stored YAML /roots/{rootId}/config returns.
      properties:
        rootId:
          type: string
          format: uuid
        schemas:
          type: array
          items:
            $ref: "#/components/schemas/EffectiveSchemaDto"
        traits:
          type: array
          items:
            $ref: "#/components/schemas/TraitDto"
        types:
          type: array
          items:
            type: string
          description: The union of the per-root and global schema keys, in ascending natural String order; always equal to the `type` values of `schemas`. Each key resolves by one precedence rule (per-root exact type, global exact type, per-root default, global default).
        statusGraph:
          $ref: "#/components/schemas/StatusGraphDto"
        defaultSchema:
          $ref: "#/components/schemas/EffectiveSchemaDto"
        globalFingerprint:
          type: string
          nullable: true
          description: Omitted when no global config is loaded.
        perRootFingerprint:
          type: string
          nullable: true
          description: Omitted when no per-root config is pushed for this root.

    StatusGraphTypeDto:
      type: object
      required: [type, lifecycleMode, hasReviewPhase, transitions]
      properties:
        type:
          type: string
        lifecycleMode:
          type: string
        hasReviewPhase:
          type: boolean
        transitions:
          type: object
          additionalProperties:
            type: object
            additionalProperties:
              type: string
          description: |
            role -> trigger -> targetRole. Value "<previousRole>" is a sentinel string
            for blocked.resume — resolve from the live item's previousRole field.

    StatusGraphDto:
      type: object
      required: [roles, triggers, types]
      properties:
        roles:
          type: array
          items:
            type: string
        triggers:
          type: array
          items:
            type: string
        types:
          type: array
          items:
            $ref: "#/components/schemas/StatusGraphTypeDto"

    ServiceInfoDto:
      type: object
      required: [serverName, version, apiVersion, capabilities, claimModeAvailable,
                 actorAuthenticationEnabled, features, configWarnings]
      properties:
        serverName:
          type: string
        version:
          type: string
        apiVersion:
          type: string
        capabilities:
          type: array
          items:
            type: string
        claimModeAvailable:
          type: boolean
        actorAuthenticationEnabled:
          type: boolean
        features:
          type: array
          items:
            type: string
          description: >-
            A1/A2: server-wide optional-response feature advertisement (currently
            ["seats", "dispatchBySeat", "independent_of", "rules"]), advertised unconditionally regardless
            of whether the resolved config for any given root declares seats or independent_of.
            Same list as WellKnownDto.features.
        configWarnings:
          type: array
          items:
            type: string
          description: >-
            Warnings stored with the SERVER config head: the reasons recorded when the global config file was
            imported at boot (one per legacy top-level key such as orchestration, retrospective, actor_attribution
            or schema_resolution), in the form push warnings use. Empty when there is no server config.

    WellKnownDto:
      type: object
      required: [name, version, apiVersion, apiUrl, features]
      description: Service discovery document served at GET /.well-known/mcp-task-orchestrator.json (mounted at the root, not under /api/v1).
      properties:
        name:
          type: string
        version:
          type: string
        apiVersion:
          type: string
        apiUrl:
          type: string
        features:
          type: array
          items:
            type: string
          description: A1/A2 — same server-wide feature advertisement as ServiceInfoDto.features.

    SeatDto:
      type: object
      required: [name, phase]
      description: >-
        One declared orchestration seat (A1) — parsed, merged, and served, but not itself
        enforced by the server. See config-format.md "Seats (Trait & Schema Dimension)".
      properties:
        name:
          type: string
        phase:
          type: string
          enum: [queue, work, review]
        enters:
          type: boolean
          description: Present only when true.
        after:
          type: array
          items:
            type: string
          description: Seat names this seat's work logically follows. Present only when non-empty.
        readsExclude:
          type: array
          items:
            type: string
          description: Note keys this seat should not read. Present only when non-empty.

    ItemSchemaNoteEntryDto:
      type: object
      required: [key, role, required, description]
      description: >-
        Full note-schema entry of the item schema view (items_read select schema) — same base shape as
        NoteSchemaEntryDto, plus the A1 seat fields. A distinct schema from NoteSchemaEntryDto
        because /config* and /config/effective (which use NoteSchemaEntryDto) do not serve seats
        in A1.
      properties:
        key:
          type: string
        role:
          type: string
          enum: [queue, work, review]
        required:
          type: boolean
        description:
          type: string
        guidance:
          type: string
          nullable: true
        skill:
          type: string
          nullable: true
        maxLength:
          type: integer
          description: Maximum note-body length configured for this entry. Present only when configured.
        seat:
          type: string
          nullable: true
          description: >-
            A1: this entry's declared owning seat. Present (possibly null) only when the schema
            is seat-aware; omitted entirely for a seat-less schema. null means the note has no
            owning seat and is served under "unowned" in missingBySeat.
        independentOf:
          type: array
          items:
            type: string
          description: >-
            A1: seat names this note's authoring must stay independent of. Present only when
            non-empty, regardless of seat-awareness. Parsed and served since A1; enforced as of A2
            (the independence attestation gate) — see config-format.md "Independence (A2)".

    ItemSchemaViewDto:
      type: object
      required: [type, configSource, notes, features]
      description: >-
        The item schema view (A1c), now served as the data of items_read select schema (4.0; the
        GET /items/{id}/schema route and query_items were removed), built by the
        ItemSchemaView server-side builder, never a second, separately
        maintained builder.
      properties:
        type:
          type: string
        configFingerprint:
          type: string
          nullable: true
        configSource:
          type: string
          enum: [per-root, global]
        notes:
          type: array
          items:
            $ref: "#/components/schemas/ItemSchemaNoteEntryDto"
        dispatch:
          type: object
          description: Map of lowercase phase name ("queue"|"work"|"review") to DispatchProfileDto. Omitted when no resolved trait declares a profile for any phase.
          additionalProperties:
            $ref: "#/components/schemas/DispatchProfileDto"
        resources:
          type: array
          description: Trait-declared shared-resource requirements. Omitted when none resolve.
          items:
            $ref: "#/components/schemas/ResourceRequirementDto"
        seats:
          type: array
          items:
            $ref: "#/components/schemas/SeatDto"
          description: A1 — merged-seat order. Present only for a seat-aware schema.
        dispatchBySeat:
          type: object
          description: >-
            A1: map of lowercase phase name to a map of seat name to DispatchProfileDto. Present
            only for a seat-aware schema; a phase is included only when at least one of its seats
            has a resolved profile.
          additionalProperties:
            type: object
            additionalProperties:
              $ref: "#/components/schemas/DispatchProfileDto"
        features:
          type: array
          items:
            type: string
          description: A1 — always present, same server-wide feature advertisement as ServiceInfoDto.features.

    HealthDto:
      type: object
      required: [status, dbReachable]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        dbReachable:
          type: boolean

    ProjectConfigResponseDto:
      type: object
      required: [rootId, fingerprint, updatedAt]
      properties:
        rootId:
          type: string
          format: uuid
        fingerprint:
          type: string
          description: >-
            SHA-256 hex digest of the stored configYaml's UTF-8 bytes, after stripping one
            leading BOM and normalizing CRLF to LF (the stored configYaml itself is unchanged)
        updatedAt:
          type: string
          format: date-time
        configYaml:
          type: string
          nullable: true
          description: Raw stored YAML text; present on GET only (omitted on PUT)
        warning:
          type: string
          nullable: true
          description: Non-fatal notice when the root's `type` is not "project"
        relation:
          type: string
          nullable: true
          enum: [current, superseded, unknown]
          description: >-
            Present on GET only, and only when ?fingerprint= was supplied — classifies that
            fingerprint against the root's stored fingerprint history.
        schemaWarnings:
          type: array
          nullable: true
          items:
            type: string
          description: >-
            Present on PUT only, and only for advisory findings (a resource key declared by three
            or more traits, a required note no declared seat owns). The push still succeeds and
            the config is still stored regardless of schemaWarnings. Omitted entirely when empty.
            The 3.x ignoredSections field was removed in 4.0: a key the per-root layer does not
            honor is now rejected with 422 parse_error, not ignored.
        version:
          type: integer
          minimum: 1
          nullable: true
          description: >-
            The per-root version number of the config version this response reports (the new head
            on PUT and rollback). The ETag is `"cfg-v<version>"`.
        source:
          type: string
          nullable: true
          enum: [push, file-import, migration, rollback, reset]
          description: How the reported config version came to exist.
        appended:
          type: boolean
          nullable: true
          description: >-
            PUT and rollback only: false when nothing was written (a byte-identical re-push, or a
            rollback to the head's own content); `version` is then the unchanged head.

    ConfigVersionSummaryDto:
      type: object
      required: [version, fingerprint, source, createdAt, warningsCount, canonical]
      description: One stored config version's metadata (never its YAML).
      properties:
        version:
          type: integer
          minimum: 1
        fingerprint:
          type: string
        source:
          type: string
          enum: [push, file-import, migration, rollback, reset]
        createdAt:
          type: string
          format: date-time
        principalId:
          type: string
          nullable: true
        warningsCount:
          type: integer
        canonical:
          type: boolean
          description: >-
            False only for a migrated version the config-canonicalize upgrade step has not filled
            yet.

    ConfigHistoryResponseDto:
      type: object
      required: [rootId, versions]
      properties:
        rootId:
          type: string
          format: uuid
        headVersion:
          type: integer
          nullable: true
          description: The current head's version, or null when the root has no config at all.
        versions:
          type: array
          description: Newest first.
          items:
            $ref: "#/components/schemas/ConfigVersionSummaryDto"

    RuleResponseDto:
      type: object
      required: [rootId, key, rulesVersion, body]
      description: >-
        Section 19a's per-key rule read. Mirrors the MCP query_rules tool's get data payload
        minus resolvedFrom (REST has no item/skill-pointer mode).
      properties:
        rootId:
          type: string
          format: uuid
        key:
          type: string
          description: Rule key, matching ^[a-z0-9][a-z0-9._-]{0,99}$
        rulesVersion:
          type: string
          description: >-
            The backing rule document's contentHash (same value docs_read reports for
            kind rule, slug <key>).
        body:
          type: string
          description: Raw stored rule text, served byte-for-byte as stored.

    RuleSummaryDto:
      type: object
      required: [key, rulesVersion, updatedAt]
      description: One row of RuleListResponseDto.rules (section 19a); metadata only, never the body.
      properties:
        key:
          type: string
        rulesVersion:
          type: string
        updatedAt:
          type: string
          format: date-time

    RuleListResponseDto:
      type: object
      required: [rootId, rules]
      properties:
        rootId:
          type: string
          format: uuid
        rules:
          type: array
          description: Ordered by key ascending.
          items:
            $ref: "#/components/schemas/RuleSummaryDto"

    OpsEnvelope:
      type: object
      description: >-
        The 4.0 response envelope: ok, then data (success) or error {code, kind, message, fix?, detail?}
        (failure), and meta {reqId}. Per-tool data shapes are served by the tool's describe call.
      required: [ok, meta]
      properties:
        ok:
          type: boolean
        data:
          type: object
          additionalProperties: true
        error:
          type: object
          additionalProperties: true
        meta:
          type: object
          required: [reqId]
          properties:
            reqId:
              type: string

  responses:
    Unauthorized:
      description: >-
        Missing or invalid bearer token. error is invalid_request (missing, non-Bearer or empty
        credential) or invalid_token (unknown, expired or invalid token); the body carries
        error_description, not message, and the response has a WWW-Authenticate header.
      headers:
        WWW-Authenticate:
          description: Bearer challenge, e.g. Bearer error="invalid_token"
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AuthErrorDto"
    Forbidden:
      description: >-
        Authenticated but lacks required capability or scope. insufficient_scope uses the
        AuthErrorDto body (error_description); host_not_allowed, scope_forbidden and
        insufficient_capability use ErrorDto (message).
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/ErrorDto"
              - $ref: "#/components/schemas/AuthErrorDto"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorDto"
    BadRequest:
      description: Invalid request parameters or body
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorDto"
    InternalServerError:
      description: Database or server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorDto"
    ConfigUnavailable:
      description: >-
        error="config_unavailable" — the item's (or root's) per-root config could not be read and
        there was no last-known-good cached config to serve; transient, retryable, no Retry-After
        header. REST and the MCP tools share one per-root config cache, so this is rarer than a
        per-surface cache would produce.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorDto"

paths:
  /items/{id}:
    get:
      summary: Get a single work item (items_read select get)
      operationId: getItem
      tags: [items]
      description: |
        Equivalent to `POST /api/v1/ops/items_read` with `{"select":"get","itemId":"<id>"}`: the same
        dispatcher, the same access (the bearer principal, its root/tag scope and capabilities) and the
        same envelope body, apart from `meta.reqId`. `id` is a UUID or an 8 to 32 hex-character prefix.

        The route takes no query parameter: any is `unknown_parameter` (`/<name>`); timestamps,
        ancestors and `ifVersion` are served by the select over `/ops`. A successful answer carries
        `ETag: "v<version>"`; a request whose `If-None-Match` names it (a tag list, a weak validator
        or `*`, as for the note GET) is answered `304 Not Modified` with no body. An error is never a 304 and carries no ETag: an item outside the
        caller's scope is `403 forbidden` (a missing id under a restricted scope too), whatever
        `If-None-Match` says.
      parameters:
        - name: id
          in: path
          required: true
          description: Item id, a UUID or an 8 to 32 hex-character prefix.
          schema:
            type: string
        - name: If-None-Match
          in: header
          required: false
          description: ETags from previous reads (a list, weak validators or `*`); naming the current one answers 304.
          schema:
            type: string
      responses:
        "200":
          description: Envelope with `data` = the full item view (lean: empty members omitted, tags as an array)
          headers:
            ETag:
              description: '"v<version>" of the item read.'
              schema:
                type: string
            X-Req-Id:
              description: The call's correlation id, equal to meta.reqId.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpsEnvelope"
        "304":
          description: Not Modified - If-None-Match names the current ETag (no body)
        "400":
          description: invalid_request (malformed id) or unknown_parameter (any query parameter) envelope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpsEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: forbidden envelope (capability, root or tag scope)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpsEnvelope"
        "404":
          description: not_found envelope (unrestricted caller only)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpsEnvelope"
        "409":
          description: ambiguous_id envelope (the prefix matches several items the caller may see)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpsEnvelope"
        "500":
          description: internal envelope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpsEnvelope"

  /items/{id}/children:
    get:
      summary: List an item's direct children (items_read select list)
      operationId: getItemChildren
      tags: [items]
      description: |
        Equivalent to `POST /api/v1/ops/items_read` with `{"select":"list","parentId":"<id>","limit"?,"cursor"?}`:
        the same dispatcher, access and envelope body, apart from `meta.reqId`. The page is the
        compact item view (`id`/`parentId` as 8-hex short ids) with `data.page {total, truncated,
        capped?, next?}`; the caller's root/tag scope is applied before paging, so `total` counts only
        visible children. A parent the caller may not see, or one that matches nothing, is an empty
        page. Only `limit` and `cursor` are accepted (anything else is `unknown_parameter`); a
        non-integer `limit` is `invalid_request`. No ETag.
      parameters:
        - name: id
          in: path
          required: true
          description: Parent item id, a UUID or an 8 to 32 hex-character prefix.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Page size, 1 to 200 (default 50).
          schema:
            type: integer
        - name: cursor
          in: query
          required: false
          description: The page.next of the previous page.
          schema:
            type: string
      responses:
        "200":
          description: Envelope with `data` = {items, page}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpsEnvelope"
        "400":
          description: invalid_request, invalid_cursor or unknown_parameter envelope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpsEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: forbidden envelope (capability; or a prefix that matches no item the caller may see)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpsEnvelope"
        "409":
          description: ambiguous_id envelope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpsEnvelope"

  /items/{id}/notes:
    get:
      summary: List notes for an item (notes_read list)
      operationId: listNotes
      tags: [notes]
      description: |
        A thin translation to `notes_read select=list`: the answer is the response envelope, byte-equal to
        `POST /ops/notes_read` for the same arguments apart from `meta.reqId`. `data.items[]` are note summaries
        `{id (8 hex characters), key, role, version, bodyLength, modifiedAt, actor?, verification?}` ordered by key
        and never carry a body (read one with the single-note route). `actor` and `verification` are present only when
        the caller may see attribution (an admin, or `API_REDACT_NOTE_ATTRIBUTION=false`); proof evidence is never
        shown. `data.page` is `{total, truncated, next?}` with an opaque cursor (envelope amendment U22): `total` is the
        full count on every page, `truncated` is true exactly when notes exist after this page, and `next` is present
        exactly when `truncated`. A query parameter other than the four below is `invalid_request` (400).
      parameters:
        - $ref: "#/components/parameters/itemId"
        - name: role
          in: query
          schema:
            type: string
            enum: [queue, work, review]
        - name: keys
          in: query
          description: Comma-separated note keys to keep.
          schema:
            type: string
        - name: limit
          in: query
          description: Page size, 1 to 200 (default 50).
          schema:
            type: integer
        - name: cursor
          in: query
          description: Opaque cursor from the previous page's `data.page.next`.
          schema:
            type: string
      responses:
        "200":
          description: Envelope with ok=true
          headers:
            X-Req-Id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpsEnvelope"
        "400":
          description: invalid_request, unknown_parameter or invalid_cursor envelope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpsEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: forbidden envelope (capability, root or tag scope)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpsEnvelope"
        "404":
          description: not_found or ambiguous_id envelope for the item id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpsEnvelope"

  /items/{id}/notes/{key}:
    get:
      summary: Get a single note by key (notes_read get)
      operationId: getNote
      tags: [notes]
      description: |
        A thin translation to `notes_read select=get`: the answer is the response envelope whose `data` is
        `{id, key, role, version, body, modifiedAt, actor?, verification?}`. The `ETag` response header is `"v{version}"`;
        an `If-None-Match` naming it (or `*`) answers 304 with no body. Writes have no resource route: use
        `POST /ops/notes_write` (`upsert`, `delete`, each with an optional `expectedVersion`). The route takes no query
        parameter.
      parameters:
        - $ref: "#/components/parameters/itemId"
        - $ref: "#/components/parameters/noteKey"
        - name: If-None-Match
          in: header
          schema:
            type: string
      responses:
        "200":
          description: Envelope with ok=true
          headers:
            ETag:
              description: '"v{version}" of the note.'
              schema:
                type: string
            X-Req-Id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpsEnvelope"
        "304":
          description: The note is still at the version named by If-None-Match (empty body)
          headers:
            ETag:
              schema:
                type: string
        "400":
          description: invalid_request or unknown_parameter envelope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpsEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: forbidden envelope (capability, root or tag scope)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpsEnvelope"
        "404":
          description: not_found envelope (item, or note with id "<itemUuid>/<key>") or ambiguous_id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpsEnvelope"

  /items/{id}/transitions:
    get:
      summary: Role-transition audit history for an item
      operationId: getItemTransitions
      tags: [transitions]
      parameters:
        - $ref: "#/components/parameters/itemId"
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/pageSize"
      responses:
        "200":
          description: Paginated transition history
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageDto"
                  - properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/RoleTransitionDto"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /transitions:
    get:
      summary: Recent transitions across all items
      operationId: listTransitions
      tags: [transitions]
      description: >-
        Scope-filtered by ancestor chain for root_ids-scoped tokens. A scope.tags_include token is
        additionally filtered to transitions on items carrying an allowed tag (item-level exact
        match) — a tag scope matching nothing returns 200 with an empty page, never 403.

        Scan cap: the underlying fetch is bounded at 1000 rows regardless of how many transitions
        match `since`. Beyond that cap, pages come back truncated (hasMore reads false even though
        older matching transitions exist past the scan limit). Narrow `since` rather than paging
        deeper to stay under the cap.
      parameters:
        - name: since
          in: query
          schema:
            type: string
            format: date-time
          description: Default 24 hours ago when absent or blank. An unparsable value returns 400 validation_error.
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/pageSize"
      responses:
        "200":
          description: Scope-filtered transition history
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageDto"
                  - properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/RoleTransitionDto"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /config:
    get:
      summary: Full config snapshot
      operationId: getConfig
      tags: [config]
      parameters:
        - name: If-None-Match
          in: header
          schema:
            type: string
      responses:
        "200":
          description: Config snapshot
          headers:
            ETag:
              schema:
                type: string
                description: '"cfg-<fingerprint>"'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigSnapshotDto"
        "304":
          description: Not modified
        "401":
          $ref: "#/components/responses/Unauthorized"

  /config/schemas:
    get:
      summary: All schema definitions
      operationId: listSchemas
      tags: [config]
      parameters:
        - name: If-None-Match
          in: header
          schema:
            type: string
      responses:
        "200":
          description: Schema list
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SchemaDto"
        "304":
          description: Not modified
        "401":
          $ref: "#/components/responses/Unauthorized"

  /config/schemas/{type}:
    get:
      summary: Single schema by type
      operationId: getSchema
      tags: [config]
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
        - name: If-None-Match
          in: header
          schema:
            type: string
      responses:
        "200":
          description: Schema
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchemaDto"
        "304":
          description: Not modified
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /config/traits:
    get:
      summary: All trait definitions
      operationId: listTraits
      tags: [config]
      parameters:
        - name: If-None-Match
          in: header
          schema:
            type: string
      responses:
        "200":
          description: Traits list
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TraitDto"
        "304":
          description: Not modified
        "401":
          $ref: "#/components/responses/Unauthorized"

  /config/types:
    get:
      summary: Sorted list of registered type name strings
      operationId: listTypes
      tags: [config]
      parameters:
        - name: If-None-Match
          in: header
          schema:
            type: string
      responses:
        "200":
          description: Type names
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        "304":
          description: Not modified
        "401":
          $ref: "#/components/responses/Unauthorized"

  /config/schema:
    get:
      summary: The JSON Schema every config document is validated against
      operationId: getConfigSchema
      tags: [config]
      description: >-
        The JSON Schema (draft 2020-12) for a config document, served byte for byte as
        application/schema+json (not wrapped in an envelope). The ETag changes exactly when the
        schema does.
      parameters:
        - name: If-None-Match
          in: header
          schema:
            type: string
      responses:
        "200":
          description: The schema document
          headers:
            ETag:
              schema:
                type: string
          content:
            application/schema+json:
              schema:
                type: object
        "304":
          description: Not modified
        "401":
          $ref: "#/components/responses/Unauthorized"

  /config/status-graph:
    get:
      summary: Structural role-transition graph
      operationId: getStatusGraph
      tags: [config]
      description: |
        IMPORTANT: This is the structural/schema-defined graph only. It does NOT reflect
        runtime gate enforcement (note gates, dependency blockers, claim ownership).
        Do not use to pre-compute which transitions to enable in UI — call advance and
        surface the 422 error instead.
      parameters:
        - name: If-None-Match
          in: header
          schema:
            type: string
      responses:
        "200":
          description: Status graph
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusGraphDto"
        "304":
          description: Not modified
        "401":
          $ref: "#/components/responses/Unauthorized"

  /roots/{rootId}/config:
    parameters:
      - name: rootId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Read back the stored per-root config (the head, or a specific version)
      operationId: getProjectConfig
      tags: [project-config]
      description: |
        Requires READ + scope (rootId must be within the token's rootIds when scoped). Mirrors
        the MCP manage_project_config tool's get operation — does not validate that the WorkItem
        itself exists, only that a config version has been pushed. Without `version` this is the
        head; a reset head reads as absent (404). With `version` it is that exact version (a
        reset version is returned with an empty configYaml).
      parameters:
        - name: If-None-Match
          in: header
          schema:
            type: string
          description: >-
            304 when it equals the returned version's `"cfg-v<version>"` or the legacy
            `"cfg-<fingerprint>"`.
        - name: version
          in: query
          schema:
            type: integer
            minimum: 1
          description: Return this exact version instead of the head. Non-integer or < 1 is 400.
        - name: fingerprint
          in: query
          schema:
            type: string
          description: >-
            Optional SHA-256 hex digest (BOM-stripped, CRLF-normalized before hashing — see
            ProjectConfigResponseDto.fingerprint); when supplied, adds a `relation` field
            ("current"/"superseded"/"unknown") to the response, classifying it against the
            root's stored versions.
      responses:
        "200":
          description: Stored config
          headers:
            ETag:
              schema:
                type: string
                description: '"cfg-v<version>"'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectConfigResponseDto"
        "304":
          description: Not modified
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "400":
          description: version is not an integer >= 1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "404":
          description: >-
            No config has been pushed for this root, its head is a reset, or the requested version
            does not exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"

    put:
      summary: Validate and store raw config YAML for a root
      operationId: putProjectConfig
      tags: [project-config]
      description: |
        Requires WRITE_CONFIG + scope. Delegates the full validate-then-persist pipeline
        (size cap -> root exists -> root is depth-0 -> SafeConstructor parse-validate ->
        embedded-rootId guard -> fast-forward fingerprint guard -> append the next version) to
        ConfigService — the SAME service the MCP manage_project_config tool's push
        operation calls, so both surfaces converge on identical DB state for the same payload.

        The embedded-rootId guard: if the parsed document has a top-level project.rootId that
        parses as a UUID and differs from {rootId}, the push is rejected as 422 rootid_mismatch
        unless ?force=true is set. An absent or non-UUID project.rootId is not an error.

        The fast-forward (known-old) guard: the incoming configYaml's fingerprint is classified
        against {rootId}'s stored versions. A fingerprint that is superseded (held by an earlier
        version of the current epoch, or by the pre-versioning history of a migrated root) is
        rejected as 409 superseded — distinct from 412 etag_mismatch, which is a concurrent-write
        guard rather than a known-old-content guard — unless ?force=true is set. current (the
        head's own content) and unknown (divergent edit, or no config yet) both proceed. A reset
        starts a new epoch: pre-reset content is unknown again.

        A byte-identical re-push appends nothing: 200 with the head's own version and
        appended=false.

        Validation is strict (4.0): the document is checked against the config JSON Schema (see
        GET /config/schema), the parser's former soft skips are errors, and semantic rules apply
        (server-only resources and actor_authentication are rejected, default_traits and trait
        resource keys must resolve). Any error rejects the push as 422 parse_error and nothing is
        stored; ?force=true does not bypass it. Plugin and hook settings go under `extensions`.
      parameters:
        - name: If-Match
          in: header
          schema:
            type: string
          description: >-
            Optional; `"cfg-v<n>"` is compared against the head's version, the legacy
            `"cfg-<fingerprint>"` against the head's fingerprint, anything else never matches.
            Evaluated atomically with the append when a head already exists; ignored on a first
            push (no head to match). Not skipped by ?force=true.
        - name: force
          in: query
          schema:
            type: boolean
            default: false
          description: >-
            Bypass push guards — skips both the embedded project.rootId mismatch check and the
            fast-forward fingerprint guard.
      requestBody:
        required: true
        content:
          application/yaml:
            schema:
              type: string
          text/plain:
            schema:
              type: string
      responses:
        "200":
          description: Config validated and stored (or unchanged, for a byte-identical re-push)
          headers:
            ETag:
              schema:
                type: string
                description: '"cfg-v<version>"'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectConfigResponseDto"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: rootId does not resolve to an existing WorkItem
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "409":
          description: >-
            configYaml's fingerprint is known-old (superseded) — held by an earlier version of
            the current epoch but not the head; retry with ?force=true to overwrite anyway
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "412":
          description: >-
            If-Match mismatch against the head (carries a refreshed ETag for the head's version)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "413":
          description: >-
            configYaml exceeds the 128 KiB cap (unchanged); now enforced before the body is fully
            buffered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "422":
          description: >-
            rootId is not depth-0, configYaml failed parse-validation or strict validation
            (parse_error; for validation `details.errors` lists `{path, reason}` pairs with RFC 6901
            JSON Pointer paths, and `details.warnings` any advisory findings), or configYaml embeds
            a mismatched project.rootId (rootid_mismatch)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"

    delete:
      summary: Reset the stored per-root config
      operationId: deleteProjectConfig
      tags: [project-config]
      description: |
        Requires WRITE_CONFIG + scope. Appends an empty version with source "reset" and moves the
        head to it; history is kept in full (every earlier version stays readable, listed by
        /history and a valid rollback target). After a reset the root resolves as one that never
        had a config. Records config.version_created.
      responses:
        "204":
          description: Reset
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: The root had no config, or its head is already a reset (nothing written)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"

  /roots/{rootId}/config/history:
    parameters:
      - name: rootId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: List the stored versions of a root's config, newest first
      operationId: getProjectConfigHistory
      tags: [project-config]
      description: |
        Requires READ + scope. A read view: a root without any config answers 200 with an empty
        versions array and no headVersion. Rollback and reset rows are included with their source.
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: before
          in: query
          schema:
            type: integer
          description: Exclusive upper bound on the version, for paging.
      responses:
        "200":
          description: Version metadata, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigHistoryResponseDto"
        "400":
          description: limit outside 1..200 (validation_error) or before not an integer (bad_request)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /roots/{rootId}/config/rollback:
    parameters:
      - name: rootId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      summary: Roll the config back to an earlier version
      operationId: rollbackProjectConfig
      tags: [project-config]
      description: |
        Requires WRITE_CONFIG + scope. Appends a copy of the requested version as the new head
        (source "rollback"). A target equal to the head writes nothing and answers 200 with
        appended=false. A migrated target whose canonical form is still missing is canonicalized in
        the same unit. Records config.version_created when a version is appended.
      parameters:
        - name: If-Match
          in: header
          schema:
            type: string
          description: Optional; same forms and semantics as on PUT.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version:
                  type: integer
                  minimum: 1
      responses:
        "200":
          description: Rolled back (or unchanged, when the target equals the head)
          headers:
            ETag:
              schema:
                type: string
                description: '"cfg-v<version>"'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectConfigResponseDto"
        "400":
          description: Body missing, not JSON, or version not an integer >= 1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No such version, or the root has no config at all
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "412":
          description: If-Match mismatch against the head
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"

  /roots/{rootId}/config/effective:
    parameters:
      - name: rootId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Effective (layered, per-root-over-global) config view for a root
      operationId: getEffectiveConfig
      tags: [project-config]
      description: |
        Additive route (AR-39/C5): every registered type (the union of this root's per-root
        work_item_schemas keys and the global schema service's keys) that resolves against rootId's
        layered config (one precedence rule: per-root type, global type, per-root default, global
        default), in one response — the same view EffectiveConfigResolver and MCP
        query_items(schema, type=K, rootId=R) already compute. Distinct from GET /config
        (GLOBAL-only) and GET /roots/{rootId}/config (the RAW stored YAML): reports each type's
        RESOLVED base schema only, with no trait merging. Purely additive — no existing /config*
        or /roots/{rootId}/config route, body, or ETag changes.

        Authorization/validation order: READ capability -> parse {rootId} as a UUID (400) ->
        ApiScope.rootIds scope check (403) -> root WorkItem exists (404) -> root is depth-0 (422)
        -> exactly one per-root config read, answered with the same config_unavailable 503 as
        the `advance` tool and the items_read context select use.
      parameters:
        - name: If-None-Match
          in: header
          schema:
            type: string
      responses:
        "200":
          description: Effective config for this root
          headers:
            ETag:
              schema:
                type: string
                description: >-
                  '"eff-<fingerprint>"' — a composite SHA-256 over both layers' fingerprints;
                  distinct from the "cfg-" prefix /config* and /roots/{rootId}/config use.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EffectiveConfigDto"
        "304":
          description: Not modified
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: rootId does not resolve to an existing WorkItem
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "422":
          description: rootId resolves to a WorkItem that is not depth-0
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "500":
          description: >-
            The root-lookup read itself failed with a repository error other than not-found (a
            transient DB failure), distinct from the 404 case above.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "503":
          $ref: "#/components/responses/ConfigUnavailable"

  /roots/{rootId}/rules:
    parameters:
      - name: rootId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: List rule keys under a root, metadata only
      operationId: listRules
      tags: [rules]
      description: |
        Requires READ + scope. Returns {key, rulesVersion, updatedAt} for every valid
        rule/<key> plan document under {rootId}, sorted by key ascending, never the body.
        Read-only REST counterpart of the MCP query_rules tool's list operation; both
        surfaces converge on the same RuleService.
      responses:
        "200":
          description: Rule key summaries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleListResponseDto"
        "400":
          description: rootId is missing or not a valid UUID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: rootId does not resolve to an existing WorkItem
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "422":
          description: rootId resolves to a WorkItem that is not depth-0
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "500":
          description: The root-lookup or list read itself failed with a repository error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"

  /roots/{rootId}/rules/{key}:
    parameters:
      - name: rootId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: key
        in: path
        required: true
        schema:
          type: string
          pattern: "^[a-z0-9][a-z0-9._-]{0,99}$"
    get:
      summary: Read back one rule's body and rulesVersion
      operationId: getRule
      tags: [rules]
      description: |
        Requires READ + scope. Reads the rule/<key> plan document under {rootId} verbatim.
        Read-only REST counterpart of the MCP query_rules tool's direct (rootId+key) get
        lookup; both surfaces converge on the same RuleService, so rulesVersion (the backing
        document's contentHash) and body always agree between MCP and REST for the same key.
        REST has no item/skill-pointer mode -- use the MCP query_rules tool with
        itemId+noteKey for that resolution.
      responses:
        "200":
          description: The rule's body and rulesVersion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleResponseDto"
        "400":
          description: rootId is missing or not a valid UUID, or key fails the rule-key grammar
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: >-
            Either rootId does not resolve to an existing WorkItem (error: not_found), or
            rootId is a valid depth-0 root but no rule/<key> document exists there
            (error: rule_not_found).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "422":
          description: rootId resolves to a WorkItem that is not depth-0
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "500":
          description: The root-lookup or document read itself failed with a repository error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"

  /ops/{tool}:
    post:
      summary: Call a 4.0 tool (RPC)
      operationId: callOp
      tags: [ops]
      description: |
        The canonical RPC route over the 4.0 tool registry. The body is the tool's MCP arguments
        (`select` for a read tool, `ops[]` for a write tool, `describe: true` for its schema); the
        answer is the response envelope, byte-equal to what MCP returns for the same arguments and
        access, apart from `meta.reqId` (also the `X-Req-Id` header). The HTTP status comes from the
        envelope error code (200 for ok, 207 for a partial batch); no route picks one by hand.

        Identity is the bearer credential (`api:<tokenId>`); a body `actor` is ignored, so idempotency
        keys (`ops[].idempotencyKey`) are namespaced per token. Capability is checked per select/op
        (ADMIN grants all): a read select lacking it fails the whole call with `forbidden`
        (`scope: capability`), an op element lacking it fails alone and is never executed. The
        token's root/tag scope reaches every handler; an out-of-scope item is `forbidden`
        (`scope: root|tag`), list reads filter instead.

        Faults answer an envelope with status 400 `invalid_request`: a tool that is unknown or not in
        the served profile (field `tool`), a `Content-Type` other than `application/json` (field
        `Content-Type`; absent is accepted), an `Idempotency-Key` header (field `Idempotency-Key`; use
        `ops[].idempotencyKey`), or a body that is not a JSON object (field `$`). A body over 1 MiB
        is 413 `payload_too_large`. A missing or invalid credential keeps the legacy 401 body
        (see Unauthorized). Serves the orchestration profile.

        The `advance` tool (`/ops/advance`) replaces the 3.x `advance_item` and `claim_item` tools and the
        removed `POST /items/{id}/advance` route. Its `ops[]` elements are `transition` (apply a trigger),
        `claim` (by `itemId` or `select`), `release` and `heartbeat`, all needing the `advance` capability.
        Claim ownership and resource leases are enforced on this route exactly as on MCP.

        The `docs_read` and `docs_write` tools replace the 3.x `manage_plan_documents` tool and the removed
        `/roots/{rootId}/plans[/{slug}]` routes. `docs_read` selects are `get`, `list`, `history` and `links`
        (`READ`); `docs_write` ops are `upsert`, `archive`, `unarchive`, `delete`, `attach` and `detach`, all needing
        `write-config`. A document is addressed by `(rootId, kind, slug)`. `bodyFromFile` is refused on this route
        (`invalid_request`, no file read).
      parameters:
        - name: tool
          in: path
          required: true
          description: Registry tool name.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: The tool's arguments, exactly as in an MCP tools/call.
              additionalProperties: true
      responses:
        "200":
          description: Envelope with ok=true; every batch element succeeded (any failed element makes the call 207)
          headers:
            X-Req-Id:
              description: The call's correlation id, equal to meta.reqId.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpsEnvelope"
        "207":
          description: Partial batch - some ops[] elements failed (see results[].error)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpsEnvelope"
        "400":
          description: invalid_request or unknown_parameter envelope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpsEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: forbidden envelope (capability, root or tag scope) or another 403 catalog code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpsEnvelope"
        "413":
          description: payload_too_large envelope (body over 1 MiB)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpsEnvelope"
        "500":
          description: internal envelope (fixed message; detail only in the server log)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpsEnvelope"

  /resources/leases:
    get:
      summary: List active resource leases
      operationId: listResourceLeases
      tags: [resources]
      description: >-
        Cross-project, server-wide - not root-scoped, unlike the rest of this API. Backs the
        resource-lease gate of the `advance` tool's `transition` op and the resources: trait
        dimension. Answers the response envelope: a list page ordered by (resourceKey, holderItemId)
        whose `page.total` equals `items.length` (lease cardinality is bounded, so the list is never
        truncated). Item shape: `{resourceKey, holderItemId, acquiredByActorId?, acquiredAt,
        expiresAt, originalAcquiredAt}`; `acquiredByActorId` is present only for ADMIN callers.
        Requires `read`; a token without it gets `forbidden` (`scope: capability`).
      responses:
        "200":
          description: Envelope with ok=true and a list page of active leases
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpsEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: forbidden envelope (the token lacks `read`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpsEnvelope"

  /resources/leases/{key}:
    delete:
      summary: Force-release a resource lease (operator recovery)
      operationId: forceReleaseResourceLease
      tags: [resources]
      description: >-
        ADMIN only (`admin` capability; otherwise `forbidden` with `scope: capability`, `required:
        admin`). Recovers a lease stuck by a crashed holder without waiting out the TTL (up to 24h) or
        disabling enforcement server-wide; this is the only recovery path now that the advance
        `overrideResourceLeases` flag is gone. WARN-logged with the acting principal's token id.
        Answers the response envelope: `data = {resourceKey, releasedCount}`.
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-z0-9][a-z0-9\-_./]*$'
            maxLength: 128
      responses:
        "200":
          description: Envelope with ok=true; data is {resourceKey, releasedCount}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpsEnvelope"
        "400":
          description: invalid_request envelope (field `key` fails the pattern or length)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpsEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: forbidden envelope (the token lacks `admin`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpsEnvelope"
        "404":
          description: >-
            not_found envelope with detail kind `lease`: no active lease exists on this key (a repeat
            call after a successful release is a 404, not a second 200)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpsEnvelope"

  /resources/leases/history:
    get:
      summary: Lease-interval audit history (who held resource R at time T)
      operationId: listResourceLeaseHistory
      tags: [resources]
      description: >-
        Append-only lease-interval audit log - answers "who held resource R at time T" after a lease
        has already been released, stolen, or force-released, which the current-holders-only
        /resources/leases list cannot. No pruning/retention in v1. Answers the response envelope: a
        list page, newest-first by acquiredAt, with `page.total` equal to `items.length`. Item shape:
        `{resourceKey, holderItemId, acquiredByActorId?, acquiredAt, expiresAt, releasedAt?,
        releaseReason?, releasedByActorId?}`; the two actor ids are present only for ADMIN callers.
        Requires `read`.
      parameters:
        - name: key
          in: query
          required: false
          schema:
            type: string
            pattern: '^[a-z0-9][a-z0-9\-_./]*$'
            maxLength: 128
        - name: at
          in: query
          required: false
          description: >-
            ISO-8601 instant. When present, returns every interval held at that instant
            (acquiredAt <= at < coalesce(releasedAt, expiresAt)). When absent, returns the most
            recent intervals. An unparsable value is invalid_request on field `at`.
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          required: false
          description: Integer from 1 to 200, default 50. Any other value is invalid_request on field `limit`.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Envelope with ok=true and a list page of lease intervals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpsEnvelope"
        "400":
          description: invalid_request envelope (fields key, at or limit)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpsEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: forbidden envelope (the token lacks `read`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpsEnvelope"

  /info:
    get:
      summary: Server metadata and caller capabilities
      operationId: getInfo
      tags: [service]
      responses:
        "200":
          description: Service info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceInfoDto"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /health:
    get:
      summary: Health check — no authentication required
      operationId: healthCheck
      tags: [service]
      security: []
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthDto"
        "503":
          description: Degraded — database unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthDto"

  /.well-known/mcp-task-orchestrator.json:
    servers:
      - url: /
        description: Mounted at the server root, not under /api/v1
    get:
      summary: Service discovery document — no authentication required
      operationId: getWellKnown
      tags: [service]
      security: []
      responses:
        "200":
          description: Service descriptor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WellKnownDto"

  /events:
    get:
      summary: Server-Sent Events stream
      operationId: getEvents
      tags: [events]
      description: |
        Real-time SSE stream. Auth runs in a pre-flight plugin phase (before the SSE handler
        commits the 200 response). Requires read or admin capability.

        This route is exempted from the global auth plugin via publicPaths (matched against the
        request path only, not the full URI, so ?token= and other query strings still match) and
        honors API_AUTH_MODE=none + API_ALLOW_UNAUTHENTICATED=true (see api-rest.md §1) the same
        way the bearer route does — no token required when both opt-in keys are set.

        Browser clients cannot use native EventSource because it does not support custom headers.
        Use a fetch-based SSE library (e.g. @microsoft/fetch-event-source) with
        Authorization: Bearer, or enable API_ALLOW_QUERY_TOKEN_FOR_SSE=true for ?token= access.

        The stream is a projection of the durable events table (4.0, V20): event ids are the
        table's seq (above 10^12, monotonic, durable across restarts), writes from other processes
        sharing the database stream within about one second, and nothing a rolled-back write did
        is ever streamed. Rejections, lease, config and plan-document rows are table-only.

        Scope filtering: root scope (?root= intersected with principal.scope.rootIds) is applied
        identically to the live stream and to Last-Event-ID replay -- every row carries its root_id,
        so replay is not unfiltered. A root-scoped principal (non-null
        scope.rootIds) whose ?root= values do not intersect that scope gets 403 insufficient_scope
        before the SSE stream opens; ?root= present with zero valid UUIDs gets 400 validation_error
        (mixed valid/invalid values narrow and are accepted). A principal with scope.tags_include set
        is additionally filtered per event (live and replay alike), using the same allowsItemTags
        predicate as the REST collection endpoints; see api-rest.md §21/§3. KNOWN LIMITATION:
        item.deleted is dropped for a tag-scoped connection (its tags can no longer be resolved once
        the item is gone) -- see api-rest.md section 25.

        A tags_include-scoped token additionally requires the route's WorkItemRepository wiring;
        if that is unavailable the pre-flight plugin rejects the connection with 403
        insufficient_scope rather than serving an unfiltered stream.

        Event ID namespace is independent from /mcp SSE channel. Do NOT reuse Last-Event-ID
        values across the two channels.
      parameters:
        - name: root
          in: query
          schema:
            type: string
            format: uuid
          description: Root-subtree filter (repeatable); intersected with principal scope
        - name: types
          in: query
          schema:
            type: string
          description: >-
            Comma-separated event type filter. Exempt: sync.lost and auth.expired (control
            events) are always delivered regardless of this filter.
        - name: token
          in: query
          schema:
            type: string
          description: Bearer token (only accepted when API_ALLOW_QUERY_TOKEN_FOR_SSE=true)
        - name: Last-Event-ID
          in: header
          schema:
            type: string
          description: >-
            Resume from this event ID (a seq); replay is read from the events table and filtered
            by root and tags_include the same way the live stream is, deduplicated against live
            delivery by id. API_SSE_BUFFER_SIZE (default 1000) is the replay window. When the id
            is not replayable -- more than the window behind the newest event (buffer_evicted),
            above the newest event, below the 10^12 seq floor (any pre-4.0 ring-buffer id; the floor itself is a valid start-of-log cursor),
            or unparsable (unknown_event_id) -- the server emits a sync.lost event with that reason
            as the first frame, then immediately replays the whole window after it (replay resumes
            from the sentinel's own id, max(10^12, newest - window), not the client's cursor -- no
            second reconnect needed). A blank or absent header is not a resume attempt and never
            triggers sync.lost. API_SSE_BUFFER_SIZE=0 means no replay: every resume behind the
            newest event yields buffer_evicted with no events to replay.
      responses:
        "200":
          description: SSE stream (text/event-stream)
          content:
            text/event-stream:
              schema:
                type: string
                description: |
                  Each event: id:<n>\nevent:<type>\ndata:<ApiEvent JSON>\n\n
                  Event types: item.created, item.updated, item.deleted, item.advanced,
                  note.upserted, note.deleted, dependency.added, dependency.removed,
                  scope.entered, scope.left, sync.lost, auth.expired

                  ApiEvent JSON fields: id, event, itemId (null for sync.lost/auth.expired),
                  modifiedAt, newRole (item.advanced only), actor ({id, kind, parent?}, the writer;
                  domain events only; omitted when unknown, or for a non-admin caller when
                  API_REDACT_NOTE_ATTRIBUTION is true; never proof/verification), rootId (depth-0
                  ancestor of the item; present on every domain event since 4.0, live and on
                  replay; never redacted), and reason -- set only on sync.lost,
                  one of queue_overflow (per-connection queue overflowed), buffer_evicted
                  (resumed Last-Event-ID further behind than the replay window), or
                  unknown_event_id (resumed Last-Event-ID above the newest event, below the
                  seq floor, or unparsable); null/absent on every other event type.

                  auth.expired: sent and the stream closed when the connection's token expires
                  (checked every API_SSE_AUTH_CHECK_INTERVAL_SECONDS). Fires for every JWKS session
                  (exp is a required claim in jwks mode — a token with no exp is rejected at auth
                  time, 401 invalid_token). Does not fire for API_AUTH_MODE=none unauthenticated
                  sessions or for a bearer token with no expires_at — neither has an expiry to watch.
        "400":
          description: >-
            Pre-flight validation failure: ?root= present but yields zero valid UUIDs
            (validation_error, error_description body).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorDto"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
