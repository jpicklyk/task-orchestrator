        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ConfigUnavailable"

  /items/{id}/schema:
    get:
      summary: Resolved schema view for a single item (A1c)
      operationId: getItemSchema
      tags: [items]
      description: >-
        Body is EXACTLY equal to MCP query_items(operation="schema", itemId=...)'s data object —
        both this route and that MCP operation call the same ItemSchemaView.buildItemSchemaJson
        builder, so the two responses stay identical by construction. Id handling mirrors
        GET /items/{id} and GET /items/{id}/gate: full UUID only (a hex prefix is rejected),
        checked in order bad_request -> not_found -> scope_forbidden. Shares the same
        configResolver and last-known-good per-root config cache as GET /items/{id}/gate — no
        separate cache. No ETag / If-None-Match handling, same rationale as GET /items/{id}/gate.
      parameters:
        - $ref: "#/components/parameters/itemId"
      responses:
        "200":
          description: Resolved schema view
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemSchemaViewDto"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: >-
            error="not_found" — the item does not exist. error="no_schema" — the item is
            schema-free (no type/tag match, and no "default" schema resolves).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "503":
          $ref: "#/components/responses/ConfigUnavailable"

  /items/{id}/notes:
    get:
      summary: List notes for an item (notes_read list)
      operationId: listNotes
      tags: [notes]
      description: |
        A thin translation to `notes_read select=list`: the answer is the response envelope, byte-equal to
        `POST /ops/notes_read` for the same arguments apart from `meta.reqId`. `data.items[]` are note summaries
        `{id (8 hex characters), key, role, version, bodyLength, modifiedAt, actor?, verification?}` ordered by key
        and never carry a body (read one with the single-note route). `actor` and `verification` are present only when
        the caller may see attribution (an admin, or `API_REDACT_NOTE_ATTRIBUTION=false`); proof evidence is never
        shown. `data.page` is `{total, truncated, next?}` with an opaque cursor (envelope amendment U22): `total` is the
        full count on every page, `truncated` is true exactly when notes exist after this page, and `next` is present
        exactly when `truncated`. A query parameter other than the four below is `invalid_request` (400).
      parameters:
        - $ref: "#/components/parameters/itemId"
        - name: role
          in: query
          schema:
            type: string
            enum: [queue, work, review]
        - name: keys
          in: query
          description: Comma-separated note keys to keep.
          schema:
            type: string
        - name: limit
          in: query
          description: Page size, 1 to 200 (default 50).
          schema:
            type: integer
        - name: cursor
          in: query
          description: Opaque cursor from the previous page's `data.page.next`.
          schema:
            type: string
      responses:
        "200":
          description: Envelope with ok=true
          headers:
            X-Req-Id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpsEnvelope"
        "400":
          description: invalid_request, unknown_parameter or invalid_cursor envelope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpsEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: forbidden envelope (capability, root or tag scope)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpsEnvelope"
        "404":
          description: not_found or ambiguous_id envelope for the item id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpsEnvelope"

  /items/{id}/notes/{key}:
    get:
      summary: Get a single note by key (notes_read get)
      operationId: getNote
      tags: [notes]
      description: |
        A thin translation to `notes_read select=get`: the answer is the response envelope whose `data` is
        `{id, key, role, version, body, modifiedAt, actor?, verification?}`. The `ETag` response header is `"v{version}"`;
        an `If-None-Match` naming it (or `*`) answers 304 with no body. Writes have no resource route: use
        `POST /ops/notes_write` (`upsert`, `delete`, each with an optional `expectedVersion`). The route takes no query
        parameter.
      parameters:
        - $ref: "#/components/parameters/itemId"
        - $ref: "#/components/parameters/noteKey"
        - name: If-None-Match
          in: header
          schema:
            type: string
      responses:
        "200":
          description: Envelope with ok=true
          headers:
            ETag:
              description: '"v{version}" of the note.'
              schema:
                type: string
            X-Req-Id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpsEnvelope"
        "304":
          description: The note is still at the version named by If-None-Match (empty body)
          headers:
            ETag:
              schema:
                type: string
        "400":
          description: invalid_request or unknown_parameter envelope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpsEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: forbidden envelope (capability, root or tag scope)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpsEnvelope"
        "404":
          description: not_found envelope (item, or note with id "<itemUuid>/<key>") or ambiguous_id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpsEnvelope"

  /items/{id}/transitions:
