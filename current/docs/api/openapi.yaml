      operationId: getItemGate
      tags: [items]
      description: >-
        Field-for-field identical to the MCP get_context tool's item-mode gateStatus /
        guidanceKey / skillPointer, computed via the same resolveSchema + computePhaseNoteContext
        path. No dependency/blocker info and no dispatch field. Carries no ETag and ignores
        If-None-Match — unlike GET /items/{id}, gate status depends on notes and config, neither
        of which item.modifiedAt versions. If the notes read fails, every required note for the
        current phase is reported missing, the same as get_context.
      parameters:
        - $ref: "#/components/parameters/itemId"
