openapi: "3.1.0"
info:
  title: MCP Task Orchestrator REST API
  version: "1.0"
  description: |
    HTTP REST API for the MCP Task Orchestrator. Operates alongside the MCP transport when
    API_ENABLED=true. Base URL: /api/v1

    NOTE: This file is hand-maintained and may lag edge-case behavior. The source code and
    api-rest.md are authoritative. See api-rest.md for full semantics including merge-patch
    rules, ETag formats, idempotency, audit model, and the SSE replay known limitation.

    Every operation also accepts the optional X-Client-Host request header
    (components/parameters/clientHost), which names the calling client in the call log.

servers:
  - url: /api/v1
    description: REST API base

security:
  - BearerAuth: []

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: |
        Static bearer token (API_AUTH_MODE=bearer) or JWT (API_AUTH_MODE=jwks).
        For SSE, use Authorization header or opt-in ?token= query param.
        Optional opt-in unauthenticated mode (API_AUTH_MODE=none + API_ALLOW_UNAUTHENTICATED=true)
        accepts requests with no Authorization header at all — loopback-only, see api-rest.md §1.

  parameters:
    clientHost:
      name: X-Client-Host
      in: header
      required: false
      description: >-
        Optional name of the calling client application, recorded as the host on the request's call_log
        and events rows. Precedence: this header, else the first User-Agent product token (the text before
        the first slash), else rest. Normalized: control characters dropped, trimmed, lowercased, capped at
        64 code points; an empty result counts as absent. Accepted on every operation. See api-rest.md section 6a.
      schema:
        type: string
    idempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >-
        Optional UUID that makes a write apply once for 24 hours, recorded in the same transaction as the
        write. A retry with the same key and the same request replays the stored 2xx (or 400 validation_error)
        response with the header Idempotent-Replayed true; the same key with a different request is
        409 idempotency_mismatch. A failure that depends on state (404, 403, 409, 412, 500, 503) is not
        recorded, so a retry runs again. Scoped to the caller; malformed key -> 400.
      schema:
        type: string
        format: uuid
    itemId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    noteKey:
      name: key
      in: path
      required: true
      schema:
        type: string
    page:
      name: page
      in: query
      schema:
        type: integer
        default: 1
        minimum: 1
        maximum: 100000
    pageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        default: 50
        minimum: 1
        maximum: 200

  schemas:
    ItemDto:
      type: object
      required: [id, title, summary, role, priority, requiresVerification, tags, traits, properties,
                 createdAt, modifiedAt, roleChangedAt, etag, depth, isClaimed]
      properties:
        id:
          type: string
          format: uuid
        parentId:
          type: string
          format: uuid
          nullable: true
        title:
          type: string
        description:
          type: string
          nullable: true
        summary:
          type: string
        type:
          type: string
          nullable: true
        role:
          type: string
          enum: [queue, work, review, terminal, blocked]
        previousRole:
          type: string
          enum: [queue, work, review]
          nullable: true
        statusLabel:
          type: string
          nullable: true
        priority:
          type: string
          enum: [high, medium, low]
        complexity:
          type: integer
          nullable: true
        requiresVerification:
          type: boolean
        tags:
          type: array
          items:
            type: string
        traits:
          type: array
          items:
            type: string
          description: The item's trait names in order. Always present, possibly empty.
        properties:
          type: object
        createdAt:
          type: string
          format: date-time
        modifiedAt:
          type: string
          format: date-time
        roleChangedAt:
          type: string
          format: date-time
        etag:
          type: string
          description: '"v1-<modifiedAtMillis>" — use as If-Match on PATCH'
        depth:
          type: integer
        isClaimed:
          type: boolean
        notes:
          type: array
          items:
            $ref: "#/components/schemas/NoteDto"
          nullable: true
          description: Populated when ?include=notes
        children:
          type: array
          items:
            $ref: "#/components/schemas/ItemDto"
          nullable: true
          description: Populated when ?include=children
        dependencies:
          $ref: "#/components/schemas/DependenciesDto"

    NoteDto:
      type: object
      required: [key, role, body, createdAt, modifiedAt, etag]
      properties:
        key:
          type: string
        role:
          type: string
          enum: [queue, work, review]
        body:
          type: string
        createdAt:
          type: string
          format: date-time
        modifiedAt:
          type: string
          format: date-time
        etag:
          type: string
          description: '"v1-<modifiedAtMillis>" — use as If-Match on PUT'
        actor:
          $ref: "#/components/schemas/ActorClaimDto"
        verification:
          $ref: "#/components/schemas/VerificationDto"

    ActorClaimDto:
      type: object
      nullable: true
      required: [id, kind]
      properties:
        id:
          type: string
          description: "Server-synthesized: api:<tokenId>"
        kind:
          type: string
          enum: [orchestrator, subagent, user, external]
          description: Always "external" for REST API writes
        parent:
          type: string
          nullable: true

    VerificationDto:
      type: object
      nullable: true
      required: [status]
      properties:
        status:
          type: string
          enum: [absent, unchecked, verified, rejected, unavailable]
        verifier:
          type: string
          nullable: true
        reason:
          type: string
          nullable: true
        proof:
          allOf:
            - $ref: '#/components/schemas/ProofEvidenceDto'
          nullable: true
          description: >-
            Forensic evidence about the proof (SHA-256 hash + verified JWT claims), in place of
            the raw proof. Requires ADMIN capability; independent of API_REDACT_NOTE_ATTRIBUTION.
            Null when no proof was supplied, or for a non-admin caller.

    ProofEvidenceDto:
      type: object
      required: [sha256]
      properties:
        sha256:
          type: string
          description: Lowercase hex SHA-256 digest of the proof's UTF-8 bytes.
        iss:
          type: string
          nullable: true
        sub:
          type: string
          nullable: true
        aud:
          type: array
          items:
            type: string
          nullable: true
        jti:
          type: string
          nullable: true
        iat:
          type: integer
          format: int64
          nullable: true
          description: Epoch seconds.
        exp:
          type: integer
          format: int64
          nullable: true
          description: Epoch seconds.
        kid:
          type: string
          nullable: true
        alg:
          type: string
          nullable: true

    RoleTransitionDto:
      type: object
      required: [id, itemId, toRole, trigger, occurredAt]
      properties:
        id:
          type: string
          format: uuid
        itemId:
          type: string
          format: uuid
        fromRole:
          type: string
          nullable: true
        toRole:
          type: string
        trigger:
          type: string
        statusLabel:
          type: string
          nullable: true
        occurredAt:
          type: string
          format: date-time
        actor:
          $ref: "#/components/schemas/ActorClaimDto"
        verification:
          $ref: "#/components/schemas/VerificationDto"
        consumedCredentials:
          type: array
          nullable: true
          items:
            type: string
          description: >-
            Opaque audit labels for credentials/resources this transition consumed — caller-supplied
            credentialRefs unioned with any resource-lease keys the gate auto-derived. Omitted/null
            when empty. NOT subject to API_REDACT_NOTE_ATTRIBUTION — visible to any READ caller,
            unlike actor/verification on this same DTO.

    DependenciesDto:
      type: object
      required: [blocks, blockedBy, related]
      properties:
        blocks:
          type: array
          items:
            $ref: "#/components/schemas/DependencyEdgeDto"
        blockedBy:
          type: array
          items:
            $ref: "#/components/schemas/DependencyEdgeDto"
        related:
          type: array
          items:
            $ref: "#/components/schemas/DependencyEdgeDto"

    DependencyEdgeDto:
      type: object
      required: [id, fromItemId, toItemId, type, createdAt]
      properties:
        id:
          type: string
          format: uuid
        fromItemId:
          type: string
          format: uuid
        toItemId:
          type: string
          format: uuid
        type:
          type: string
          enum: [blocks, relates_to]
        unblockAt:
          type: string
          nullable: true
          enum: [queue, work, review, terminal]
        createdAt:
          type: string
          format: date-time

    ErrorDto:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          description: Machine-readable error code
        message:
          type: string
          description: Human-readable description
        details:
          type: object
          nullable: true

    AuthErrorDto:
      type: object
      description: >-
        OAuth/RFC 6750-style error body used by authentication/authorization rejections
        (401 invalid_request / invalid_token, 403 insufficient_scope) and the SSE pre-flight
        400 validation_error. Unlike ErrorDto it has error_description and no message.
      required: [error, error_description]
      properties:
        error:
          type: string
          description: Machine-readable error code
          enum: [invalid_request, invalid_token, insufficient_scope, validation_error]
        error_description:
          type: string
          description: Human-readable description

    ItemDeleteResultDto:
      type: object
      required: [id, deleted, descendantsDeleted]
      properties:
        id:
          type: string
        deleted:
          type: integer
          description: Total rows removed (the target item plus every descendant).
        descendantsDeleted:
          type: integer
          description: Descendant-only count.

    PageDto:
      type: object
      required: [items, page, pageSize, hasMore]
      properties:
        items:
          type: array
          items: {}
        page:
          type: integer
        pageSize:
          type: integer
        totalItems:
          type: integer
          format: int64
          nullable: true
          description: May be null when computing an exact count is expensive.
        hasMore:
          type: boolean
        skipped:
          type: integer
          nullable: true
          description: >
            Count of rows in this page's query window dropped for failing domain validation
            (e.g. a corrupt/legacy row). Omitted when nothing was skipped. The row is still
            counted in totalItems. Invariant: items.size == min(pageSize, totalItems - offset)
            - skipped (clamped to the actual window). Currently populated on GET /items and
            GET /items/roots.

    ItemCreateDto:
      type: object
      required: [title]
      properties:
        title:
          type: string
        description:
          type: string
          nullable: true
        summary:
          type: string
          nullable: true
        parentId:
          type: string
          format: uuid
          nullable: true
        type:
          type: string
          nullable: true
          description: >-
            Required by the service: a missing or blank type is rejected with 400 validation_error
            (details.reason, details.type, details.availableTypes), and so is a type that is not a declared
            schema key whenever any schema is configured for the root. The field stays nullable in the schema so
            the rejection is the typed one, not a deserialization error.
        priority:
          type: string
          nullable: true
        complexity:
          type: integer
          nullable: true
        requiresVerification:
          type: boolean
          nullable: true
        tags:
          type: array
          items:
            type: string
          description: JSON array of tag strings (POST only — PATCH uses CSV string)
        statusLabel:
          type: string
          nullable: true
        traits:
          type: array
          items:
            type: string
          description: >-
            Trait names in order. Each must be non-blank, trimmed, comma-free, at most 100 characters and unique; when
            the root declares any trait an undeclared name is rejected with 400 validation_error (details.availableTraits).
        properties:
          type: object
          nullable: true
          description: A "traits" key inside it is rejected with 400 validation_error; use the typed traits field.
        metadata:
          type: string
          nullable: true

    IndependenceViolationDto:
      type: object
      required: [key, constraint]
      description: >-
        A2: one independence-attestation finding, actor-free by construction (never an actor id,
        proof, or claim on any surface, MCP or REST). See config-format.md "Independence (A2)".
      properties:
        key:
          type: string
          description: The declaring note's key (the note whose independent_of triggered this check).
        seat:
          type: string
          nullable: true
          description: The declaring note's owning seat. Omitted when the schema is not seat-aware.
        constraint:
          type: string
          enum: [same_actor, missing_actor, unverified]
        conflictingSeat:
          type: string
          nullable: true
          description: >-
            The seat this finding was raised against. Omitted for a missing_actor/unverified
            finding raised against the declaring note itself rather than a specific conflicting
            seat.
        waived:
          type: boolean
          nullable: true
          description: >-
            True only for a same_actor finding covered by the independence: temporal-only waiver.
            A waived finding never blocks a reject-mode transition. Omitted unless true.

    GateStatusDto:
      type: object
      required: [canAdvance, phase, missing]
      properties:
        canAdvance:
          type: boolean
        phase:
          type: string
          enum: [queue, work, review, terminal, blocked]
          description: The item's CURRENT role, lowercased.
        missing:
          type: array
          items:
            type: string
          description: Required-note KEY strings (schema order) still unfilled for phase.
        missingBySeat:
          type: object
          nullable: true
          description: >-
            A1: missing's keys bucketed by owning seat, plus a reserved "unowned" bucket for a
            required note with no owning seat — non-empty buckets only, in merged-seat order with
            "unowned" always last. Present only when the item's resolved schema is seat-aware AND
            phase != terminal (an empty object when seat-aware but nothing missing); omitted
            entirely for a seat-less schema or a terminal item. See config-format.md "Seats
            (Trait & Schema Dimension)".
          additionalProperties:
            type: array
            items:
              type: string
        violations:
          type: array
          nullable: true
          description: >-
            A2: independence-attestation findings for phase. Present (possibly empty) whenever
            independence mode is not off and the resolved schema declares independent_of
            somewhere; omitted entirely otherwise, including for a terminal item. canAdvance
            already accounts for a reject-mode block from a non-waived violation. See
            config-format.md "Independence (A2)".
          items:
            $ref: "#/components/schemas/IndependenceViolationDto"
        blockedBy:
          type: string
          nullable: true
          enum: [table, dependency, note, lease]
          description: >-
            The first gate that blocks a start advance right now (claim ownership excluded): the
            transition table, an unmet blocking dependency, a required note or reject-mode
            independence violation, or an exclusive resource lease held by another item. Present
            only when canAdvance is false and the item is not terminal; omitted otherwise.

    ItemGateDto:
      type: object
      required: [itemId, title, role, gateStatus]
      properties:
        itemId:
          type: string
          format: uuid
        title:
          type: string
        role:
          type: string
          enum: [queue, work, review, terminal, blocked]
        gateStatus:
          $ref: "#/components/schemas/GateStatusDto"
        guidanceKey:
          type: string
          nullable: true
          description: >-
            First missing required note's key with guidance text. Omitted from JSON (not
            serialized as null) when there is none.
        skillPointer:
          type: string
          nullable: true
          description: >-
            First missing required note's skill pointer. Omitted from JSON (not serialized as
            null) when there is none.

    SearchHitDto:
      type: object
      required: [itemId, field, snippet, score]
      properties:
        itemId:
          type: string
          format: uuid
        field:
          type: string
          description: >-
            The field that contains a match (title or summary for an item hit, title when both
            do; body for a note hit). snippet is taken from it.
        snippet:
          type: string
        score:
          type: number
          format: double
        noteKey:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
          description: >-
            Title of the owning work item (the item's own title for an item hit); omitted when the
            item could not be read.

    NoteSchemaEntryDto:
      type: object
      required: [key, role, required, description]
      properties:
        key:
          type: string
        role:
          type: string
          enum: [queue, work, review]
        required:
          type: boolean
        description:
          type: string
        guidance:
          type: string
          nullable: true
        skill:
          type: string
          nullable: true
        maxLength:
          type: integer
          description: Maximum note-body length configured for this entry. Present only when configured.

    DispatchProfileDto:
      type: object
      description: >-
        Dispatch routing profile for a phase — who/what should pick up the work. Declared per
        trait per phase under traits.<name>.dispatch.<phase> in .taskorchestrator/config.yaml.
        All fields are optional; at least one is present on any profile the server returns.
      properties:
        agent:
          type: string
          description: Opaque agent identifier (e.g. "task-orchestrator:implementer"), never validated against any registry.
        model:
          type: string
          description: Opaque model identifier/alias.
        effort:
          type: string
          enum: [low, medium, high, xhigh, max]
          description: Matched case-sensitively at config-parse time.

    ResourceRequirementDto:
      type: object
      required: [key, mode]
      description: A trait's declared shared-resource requirement.
      properties:
        key:
          type: string
        mode:
          type: string
          enum: [exclusive, advisory]
        ttlSeconds:
          type: integer
          description: Present only when configured.

    SchemaDto:
      type: object
      required: [type, lifecycleMode, hasReviewPhase, notes, defaultTraits]
      properties:
        type:
          type: string
        lifecycleMode:
          type: string
        hasReviewPhase:
          type: boolean
        notes:
          type: array
          items:
            $ref: "#/components/schemas/NoteSchemaEntryDto"
        defaultTraits:
          type: array
          items:
            type: string

    TraitDto:
      type: object
      required: [name, notes]
      description: >-
        dispatch and resources are omitted (not present) when the trait declares neither —
        never an empty map/array. Reflects GLOBAL config only; a per-root override of the
        same trait's dispatch/resources is not visible here.
      properties:
        name:
          type: string
        notes:
          type: array
          items:
            $ref: "#/components/schemas/NoteSchemaEntryDto"
        dispatch:
          type: object
          description: Map of lowercase phase name ("queue"|"work"|"review") to DispatchProfileDto. Omitted when the trait declares no dispatch profiles.
          additionalProperties:
            $ref: "#/components/schemas/DispatchProfileDto"
        resources:
          type: array
          description: Declared shared-resource requirements. Omitted when the trait declares none.
          items:
            $ref: "#/components/schemas/ResourceRequirementDto"

    ConfigSnapshotDto:
      type: object
      required: [schemas, traits, types, statusGraph]
      properties:
        schemas:
          type: array
          items:
            $ref: "#/components/schemas/SchemaDto"
        traits:
          type: array
          items:
            $ref: "#/components/schemas/TraitDto"
        types:
          type: array
          items:
            type: string
        statusGraph:
          $ref: "#/components/schemas/StatusGraphDto"
        defaultSchema:
          $ref: "#/components/schemas/SchemaDto"

    EffectiveSchemaDto:
      type: object
      required: [type, matchedType, configSource, lifecycleMode, hasReviewPhase, notes, defaultTraits]
      description: >-
        A single type's RESOLVED base schema (no trait merging), one entry of
        EffectiveConfigDto.schemas / EffectiveConfigDto.defaultSchema.
      properties:
        type:
          type: string
          description: The queried type key.
        matchedType:
          type: string
          description: >-
            The schema that actually answered the lookup — "default" when a default schema
            answered a miss on the queried type.
        configSource:
          type: string
          enum: [per-root, global]
          description: Which layer supplied the schema — same literal MCP query_items(schema) uses.
        configFingerprint:
          type: string
          nullable: true
          description: The supplying layer's fingerprint, omitted when that layer has none.
        lifecycleMode:
          type: string
        hasReviewPhase:
          type: boolean
        notes:
          type: array
          items:
            $ref: "#/components/schemas/NoteSchemaEntryDto"
        defaultTraits:
          type: array
          items:
            type: string

    EffectiveConfigDto:
      type: object
      required: [rootId, schemas, traits, types, statusGraph]
      description: >-
        Full per-root EFFECTIVE (layered) config view returned by
        GET /roots/{rootId}/config/effective — every registered type resolved against rootId's
        per-root config over the global fallback, in one response. Additive: distinct from
        ConfigSnapshotDto (GLOBAL-only) and the raw stored YAML /roots/{rootId}/config returns.
      properties:
        rootId:
          type: string
          format: uuid
        schemas:
          type: array
          items:
            $ref: "#/components/schemas/EffectiveSchemaDto"
        traits:
          type: array
          items:
            $ref: "#/components/schemas/TraitDto"
        types:
          type: array
          items:
            type: string
          description: The union of the per-root and global schema keys, in ascending natural String order; always equal to the `type` values of `schemas`. Each key resolves by one precedence rule (per-root exact type, global exact type, per-root default, global default).
        statusGraph:
          $ref: "#/components/schemas/StatusGraphDto"
        defaultSchema:
          $ref: "#/components/schemas/EffectiveSchemaDto"
        globalFingerprint:
          type: string
          nullable: true
          description: Omitted when no global config is loaded.
        perRootFingerprint:
          type: string
          nullable: true
          description: Omitted when no per-root config is pushed for this root.

    StatusGraphTypeDto:
      type: object
      required: [type, lifecycleMode, hasReviewPhase, transitions]
      properties:
        type:
          type: string
        lifecycleMode:
          type: string
        hasReviewPhase:
          type: boolean
        transitions:
          type: object
          additionalProperties:
            type: object
            additionalProperties:
              type: string
          description: |
            role -> trigger -> targetRole. Value "<previousRole>" is a sentinel string
            for blocked.resume — resolve from the live item's previousRole field.

    StatusGraphDto:
      type: object
      required: [roles, triggers, types]
      properties:
        roles:
          type: array
          items:
            type: string
        triggers:
          type: array
          items:
            type: string
        types:
          type: array
          items:
            $ref: "#/components/schemas/StatusGraphTypeDto"

    ServiceInfoDto:
      type: object
      required: [serverName, version, apiVersion, capabilities, claimModeAvailable,
                 actorAuthenticationEnabled, features]
      properties:
        serverName:
          type: string
        version:
          type: string
        apiVersion:
          type: string
        capabilities:
          type: array
          items:
            type: string
        claimModeAvailable:
          type: boolean
        actorAuthenticationEnabled:
          type: boolean
        features:
          type: array
          items:
            type: string
          description: >-
            A1/A2: server-wide optional-response feature advertisement (currently
            ["seats", "dispatchBySeat", "independent_of", "rules"]), advertised unconditionally regardless
            of whether the resolved config for any given root declares seats or independent_of.
            Same list as WellKnownDto.features.

    WellKnownDto:
      type: object
      required: [name, version, apiVersion, apiUrl, features]
      description: Service discovery document served at GET /.well-known/mcp-task-orchestrator.json (mounted at the root, not under /api/v1).
      properties:
        name:
          type: string
        version:
          type: string
        apiVersion:
          type: string
        apiUrl:
          type: string
        features:
          type: array
          items:
            type: string
          description: A1/A2 — same server-wide feature advertisement as ServiceInfoDto.features.

    SeatDto:
      type: object
      required: [name, phase]
      description: >-
        One declared orchestration seat (A1) — parsed, merged, and served, but not itself
        enforced by the server. See config-format.md "Seats (Trait & Schema Dimension)".
      properties:
        name:
          type: string
        phase:
          type: string
          enum: [queue, work, review]
        enters:
          type: boolean
          description: Present only when true.
        after:
          type: array
          items:
            type: string
          description: Seat names this seat's work logically follows. Present only when non-empty.
        readsExclude:
          type: array
          items:
            type: string
          description: Note keys this seat should not read. Present only when non-empty.

    ItemSchemaNoteEntryDto:
      type: object
      required: [key, role, required, description]
      description: >-
        Full note-schema entry as served by GET /items/{id}/schema — same base shape as
        NoteSchemaEntryDto, plus the A1 seat fields. A distinct schema from NoteSchemaEntryDto
        because /config* and /config/effective (which use NoteSchemaEntryDto) do not serve seats
        in A1.
      properties:
        key:
          type: string
        role:
          type: string
          enum: [queue, work, review]
        required:
          type: boolean
        description:
          type: string
        guidance:
          type: string
          nullable: true
        skill:
          type: string
          nullable: true
        maxLength:
          type: integer
          description: Maximum note-body length configured for this entry. Present only when configured.
        seat:
          type: string
          nullable: true
          description: >-
            A1: this entry's declared owning seat. Present (possibly null) only when the schema
            is seat-aware; omitted entirely for a seat-less schema. null means the note has no
            owning seat and is served under "unowned" in missingBySeat.
        independentOf:
          type: array
          items:
            type: string
          description: >-
            A1: seat names this note's authoring must stay independent of. Present only when
            non-empty, regardless of seat-awareness. Parsed and served since A1; enforced as of A2
            (the independence attestation gate) — see config-format.md "Independence (A2)".

    ItemSchemaViewDto:
      type: object
      required: [type, configSource, notes, features]
      description: >-
        Response body for GET /items/{id}/schema (A1c) — identical to MCP
        query_items(operation="schema", itemId=...)'s data object; both are built by the same
        ItemSchemaView.buildItemSchemaJson server-side function, never a second, separately
        maintained builder.
      properties:
        type:
          type: string
        configFingerprint:
          type: string
          nullable: true
        configSource:
          type: string
          enum: [per-root, global]
        notes:
          type: array
          items:
            $ref: "#/components/schemas/ItemSchemaNoteEntryDto"
        dispatch:
          type: object
          description: Map of lowercase phase name ("queue"|"work"|"review") to DispatchProfileDto. Omitted when no resolved trait declares a profile for any phase.
          additionalProperties:
            $ref: "#/components/schemas/DispatchProfileDto"
        resources:
          type: array
          description: Trait-declared shared-resource requirements. Omitted when none resolve.
          items:
            $ref: "#/components/schemas/ResourceRequirementDto"
        seats:
          type: array
          items:
            $ref: "#/components/schemas/SeatDto"
          description: A1 — merged-seat order. Present only for a seat-aware schema.
        dispatchBySeat:
          type: object
          description: >-
            A1: map of lowercase phase name to a map of seat name to DispatchProfileDto. Present
            only for a seat-aware schema; a phase is included only when at least one of its seats
            has a resolved profile.
          additionalProperties:
            type: object
            additionalProperties:
              $ref: "#/components/schemas/DispatchProfileDto"
        features:
          type: array
          items:
            type: string
          description: A1 — always present, same server-wide feature advertisement as ServiceInfoDto.features.

    HealthDto:
      type: object
      required: [status, dbReachable]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        dbReachable:
          type: boolean

    ProjectConfigResponseDto:
      type: object
      required: [rootId, fingerprint, updatedAt]
      properties:
        rootId:
          type: string
          format: uuid
        fingerprint:
          type: string
          description: >-
            SHA-256 hex digest of the stored configYaml's UTF-8 bytes, after stripping one
            leading BOM and normalizing CRLF to LF (the stored configYaml itself is unchanged)
        updatedAt:
          type: string
          format: date-time
        configYaml:
          type: string
          nullable: true
          description: Raw stored YAML text; present on GET only (omitted on PUT)
        warning:
          type: string
          nullable: true
          description: Non-fatal notice when the root's `type` is not "project"
        relation:
          type: string
          nullable: true
          enum: [current, superseded, unknown]
          description: >-
            Present on GET only, and only when ?fingerprint= was supplied — classifies that
            fingerprint against the root's stored fingerprint history.
        schemaWarnings:
          type: array
          nullable: true
          items:
            type: string
          description: >-
            Present on PUT only, and only for advisory findings (a resource key declared by three
            or more traits, a required note no declared seat owns). The push still succeeds and
            the config is still stored regardless of schemaWarnings. Omitted entirely when empty.
            The 3.x ignoredSections field was removed in 4.0: a key the per-root layer does not
            honor is now rejected with 422 parse_error, not ignored.
        version:
          type: integer
          minimum: 1
          nullable: true
          description: >-
            The per-root version number of the config version this response reports (the new head
            on PUT and rollback). The ETag is `"cfg-v<version>"`.
        source:
          type: string
          nullable: true
          enum: [push, file-import, migration, rollback, reset]
          description: How the reported config version came to exist.
        appended:
          type: boolean
          nullable: true
          description: >-
            PUT and rollback only: false when nothing was written (a byte-identical re-push, or a
            rollback to the head's own content); `version` is then the unchanged head.

    ConfigVersionSummaryDto:
      type: object
      required: [version, fingerprint, source, createdAt, warningsCount, canonical]
      description: One stored config version's metadata (never its YAML).
      properties:
        version:
          type: integer
          minimum: 1
        fingerprint:
          type: string
        source:
          type: string
          enum: [push, file-import, migration, rollback, reset]
        createdAt:
          type: string
          format: date-time
        principalId:
          type: string
          nullable: true
        warningsCount:
          type: integer
        canonical:
          type: boolean
          description: >-
            False only for a migrated version the config-canonicalize upgrade step has not filled
            yet.

    ConfigHistoryResponseDto:
      type: object
      required: [rootId, versions]
      properties:
        rootId:
          type: string
          format: uuid
        headVersion:
          type: integer
          nullable: true
          description: The current head's version, or null when the root has no config at all.
        versions:
          type: array
          description: Newest first.
          items:
            $ref: "#/components/schemas/ConfigVersionSummaryDto"

    RuleResponseDto:
      type: object
      required: [rootId, key, rulesVersion, body]
      description: >-
        Section 19a's per-key rule read. Mirrors the MCP query_rules tool's get data payload
        minus resolvedFrom (REST has no item/skill-pointer mode).
      properties:
        rootId:
          type: string
          format: uuid
        key:
          type: string
          description: Rule key, matching ^[a-z0-9][a-z0-9._-]{0,99}$
        rulesVersion:
          type: string
          description: >-
            The backing rule document's contentHash (same value docs_read reports for
            kind rule, slug <key>).
        body:
          type: string
          description: Raw stored rule text, served byte-for-byte as stored.

    RuleSummaryDto:
      type: object
      required: [key, rulesVersion, updatedAt]
      description: One row of RuleListResponseDto.rules (section 19a); metadata only, never the body.
      properties:
        key:
          type: string
        rulesVersion:
          type: string
        updatedAt:
          type: string
          format: date-time

    RuleListResponseDto:
      type: object
      required: [rootId, rules]
      properties:
        rootId:
          type: string
          format: uuid
        rules:
          type: array
          description: Ordered by key ascending.
          items:
            $ref: "#/components/schemas/RuleSummaryDto"

    OpsEnvelope:
      type: object
      description: >-
        The 4.0 response envelope: ok, then data (success) or error {code, kind, message, fix?, detail?}
        (failure), and meta {reqId}. Per-tool data shapes are served by the tool's describe call.
      required: [ok, meta]
      properties:
        ok:
          type: boolean
        data:
          type: object
          additionalProperties: true
        error:
          type: object
          additionalProperties: true
        meta:
          type: object
          required: [reqId]
          properties:
            reqId:
              type: string

  responses:
    IdempotencyMismatch:
      description: >-
        error="idempotency_mismatch" - the Idempotency-Key was already used with a different request
        (method, path, If-Match or body). Nothing was executed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorDto"
    Unauthorized:
      description: >-
        Missing or invalid bearer token. error is invalid_request (missing, non-Bearer or empty
        credential) or invalid_token (unknown, expired or invalid token); the body carries
        error_description, not message, and the response has a WWW-Authenticate header.
      headers:
        WWW-Authenticate:
          description: Bearer challenge, e.g. Bearer error="invalid_token"
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AuthErrorDto"
    Forbidden:
      description: >-
        Authenticated but lacks required capability or scope. insufficient_scope uses the
        AuthErrorDto body (error_description); host_not_allowed, scope_forbidden and
        insufficient_capability use ErrorDto (message).
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/ErrorDto"
              - $ref: "#/components/schemas/AuthErrorDto"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorDto"
    BadRequest:
      description: Invalid request parameters or body
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorDto"
    InternalServerError:
      description: Database or server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorDto"
    ConfigUnavailable:
      description: >-
        error="config_unavailable" — the item's (or root's) per-root config could not be read and
        there was no last-known-good cached config to serve; transient, retryable, no Retry-After
        header. REST and the MCP tools share one per-root config cache, so this is rarer than a
        per-surface cache would produce.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorDto"

paths:
  /items:
    get:
      summary: List work items
      operationId: listItems
      tags: [items]
      description: >-
        A token with scope.tags_include is additionally filtered to items carrying at least one
        allowed tag (item-level exact match, no ancestor walk). A tag-scoped caller reads a bounded
        1000-row candidate window before filtering, then paginates the filtered result — totalItems
        reflects only the visible (post-filter) count. A tag scope matching nothing returns 200
        with an empty page, never 403.
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/pageSize"
        - name: role
          in: query
          description: Matching is case-insensitive (the enum lists the canonical lower-case values). An unrecognized value returns 400 validation_error.
          schema:
            type: string
            enum: [queue, work, review, blocked, terminal]
        - name: priority
          in: query
          description: Matching is case-insensitive (the enum lists the canonical lower-case values). An unrecognized value returns 400 validation_error.
          schema:
            type: string
            enum: [high, medium, low]
        - name: tag
          in: query
          schema:
            type: string
          description: Comma-separated tags; all must be present (AND)
        - name: tagAny
          in: query
          schema:
            type: string
          description: Comma-separated tags; any must be present (OR); overrides tag
        - name: type
          in: query
          schema:
            type: string
        - name: parentId
          in: query
          schema:
            type: string
            format: uuid
        - name: rootId
          in: query
          schema:
            type: string
            format: uuid
        - name: modifiedAfter
          in: query
          schema:
            type: string
            format: date-time
        - name: modifiedBefore
          in: query
          schema:
            type: string
            format: date-time
        - name: createdAfter
          in: query
          schema:
            type: string
            format: date-time
        - name: createdBefore
          in: query
          schema:
            type: string
            format: date-time
        - name: claimStatus
          in: query
          description: Matching is case-insensitive (the enum lists the canonical lower-case values). An unrecognized value returns 400 validation_error.
          schema:
            type: string
            enum: [claimed, unclaimed, expired]
        - name: orderBy
          in: query
          schema:
            type: string
            enum: [title, priority, complexity, createdAt, modifiedAt, created, modified]
        - name: orderDir
          in: query
          schema:
            type: string
            enum: [asc, desc]
      responses:
        "200":
          description: Paginated item list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageDto"
                  - properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/ItemDto"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

    post:
      summary: Create a work item
      operationId: createItem
      tags: [items]
      description: >-
        When parentId is absent or null (a root-level create), the new item's ancestor chain is
        only its own server-generated id, so a root_ids-scoped token is always denied (403
        scope_forbidden) — a new id can never already be listed in root_ids. A tags_include-only
        token may create a root only if the tags it creates that root with satisfy its own
        tags_include allowlist (the new root is its own anchor, mirroring the parentId-outside-scope
        check applied to a non-root create); otherwise 403 scope_forbidden, and nothing is
        persisted.

        The item is always created in queue. Its depth and rootId come from the parent row read
        inside the write's own transaction. A terminal parent whose effective lifecycle is auto
        takes no new children: 409 invalid_transition with details.parentId, nothing written.
      parameters:
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItemCreateDto"
      responses:
        "201":
          description: Item created
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemDto"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: >-
            error="invalid_transition" — the parent is terminal under auto lifecycle and takes no
            new children; details.parentId names it and nothing is written (reopen the parent
            first). error="idempotency_mismatch" — the Idempotency-Key was already used with a
            different request; nothing was executed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "413":
          description: >-
            Payload too large — body exceeds the shared 1 MiB write-body limit, enforced before
            the body is buffered (Content-Length pre-check, then a capped channel read).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "415":
          description: >-
            Unsupported media type — Content-Type is present and is not application/json (an
            absent header is accepted as */*); checked before the Idempotency-Key header or body
            is read.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          description: >-
            error="config_unavailable" — resolving a terminal parent's lifecycle read the per-root
            config and it was unavailable (transient); nothing is written.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"

  /items/roots:
    get:
      summary: List root items (depth=0)
      description: >
        Scoped tokens return only the specific root items within scope (totalItems is the exact
        scoped root count). Unscoped/admin callers get standard page/pageSize pagination with
        totalItems from an exact COUNT query — no cap; page through all roots with repeated
        requests. A scope.tags_include token is additionally filtered to items carrying at least
        one allowed tag, applied in-memory over a bounded 1000-row candidate window (same caveat
        as GET /items) — totalItems then reflects only the visible count. A tag scope matching
        nothing returns 200 with an empty page, never 403.
      operationId: listRootItems
      tags: [items]
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/pageSize"
      responses:
        "200":
          description: Root items
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageDto"
                  - properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/ItemDto"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /items/{id}:
    get:
      summary: Get a single work item
      operationId: getItem
      tags: [items]
      parameters:
        - $ref: "#/components/parameters/itemId"
        - name: include
          in: query
          schema:
            type: string
          description: >-
            Comma-separated inclusions - notes, deps, children. When any recognized token is
            present the response carries no ETag header and If-None-Match is ignored (never 304).
        - name: If-None-Match
          in: header
          description: >-
            Honored only when no recognized include is requested; ignored otherwise.
          schema:
            type: string
      responses:
        "200":
          description: Item
          headers:
            ETag:
              description: Absent when a recognized include is requested.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemDto"
        "304":
          description: Not modified (If-None-Match matched; never returned when include is requested)
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      summary: JSON Merge Patch update
      operationId: patchItem
      tags: [items]
      description: >-
        When the patch re-parents the item (parentId changed to a non-null value), the new parent
        is scope-checked the same way POST /items checks a create-time parentId — 403
        scope_forbidden if the new parent is outside the caller's scope (root_ids or tags_include).
        An unknown new parent still returns 400 not_found first; scope is checked only after the
        parent is confirmed to exist, so scope_forbidden never becomes an existence oracle.

        A re-parent that would create a cycle is rejected as 400 validation_error: parentId equal
        to the item's own id ("An item cannot be its own parent") or naming one of the item's own
        descendants ("Cannot re-parent an item under its own descendant"). Checked via an identity
        comparison plus a full walk of the proposed parent's real ancestor chain (one batched
        findAncestorChains lookup) — not bounded by the parent row's denormalized depth, so a stale
        depth value can no longer let a cycle through. Ordering: 404 not_found (unknown parent) ->
        403 scope_forbidden (parent outside scope) -> this 400 validation_error (self/descendant
        cycle) -> 409 invalid_transition (the new parent is terminal under auto lifecycle;
        details.parentId names it); nothing is written until all clear. If the ancestor-chain
        lookup itself fails, the patch returns 500 db_error rather than admitting the re-parent.

        A re-parent restamps every descendant's depth and rootId in one statement (their versions
        and ETags change) and then re-evaluates the OLD parent like a child completion, all in the
        same transaction; the response body is unchanged.

        When the patch instead moves the item TO root (parentId changed from non-null to null), a
        root_ids-scoped token gets 403 scope_forbidden unless the item's own id is itself in
        root_ids — after the move the item's chain is just itself. The tag half is the entry-point
        scope check, made against the item's tags as they are before the patch.
      parameters:
        - $ref: "#/components/parameters/itemId"
        - name: If-Match
          in: header
          required: true
          schema:
            type: string
          description: Current ETag; required — missing -> 400 precondition_required
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              type: object
              description: |
                RFC 7396 merge patch. tags must be a CSV string (not array). traits is an array of names
                (null clears it; arrays replace wholesale).
                Server-owned fields id, role, previousRole, roleChangedAt, depth,
                createdAt, modifiedAt, version, claimedBy, claimedAt, claimExpiresAt,
                originalClaimedAt cannot be patched (400 field_not_patchable).
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Updated item
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemDto"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >-
            error="version_conflict" — a concurrent writer's update won the version race between
            the If-Match check and this request's own write (optimistic-lock loss). Distinct from
            412 etag_mismatch below, which is a stale-If-Match-at-read-time guard, not a
            concurrent-write guard. Retry with a fresh If-Match ETag. error="invalid_transition" —
            the new parent is terminal under auto lifecycle (details.parentId); nothing is written.
            error="idempotency_mismatch" — the Idempotency-Key was already used with a different
            request; nothing was executed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "412":
          description: ETag mismatch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "413":
          description: >-
            Payload too large — body exceeds the shared 1 MiB write-body limit, enforced before
            the body is buffered (Content-Length pre-check, then a capped channel read).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "415":
          description: Unsupported media type
          headers:
            Accept-Patch:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "500":
          $ref: "#/components/responses/InternalServerError"

    delete:
      summary: Delete item, or cascade-delete with ?recursive=true
      description: |
        Deletes the item. A parent item (one with direct children) is refused with 409
        `has_children` (details.childCount = direct child count) unless `?recursive=true` is
        given, in which case it and every descendant are deleted, leaves-first, inside one
        transaction — all-or-nothing, matching the MCP `manage_items` delete operation's
        semantics. A non-recursive delete of a leaf item still returns 204; a recursive delete
        (of a leaf or a parent) returns 200 with an ItemDeleteResultDto body.
      operationId: deleteItem
      tags: [items]
      parameters:
        - $ref: "#/components/parameters/itemId"
        - name: recursive
          in: query
          schema:
            type: string
          description: >
            Case-insensitive "true" or "false"; absent means "false" (non-recursive, refuses a
            parent with 409). Any other value (e.g. "1", "yes", "") is a 400 validation_error.
        - name: If-Match
          in: header
          schema:
            type: string
          description: Optional conditional delete
      responses:
        "200":
          description: Recursive delete succeeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemDeleteResultDto"
        "204":
          description: Non-recursive delete of a leaf item succeeded
        "400":
          description: Missing/invalid item id (bad_request) or an invalid `recursive` value (validation_error)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Item has children and `?recursive=true` was not given
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "412":
          description: ETag mismatch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /items/{id}/tree:
    get:
      summary: Descendant tree (flat paginated list)
      operationId: getItemTree
      tags: [items]
      parameters:
        - $ref: "#/components/parameters/itemId"
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/pageSize"
        - name: depth
          in: query
          schema:
            type: integer
            minimum: 0
          description: Max relative depth from root item. A non-integer or negative value returns 400 validation_error.
      responses:
        "200":
          description: Tree nodes (root item always first)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageDto"
                  - properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/ItemDto"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /items/{id}/breadcrumbs:
    get:
      summary: Ancestor chain (root to item)
      operationId: getItemBreadcrumbs
      tags: [items]
      description: >-
        A scope.tags_include token additionally drops any ancestor in the chain that fails the tag
        allowlist (item-level exact match) — this can return a non-empty, non-403 list even when
        one or more ancestors are hidden.
      parameters:
        - $ref: "#/components/parameters/itemId"
      responses:
        "200":
          description: List ordered root-first, target item last; truncated at scope root for scoped tokens
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ItemDto"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /items/{id}/children:
    get:
      summary: Direct children of an item
      operationId: getItemChildren
      tags: [items]
      description: >-
        For a tags_include-scoped caller, children are filtered by tag before pagination, over a
        bounded 1000-row candidate window (same caveat as GET /items) — totalItems is the filtered
        count, not a raw DB COUNT. Unscoped and root_ids-only callers keep SQL-level
        LIMIT/OFFSET and an exact COUNT, unaffected.
      parameters:
        - $ref: "#/components/parameters/itemId"
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/pageSize"
      responses:
        "200":
          description: Paginated children
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageDto"
                  - properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/ItemDto"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /items/{id}/gate:
