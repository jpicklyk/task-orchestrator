openapi: "3.1.0"
info:
  title: MCP Task Orchestrator REST API
  version: "1.0"
  description: |
    HTTP REST API for the MCP Task Orchestrator. Operates alongside the MCP transport when
    API_ENABLED=true. Base URL: /api/v1

    NOTE: This file is hand-maintained and may lag edge-case behavior. The source code and
    api-rest.md are authoritative. See api-rest.md for full semantics including merge-patch
    rules, ETag formats, idempotency, audit model, and the SSE replay known limitation.

servers:
  - url: /api/v1
    description: REST API base

security:
  - BearerAuth: []

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: |
        Static bearer token (API_AUTH_MODE=bearer) or JWT (API_AUTH_MODE=jwks).
        For SSE, use Authorization header or opt-in ?token= query param.
        Optional opt-in unauthenticated mode (API_AUTH_MODE=none + API_ALLOW_UNAUTHENTICATED=true)
        accepts requests with no Authorization header at all — loopback-only, see api-rest.md §1.

  parameters:
    itemId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    noteKey:
      name: key
      in: path
      required: true
      schema:
        type: string
    depId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    page:
      name: page
      in: query
      schema:
        type: integer
        default: 1
        minimum: 1
        maximum: 100000
    pageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        default: 50
        minimum: 1
        maximum: 200

  schemas:
    ItemDto:
      type: object
      required: [id, title, summary, role, priority, requiresVerification, tags, properties,
                 createdAt, modifiedAt, roleChangedAt, etag, depth, isClaimed]
      properties:
        id:
          type: string
          format: uuid
        parentId:
          type: string
          format: uuid
          nullable: true
        title:
          type: string
        description:
          type: string
          nullable: true
        summary:
          type: string
        type:
          type: string
          nullable: true
        role:
          type: string
          enum: [queue, work, review, terminal, blocked]
        previousRole:
          type: string
          enum: [queue, work, review]
          nullable: true
        statusLabel:
          type: string
          nullable: true
        priority:
          type: string
          enum: [high, medium, low]
        complexity:
          type: integer
          nullable: true
        requiresVerification:
          type: boolean
        tags:
          type: array
          items:
            type: string
        properties:
          type: object
        createdAt:
          type: string
          format: date-time
        modifiedAt:
          type: string
          format: date-time
        roleChangedAt:
          type: string
          format: date-time
        etag:
          type: string
          description: '"v1-<modifiedAtMillis>" — use as If-Match on PATCH'
        depth:
          type: integer
        isClaimed:
          type: boolean
        notes:
          type: array
          items:
            $ref: "#/components/schemas/NoteDto"
          nullable: true
          description: Populated when ?include=notes
        children:
          type: array
          items:
            $ref: "#/components/schemas/ItemDto"
          nullable: true
          description: Populated when ?include=children
        dependencies:
          $ref: "#/components/schemas/DependenciesDto"

    NoteDto:
      type: object
      required: [key, role, body, createdAt, modifiedAt, etag]
      properties:
        key:
          type: string
        role:
          type: string
          enum: [queue, work, review]
        body:
          type: string
        createdAt:
          type: string
          format: date-time
        modifiedAt:
          type: string
          format: date-time
        etag:
          type: string
          description: '"v1-<modifiedAtMillis>" — use as If-Match on PUT'
        actor:
          $ref: "#/components/schemas/ActorClaimDto"
        verification:
          $ref: "#/components/schemas/VerificationDto"

    ActorClaimDto:
      type: object
      nullable: true
      required: [id, kind]
      properties:
        id:
          type: string
          description: "Server-synthesized: api:<tokenId>"
        kind:
          type: string
          enum: [orchestrator, subagent, user, external]
          description: Always "external" for REST API writes
        parent:
          type: string
          nullable: true
        proof:
          type: string
          nullable: true
          description: Redacted unless ADMIN + ?include=proof

    VerificationDto:
      type: object
      nullable: true
      required: [status]
      properties:
        status:
          type: string
          enum: [absent, unchecked, verified, rejected, unavailable]
        verifier:
          type: string
          nullable: true
        reason:
          type: string
          nullable: true

    RoleTransitionDto:
      type: object
      required: [id, itemId, toRole, trigger, occurredAt]
      properties:
        id:
          type: string
          format: uuid
        itemId:
          type: string
          format: uuid
        fromRole:
          type: string
          nullable: true
        toRole:
          type: string
        trigger:
          type: string
        statusLabel:
          type: string
          nullable: true
        occurredAt:
          type: string
          format: date-time
        actor:
          $ref: "#/components/schemas/ActorClaimDto"
        verification:
          $ref: "#/components/schemas/VerificationDto"
        consumedCredentials:
          type: array
          nullable: true
          items:
            type: string
          description: >-
            Opaque audit labels for credentials/resources this transition consumed — caller-supplied
            credentialRefs unioned with any resource-lease keys the gate auto-derived. Omitted/null
            when empty. NOT subject to API_REDACT_NOTE_ATTRIBUTION — visible to any READ caller,
            unlike actor/verification on this same DTO.

    DependenciesDto:
      type: object
      required: [blocks, blockedBy, related]
      properties:
        blocks:
          type: array
          items:
            $ref: "#/components/schemas/DependencyEdgeDto"
        blockedBy:
          type: array
          items:
            $ref: "#/components/schemas/DependencyEdgeDto"
        related:
          type: array
          items:
            $ref: "#/components/schemas/DependencyEdgeDto"

    DependencyEdgeDto:
      type: object
      required: [id, fromItemId, toItemId, type, createdAt]
      properties:
        id:
          type: string
          format: uuid
        fromItemId:
          type: string
          format: uuid
        toItemId:
          type: string
          format: uuid
        type:
          type: string
          enum: [blocks, is_blocked_by, relates_to]
        unblockAt:
          type: string
          nullable: true
          enum: [queue, work, review, terminal]
        createdAt:
          type: string
          format: date-time

    BacklinkDto:
      type: object
      required: [fromItemId, fromTitle, type]
      properties:
        fromItemId:
          type: string
          format: uuid
        fromTitle:
          type: string
        type:
          type: string
          enum: [blocks, is_blocked_by, relates_to]

    ErrorDto:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          description: Machine-readable error code
        message:
          type: string
          description: Human-readable description
        details:
          type: object
          nullable: true

    PageDto:
      type: object
      required: [items, page, pageSize, hasMore]
      properties:
        items:
          type: array
          items: {}
        page:
          type: integer
        pageSize:
          type: integer
        totalItems:
          type: integer
          format: int64
          nullable: true
          description: May be null when computing an exact count is expensive.
        hasMore:
          type: boolean
        skipped:
          type: integer
          nullable: true
          description: >
            Count of rows in this page's query window dropped for failing domain validation
            (e.g. a corrupt/legacy row). Omitted when nothing was skipped. The row is still
            counted in totalItems. Invariant: items.size == min(pageSize, totalItems - offset)
            - skipped (clamped to the actual window). Currently populated on GET /items and
            GET /items/roots.

    ItemCreateDto:
      type: object
      required: [title]
      properties:
        title:
          type: string
        description:
          type: string
          nullable: true
        summary:
          type: string
          nullable: true
        parentId:
          type: string
          format: uuid
          nullable: true
        type:
          type: string
          nullable: true
        priority:
          type: string
          nullable: true
        complexity:
          type: integer
          nullable: true
        requiresVerification:
          type: boolean
          nullable: true
        tags:
          type: array
          items:
            type: string
          description: JSON array of tag strings (POST only — PATCH uses CSV string)
        statusLabel:
          type: string
          nullable: true
        properties:
          type: object
          nullable: true
        metadata:
          type: string
          nullable: true

    NoteWriteDto:
      type: object
      required: [role, body]
      properties:
        role:
          type: string
          enum: [queue, work, review]
        body:
          type: string
        properties:
          type: object
          nullable: true
          description: Reserved for future use; silently ignored in v1

    DependencyCreateDto:
      type: object
      required: [fromItemId, toItemId, type]
      properties:
        fromItemId:
          type: string
          format: uuid
        toItemId:
          type: string
          format: uuid
        type:
          type: string
          enum: [blocks, is_blocked_by, relates_to]
        unblockAt:
          type: string
          nullable: true
          description: Must be absent/null for relates_to edges

    AdvanceRequestDto:
      type: object
      required: [trigger]
      properties:
        trigger:
          type: string
          enum: [start, complete, block, hold, resume, cancel, reopen]
        credentialRefs:
          type: array
          nullable: true
          items:
            type: string
            pattern: '^[a-z0-9][a-z0-9\-_./]*$'
          maxItems: 8
          description: >-
            Opaque audit labels for credentials/resources consumed by this transition (never secret
            values). Each entry 1-128 chars matching the pattern. Once the target item declares at
            least one resource via its traits (registry state alone does not trigger this), each
            ref must name a declared/registered key (closed set) — an unrecognized ref returns 400
            validation_error.
            Declared resource keys are auto-recorded on work entry; you do not need to repeat them.
        overrideResourceLeases:
          type: boolean
          nullable: true
          default: false
          description: >-
            ADMIN-only. When true, skips the resource-lease gate for this transition (no lease taken,
            gate bypassed not satisfied). A non-ADMIN caller setting this to true receives 403
            insufficient_capability before the item is even loaded. WARN-logged; stamps
            "(resource leases overridden)" on the persisted transition's summary.

    ResourceLeaseDto:
      type: object
      required: [resourceKey, holderItemId, acquiredAt, expiresAt, originalAcquiredAt]
      properties:
        resourceKey:
          type: string
        holderItemId:
          type: string
          format: uuid
        acquiredByActorId:
          type: string
          nullable: true
          description: Present only for callers with ADMIN capability; omitted (not null) otherwise.
        acquiredAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        originalAcquiredAt:
          type: string
          format: date-time

    ResourceLeaseListResponseDto:
      type: object
      required: [leases]
      properties:
        leases:
          type: array
          items:
            $ref: "#/components/schemas/ResourceLeaseDto"

    ResourceLeaseReleaseResponseDto:
      type: object
      required: [resourceKey, releasedCount]
      properties:
        resourceKey:
          type: string
        releasedCount:
          type: integer

    ResourceLeaseIntervalDto:
      type: object
      required: [resourceKey, holderItemId, acquiredAt, expiresAt]
      description: >-
        One row per lease hold interval (append-only, never pruned in v1) — see the
        resource_lease_history table.
      properties:
        resourceKey:
          type: string
        holderItemId:
          type: string
          format: uuid
        acquiredByActorId:
          type: string
          nullable: true
          description: Present only for callers with ADMIN capability; omitted (not null) otherwise.
        acquiredAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        releasedAt:
          type: string
          format: date-time
          nullable: true
          description: Null while the interval is still open.
        releaseReason:
          type: string
          nullable: true
          enum: [released, expired, force_released]
          description: Null while the interval is still open.
        releasedByActorId:
          type: string
          nullable: true
          description: >-
            Present only for callers with ADMIN capability; omitted (not null) otherwise. Null for a
            passive "expired" close (no explicit release action performed it).

    ResourceLeaseHistoryResponseDto:
      type: object
      required: [intervals]
      properties:
        intervals:
          type: array
          items:
            $ref: "#/components/schemas/ResourceLeaseIntervalDto"

    MissingNoteDto:
      type: object
      required: [key, description]
      properties:
        key:
          type: string
        description:
          type: string
        guidance:
          type: string
          nullable: true
        skill:
          type: string
          nullable: true

    CascadeEventDto:
      type: object
      required: [itemId, title, previousRole, targetRole, applied]
      properties:
        itemId:
          type: string
          format: uuid
        title:
          type: string
        previousRole:
          type: string
        targetRole:
          type: string
        applied:
          type: boolean
        statusLabel:
          type: string
          nullable: true
        gateBlocked:
          type: boolean
          description: True when this cascade was suppressed by a required-note gate on the parent.
        missingNotes:
          type: array
          nullable: true
          description: Present only when gateBlocked is true.
          items:
            $ref: "#/components/schemas/MissingNoteDto"

    UnblockedItemDto:
      type: object
      required: [itemId, title]
      properties:
        itemId:
          type: string
          format: uuid
        title:
          type: string

    ExpectedNoteDto:
      type: object
      required: [key, role, required, description, exists]
      properties:
        key:
          type: string
        role:
          type: string
        required:
          type: boolean
        description:
          type: string
        guidance:
          type: string
          nullable: true
        skill:
          type: string
          nullable: true
        exists:
          type: boolean

    AdvanceResponseDto:
      type: object
      required: [itemId, previousRole, newRole, trigger]
      properties:
        itemId:
          type: string
          format: uuid
        previousRole:
          type: string
        newRole:
          type: string
        trigger:
          type: string
        statusLabel:
          type: string
          nullable: true
        cascadeEvents:
          type: array
          description: >-
            Cascade transitions applied (or gate-blocked) as a side effect of this advance —
            e.g. completing the last child auto-completing the parent. Mirrors the MCP
            advance_item cascadeEvents. Added when the REST and MCP advance paths were unified
            behind AdvanceService.
          items:
            $ref: "#/components/schemas/CascadeEventDto"
        unblockedItems:
          type: array
          description: Downstream items whose blocking dependencies are now satisfied.
          items:
            $ref: "#/components/schemas/UnblockedItemDto"
        expectedNotes:
          type: array
          description: Schema notes expected for the item's NEW role (parity with MCP advance_item).
          items:
            $ref: "#/components/schemas/ExpectedNoteDto"

    SearchHitDto:
      type: object
      required: [itemId, field, snippet, score]
      properties:
        itemId:
          type: string
          format: uuid
        field:
          type: string
        snippet:
          type: string
        score:
          type: number
          format: double
        noteKey:
          type: string
          nullable: true

    NoteSchemaEntryDto:
      type: object
      required: [key, role, required, description]
      properties:
        key:
          type: string
        role:
          type: string
          enum: [queue, work, review]
        required:
          type: boolean
        description:
          type: string
        guidance:
          type: string
          nullable: true
        skill:
          type: string
          nullable: true
        maxLength:
          type: integer
          description: Maximum note-body length configured for this entry. Present only when configured.

    DispatchProfileDto:
      type: object
      description: >-
        Dispatch routing profile for a phase — who/what should pick up the work. Declared per
        trait per phase under traits.<name>.dispatch.<phase> in .taskorchestrator/config.yaml.
        All fields are optional; at least one is present on any profile the server returns.
      properties:
        agent:
          type: string
          description: Opaque agent identifier (e.g. "task-orchestrator:implementer"), never validated against any registry.
        model:
          type: string
          description: Opaque model identifier/alias.
        effort:
          type: string
          enum: [low, medium, high, xhigh, max]
          description: Matched case-sensitively at config-parse time.

    ResourceRequirementDto:
      type: object
      required: [key, mode]
      description: A trait's declared shared-resource requirement.
      properties:
        key:
          type: string
        mode:
          type: string
          enum: [exclusive, advisory]
        ttlSeconds:
          type: integer
          description: Present only when configured.

    SchemaDto:
      type: object
      required: [type, lifecycleMode, hasReviewPhase, notes, defaultTraits]
      properties:
        type:
          type: string
        lifecycleMode:
          type: string
        hasReviewPhase:
          type: boolean
        notes:
          type: array
          items:
            $ref: "#/components/schemas/NoteSchemaEntryDto"
        defaultTraits:
          type: array
          items:
            type: string

    TraitDto:
      type: object
      required: [name, notes]
      description: >-
        dispatch and resources are omitted (not present) when the trait declares neither —
        never an empty map/array. Reflects GLOBAL config only; a per-root override of the
        same trait's dispatch/resources is not visible here.
      properties:
        name:
          type: string
        notes:
          type: array
          items:
            $ref: "#/components/schemas/NoteSchemaEntryDto"
        dispatch:
          type: object
          description: Map of lowercase phase name ("queue"|"work"|"review") to DispatchProfileDto. Omitted when the trait declares no dispatch profiles.
          additionalProperties:
            $ref: "#/components/schemas/DispatchProfileDto"
        resources:
          type: array
          description: Declared shared-resource requirements. Omitted when the trait declares none.
          items:
            $ref: "#/components/schemas/ResourceRequirementDto"

    ConfigSnapshotDto:
      type: object
      required: [schemas, traits, types, statusGraph]
      properties:
        schemas:
          type: array
          items:
            $ref: "#/components/schemas/SchemaDto"
        traits:
          type: array
          items:
            $ref: "#/components/schemas/TraitDto"
        types:
          type: array
          items:
            type: string
        statusGraph:
          $ref: "#/components/schemas/StatusGraphDto"
        defaultSchema:
          $ref: "#/components/schemas/SchemaDto"

    StatusGraphTypeDto:
      type: object
      required: [type, lifecycleMode, hasReviewPhase, transitions]
      properties:
        type:
          type: string
        lifecycleMode:
          type: string
        hasReviewPhase:
          type: boolean
        transitions:
          type: object
          additionalProperties:
            type: object
            additionalProperties:
              type: string
          description: |
            role -> trigger -> targetRole. Value "<previousRole>" is a sentinel string
            for blocked.resume — resolve from the live item's previousRole field.

    StatusGraphDto:
      type: object
      required: [roles, triggers, types]
      properties:
        roles:
          type: array
          items:
            type: string
        triggers:
          type: array
          items:
            type: string
        types:
          type: array
          items:
            $ref: "#/components/schemas/StatusGraphTypeDto"

    ServiceInfoDto:
      type: object
      required: [serverName, version, apiVersion, capabilities, claimModeAvailable,
                 actorAuthenticationEnabled]
      properties:
        serverName:
          type: string
        version:
          type: string
        apiVersion:
          type: string
        capabilities:
          type: array
          items:
            type: string
        claimModeAvailable:
          type: boolean
        actorAuthenticationEnabled:
          type: boolean

    HealthDto:
      type: object
      required: [status, dbReachable]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        dbReachable:
          type: boolean

    ProjectConfigResponseDto:
      type: object
      required: [rootId, fingerprint, updatedAt]
      properties:
        rootId:
          type: string
          format: uuid
        fingerprint:
          type: string
          description: SHA-256 hex digest of the stored configYaml's UTF-8 bytes
        updatedAt:
          type: string
          format: date-time
        configYaml:
          type: string
          nullable: true
          description: Raw stored YAML text; present on GET only (omitted on PUT)
        warning:
          type: string
          nullable: true
          description: Non-fatal notice when the root's `type` is not "project"
        relation:
          type: string
          nullable: true
          enum: [current, superseded, unknown]
          description: >-
            Present on GET only, and only when ?fingerprint= was supplied — classifies that
            fingerprint against the root's stored fingerprint history.
        ignoredSections:
          type: array
          nullable: true
          items:
            type: string
          description: >-
            Present on PUT only, and only when the pushed document has top-level keys not honored
            by the per-root resolution layer (e.g. actor_authentication, which stays global-only).
            Honored keys: work_item_schemas, note_schemas, traits, project, note_limits,
            status_labels. Omitted entirely when empty.
        schemaWarnings:
          type: array
          nullable: true
          items:
            type: string
          description: >-
            Present on PUT only, and only when YamlSchemaParser produced per-entry parse warnings
            for the pushed document (e.g. a note schema entry with an invalid role value, which is
            skipped rather than rejecting the whole push). The push still succeeds and the config
            is still stored regardless of schemaWarnings. Omitted entirely when empty.

    PlanDocumentResponseDto:
      type: object
      required: [id, rootId, slug, contentHash, status, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        rootId:
          type: string
          format: uuid
        slug:
          type: string
        contentHash:
          type: string
          description: SHA-256 hex digest of the stored body's UTF-8 bytes
        status:
          type: string
          enum: [pending, adopted]
        adoptedByItemId:
          type: string
          format: uuid
          nullable: true
          description: >-
            Set once status is "adopted"; null while pending, and null again if the adopting
            item is later deleted (ON DELETE SET NULL — status itself does not revert).
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        body:
          type: string
          nullable: true
          description: Raw stored document text; present on GET only (omitted on PUT)

    PlanDocumentSummaryDto:
      type: object
      required: [id, rootId, slug, contentHash, status, createdAt, updatedAt]
      description: Same shape as PlanDocumentResponseDto minus body, which list responses never include.
      properties:
        id:
          type: string
          format: uuid
        rootId:
          type: string
          format: uuid
        slug:
          type: string
        contentHash:
          type: string
        status:
          type: string
          enum: [pending, adopted]
        adoptedByItemId:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PlanDocumentListResponseDto:
      type: object
      required: [rootId, plans]
      properties:
        rootId:
          type: string
          format: uuid
        plans:
          type: array
          items:
            $ref: "#/components/schemas/PlanDocumentSummaryDto"

  responses:
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorDto"
    Forbidden:
      description: Authenticated but lacks required capability or scope
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorDto"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorDto"
    BadRequest:
      description: Invalid request parameters or body
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorDto"
    InternalServerError:
      description: Database or server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorDto"

paths:
  /items:
    get:
      summary: List work items
      operationId: listItems
      tags: [items]
      description: >-
        A token with scope.tags_include is additionally filtered to items carrying at least one
        allowed tag (item-level exact match, no ancestor walk). A tag-scoped caller reads a bounded
        1000-row candidate window before filtering, then paginates the filtered result — totalItems
        reflects only the visible (post-filter) count. A tag scope matching nothing returns 200
        with an empty page, never 403.
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/pageSize"
        - name: role
          in: query
          schema:
            type: string
        - name: priority
          in: query
          schema:
            type: string
        - name: tag
          in: query
          schema:
            type: string
          description: Comma-separated tags; all must be present (AND)
        - name: tagAny
          in: query
          schema:
            type: string
          description: Comma-separated tags; any must be present (OR); overrides tag
        - name: type
          in: query
          schema:
            type: string
        - name: parentId
          in: query
          schema:
            type: string
            format: uuid
        - name: rootId
          in: query
          schema:
            type: string
            format: uuid
        - name: modifiedAfter
          in: query
          schema:
            type: string
            format: date-time
        - name: modifiedBefore
          in: query
          schema:
            type: string
            format: date-time
        - name: createdAfter
          in: query
          schema:
            type: string
            format: date-time
        - name: createdBefore
          in: query
          schema:
            type: string
            format: date-time
        - name: claimStatus
          in: query
          schema:
            type: string
            enum: [claimed, unclaimed, expired]
        - name: orderBy
          in: query
          schema:
            type: string
        - name: orderDir
          in: query
          schema:
            type: string
            enum: [asc, desc]
      responses:
        "200":
          description: Paginated item list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageDto"
                  - properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/ItemDto"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

    post:
      summary: Create a work item
      operationId: createItem
      tags: [items]
      parameters:
        - name: Idempotency-Key
          in: header
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItemCreateDto"
      responses:
        "201":
          description: Item created
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemDto"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          description: >-
            Payload too large — body exceeds the shared 1 MiB write-body limit, enforced before
            the body is buffered (Content-Length pre-check, then a capped channel read).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "415":
          description: >-
            Unsupported media type — Content-Type is present and is not application/json (an
            absent header is accepted as */*); checked before the Idempotency-Key header or body
            is read.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /items/roots:
    get:
      summary: List root items (depth=0)
      description: >
        Scoped tokens return only the specific root items within scope (totalItems is the exact
        scoped root count). Unscoped/admin callers get standard page/pageSize pagination with
        totalItems from an exact COUNT query — no cap; page through all roots with repeated
        requests. A scope.tags_include token is additionally filtered to items carrying at least
        one allowed tag, applied in-memory over a bounded 1000-row candidate window (same caveat
        as GET /items) — totalItems then reflects only the visible count. A tag scope matching
        nothing returns 200 with an empty page, never 403.
      operationId: listRootItems
      tags: [items]
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/pageSize"
      responses:
        "200":
          description: Root items
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageDto"
                  - properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/ItemDto"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /items/{id}:
    get:
      summary: Get a single work item
      operationId: getItem
      tags: [items]
      parameters:
        - $ref: "#/components/parameters/itemId"
        - name: include
          in: query
          schema:
            type: string
          description: Comma-separated inclusions - notes, deps, children
        - name: If-None-Match
          in: header
          schema:
            type: string
      responses:
        "200":
          description: Item
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemDto"
        "304":
          description: Not modified (If-None-Match matched)
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      summary: JSON Merge Patch update
      operationId: patchItem
      tags: [items]
      description: >-
        When the patch re-parents the item (parentId changed to a non-null value), the new parent
        is scope-checked the same way POST /items checks a create-time parentId — 403
        scope_forbidden if the new parent is outside the caller's scope (root_ids or tags_include).
        An unknown new parent still returns 400 not_found first; scope is checked only after the
        parent is confirmed to exist, so scope_forbidden never becomes an existence oracle.

        A re-parent that would create a cycle is rejected as 400 validation_error: parentId equal
        to the item's own id ("An item cannot be its own parent") or naming one of the item's own
        descendants ("Cannot re-parent an item under its own descendant"). Checked via an identity
        comparison plus a full walk of the proposed parent's real ancestor chain (one batched
        findAncestorChains lookup) — not bounded by the parent row's denormalized depth, so a stale
        depth value can no longer let a cycle through. Ordering: 404 not_found (unknown parent) ->
        403 scope_forbidden (parent outside scope) -> this 400 validation_error (self/descendant
        cycle); nothing is written until all three clear. If the ancestor-chain lookup itself fails,
        the patch returns 500 db_error rather than admitting the re-parent.
      parameters:
        - $ref: "#/components/parameters/itemId"
        - name: If-Match
          in: header
          required: true
          schema:
            type: string
          description: Current ETag; required — missing -> 400 precondition_required
        - name: Idempotency-Key
          in: header
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              type: object
              description: |
                RFC 7396 merge patch. tags must be a CSV string (not array).
                Server-owned fields id, role, previousRole, roleChangedAt, depth,
                createdAt, modifiedAt, version, claimedBy, claimedAt, claimExpiresAt,
                originalClaimedAt cannot be patched (400 field_not_patchable).
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Updated item
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemDto"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >-
            error="version_conflict" — a concurrent writer's update won the version race between
            the If-Match check and this request's own write (optimistic-lock loss). Distinct from
            412 etag_mismatch below, which is a stale-If-Match-at-read-time guard, not a
            concurrent-write guard. Retry with a fresh If-Match ETag.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "412":
          description: ETag mismatch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "413":
          description: >-
            Payload too large — body exceeds the shared 1 MiB write-body limit, enforced before
            the body is buffered (Content-Length pre-check, then a capped channel read).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "415":
          description: Unsupported media type
          headers:
            Accept-Patch:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "500":
          $ref: "#/components/responses/InternalServerError"

    delete:
      summary: Cascade delete item
      operationId: deleteItem
      tags: [items]
      parameters:
        - $ref: "#/components/parameters/itemId"
        - name: If-Match
          in: header
          schema:
            type: string
          description: Optional conditional delete
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          description: ETag mismatch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"

  /items/{id}/advance:
    post:
      summary: Trigger a role transition
      operationId: advanceItem
      tags: [items]
      description: |
        Runs the SAME advance pipeline as the MCP advance_item tool (resolve → validate →
        required-note gate → resource-lease gate → apply → cascade → unblock), unified behind
        AdvanceService.

        Bypasses MCP claim ownership — a claimed item advances successfully regardless of
        which MCP agent holds the claim. Response does NOT include claimedBy. WARN is logged
        when API_WARN_ON_CLAIMED_ADVANCE=true (default).

        Required-note gates ARE enforced: a start/complete that leaves a required note unfilled
        is rejected with 422 (error code "gate_blocked") and the missing notes in details.missingNotes,
        rather than silently advancing. The response includes cascadeEvents, unblockedItems, and
        expectedNotes (additive — older clients can ignore the new fields).

        Resource-lease gate ALSO enforced on both start and resume (both re-enter WORK) — unlike
        claim ownership above, this gate is NOT bypassed for ordinary callers; only an explicit
        ADMIN overrideResourceLeases:true opts out (403 for non-admin callers who set it). Contention
        returns 409 resource_unavailable with a Retry-After header — never the current holder's
        identity. An item with no declared resources can never produce this response.
      parameters:
        - $ref: "#/components/parameters/itemId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdvanceRequestDto"
      responses:
        "200":
          description: Transition applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdvanceResponseDto"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >-
            Two independent discriminants share this status, both defensive on the REST path since
            REST bypasses claim ownership by default (see the ownership/lease asymmetry above):
            error="resource_unavailable" — resource lease contended; details.contendedResources lists
            the contended keys and details.retryAfterMs the suggested backoff (echoed as a Retry-After
            header, whole seconds, rounded up); no holder identity disclosed, use
            GET /api/v1/resources/leases (ADMIN) to diagnose. Only reachable for items that declare
            resources: via traits. error="not_claim_holder" — a different agent holds a live claim on
            the item (not expected to occur on the REST path, which bypasses ownership enforcement,
            but defensively mapped).
          headers:
            Retry-After:
              schema:
                type: integer
              description: Present only for resource_unavailable. Whole seconds until the contended lease can possibly free up (rounded up, floor 1).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "422":
          description: >-
            Transition rejected. error="gate_blocked" with details.missingNotes when a required-note
            gate fails; error="transition_blocked" with details.blockers when a dependency blocks the
            transition; error="transition_failed" for invalid-state resolution/apply failures.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "413":
          description: >-
            Payload too large — body exceeds the shared 1 MiB write-body limit, enforced before
            the body is buffered (Content-Length pre-check, then a capped channel read).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "415":
          description: >-
            Unsupported media type — Content-Type is present and is not application/json (an
            absent header is accepted as */*); checked before the body is read.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"

