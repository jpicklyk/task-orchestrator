          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanDocumentResponseDto"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: rootId does not resolve to an existing WorkItem
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "409":
          description: The slug is already adopted; adoption is one-way and cannot be overwritten
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "413":
          description: >-
            body exceeds the 64 KiB cap (unchanged); now enforced before the body is fully
            buffered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "422":
