          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthDto"

  /.well-known/mcp-task-orchestrator.json:
    servers:
      - url: /
        description: Mounted at the server root, not under /api/v1
    get:
      summary: Service discovery document — no authentication required
      operationId: getWellKnown
      tags: [service]
      security: []
      responses:
        "200":
          description: Service descriptor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WellKnownDto"

  /events:
    get:
      summary: Server-Sent Events stream
      operationId: getEvents
      tags: [events]
      description: |
        Real-time SSE stream. Auth runs in a pre-flight plugin phase (before the SSE handler
        commits the 200 response). Requires read or admin capability.

        This route is exempted from the global auth plugin via publicPaths (matched against the
        request path only, not the full URI, so ?token= and other query strings still match) and
        honors API_AUTH_MODE=none + API_ALLOW_UNAUTHENTICATED=true (see api-rest.md §1) the same
        way the bearer route does — no token required when both opt-in keys are set.

        Browser clients cannot use native EventSource because it does not support custom headers.
        Use a fetch-based SSE library (e.g. @microsoft/fetch-event-source) with
        Authorization: Bearer, or enable API_ALLOW_QUERY_TOKEN_FOR_SSE=true for ?token= access.

        The stream is a projection of the durable events table (4.0, V20): event ids are the
        table's seq (above 10^12, monotonic, durable across restarts), writes from other processes
        sharing the database stream within about one second, and nothing a rolled-back write did
        is ever streamed. Rejections, lease, config and plan-document rows are table-only.

        Scope filtering: root scope (?root= intersected with principal.scope.rootIds) is applied
        identically to the live stream and to Last-Event-ID replay -- every row carries its root_id,
        so replay is not unfiltered. A root-scoped principal (non-null
        scope.rootIds) whose ?root= values do not intersect that scope gets 403 forbidden (scope root)
        before the SSE stream opens; any ?root= value that is not a UUID gets 400 invalid_request (Q32:
        a mix of valid and invalid values is rejected too). Every pre-flight body is the error envelope. A
        principal with scope.tags_include set is additionally filtered per event (live and replay alike),
        using the same ScopeGuard predicate as the tools and REST reads; see api-rest.md §21/§3. KNOWN LIMITATION:
        item.deleted is dropped for a tag-scoped connection (its tags can no longer be resolved once
        the item is gone) -- see api-rest.md section 24.

        A tags_include-scoped token additionally requires the route's WorkItemRepository wiring;
        if that is unavailable the pre-flight plugin rejects the connection with 403 forbidden
        (scope tag) rather than serving an unfiltered stream.

        Event ID namespace is independent from /mcp SSE channel. Do NOT reuse Last-Event-ID
        values across the two channels.
      parameters:
        - name: root
          in: query
          schema:
            type: string
            format: uuid
          description: Root-subtree filter (repeatable); intersected with principal scope
        - name: types
          in: query
          schema:
            type: string
          description: >-
            Comma-separated event type filter. Exempt: sync.lost and auth.expired (control
            events) are always delivered regardless of this filter.
        - name: token
          in: query
          schema:
            type: string
          description: Bearer token (only accepted when API_ALLOW_QUERY_TOKEN_FOR_SSE=true)
        - name: Last-Event-ID
          in: header
          schema:
            type: string
          description: >-
            Resume from this event ID (a seq); replay is read from the events table and filtered
            by root and tags_include the same way the live stream is, deduplicated against live
            delivery by id. API_SSE_BUFFER_SIZE (default 1000) is the replay window. When the id
            is not replayable -- more than the window behind the newest event (buffer_evicted),
            above the newest event, below the 10^12 seq floor (any pre-4.0 ring-buffer id; the floor itself is a valid start-of-log cursor),
            or unparsable (unknown_event_id) -- the server emits a sync.lost event with that reason
            as the first frame, then immediately replays the whole window after it (replay resumes
            from the sentinel's own id, max(10^12, newest - window), not the client's cursor -- no
            second reconnect needed). A blank or absent header is not a resume attempt and never
            triggers sync.lost. API_SSE_BUFFER_SIZE=0 means no replay: every resume behind the
            newest event yields buffer_evicted with no events to replay.
      responses:
        "200":
          description: SSE stream (text/event-stream)
          content:
            text/event-stream:
              schema:
                type: string
                description: |
                  Each event: id:<n>\nevent:<type>\ndata:<ApiEvent JSON>\n\n
                  Event types: item.created, item.updated, item.deleted, item.advanced,
                  note.upserted, note.deleted, note.ownership_transferred, dependency.added, dependency.removed,
                  scope.entered, scope.left, sync.lost, auth.expired

                  ApiEvent JSON fields: id, event, itemId (null for sync.lost/auth.expired),
                  modifiedAt, newRole (item.advanced only), actor ({id, kind, parent?}, the writer;
                  domain events only; omitted when unknown, or for a non-admin caller when
                  API_REDACT_NOTE_ATTRIBUTION is true; never proof/verification), rootId (depth-0
                  ancestor of the item; present on every domain event since 4.0, live and on
                  replay; never redacted), and reason -- set only on sync.lost,
                  one of queue_overflow (per-connection queue overflowed), buffer_evicted
                  (resumed Last-Event-ID further behind than the replay window), or
                  unknown_event_id (resumed Last-Event-ID above the newest event, below the
                  seq floor, or unparsable); null/absent on every other event type.

                  auth.expired: sent and the stream closed when the connection's token expires
                  (checked every API_SSE_AUTH_CHECK_INTERVAL_SECONDS). Fires for every JWKS session
                  (exp is a required claim in jwks mode — a token with no exp is rejected at auth
                  time, 401 unauthenticated). Does not fire for API_AUTH_MODE=none unauthenticated
                  sessions or for a bearer token with no expires_at — neither has an expiry to watch.
        "400":
          description: >-
            Pre-flight validation failure: a ?root= value is not a UUID (invalid_request envelope,
            field root).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpsEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/KeySetUnavailable"
        "403":
          $ref: "#/components/responses/Forbidden"
