                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/RoleTransitionDto"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /transitions:
    get:
      summary: Recent transitions across all items
      operationId: listTransitions
      tags: [transitions]
      description: >-
        Scope-filtered by ancestor chain for root_ids-scoped tokens. A scope.tags_include token is
        additionally filtered to transitions on items carrying an allowed tag (item-level exact
        match) — a tag scope matching nothing returns 200 with an empty page, never 403.

        Scan cap: the underlying fetch is bounded at 1000 rows regardless of how many transitions
        match `since`. Beyond that cap, pages come back truncated (hasMore reads false even though
        older matching transitions exist past the scan limit). Narrow `since` rather than paging
        deeper to stay under the cap.
      parameters:
        - name: since
          in: query
          schema:
            type: string
            format: date-time
          description: Default 24 hours ago when absent or blank. An unparsable value returns 400 validation_error.
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/pageSize"
      responses:
        "200":
          description: Scope-filtered transition history
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageDto"
                  - properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/RoleTransitionDto"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /search:
    get:
      summary: FTS5 full-text search over item titles, summaries and descriptions
      operationId: searchItems
      tags: [search]
      description: >-
        A token's scope.root_ids and scope.tags_include are applied inside the FTS5 query, before
        ranking and the 50-hit page (tags_include: item-level exact, case-sensitive match), so a
        restricted token gets a full page of in-scope hits; a scope matching nothing returns 200
        with an empty list, never 403. Each hit's field names the field that contains a match.
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
        - name: ancestorId
          in: query
          schema:
            type: string
            format: uuid
        - name: role
          in: query
          description: Matching is case-insensitive (the enum lists the canonical lower-case values). An unrecognized value returns 400 validation_error.
          schema:
            type: string
            enum: [queue, work, review, blocked, terminal]
        - name: tag
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Ranked search hits (up to 50)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SearchHitDto"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /notes/search:
    get:
      summary: FTS5 full-text search over note bodies
      operationId: searchNotes
      tags: [search]
      description: >-
        A token's scope.root_ids and scope.tags_include are applied inside the FTS5 query, before
        ranking and the 50-hit page (tags_include: exact, case-sensitive match on each note's owning
        item), so a restricted token gets a full page of in-scope hits; a scope matching nothing
        returns 200 with an empty list, never 403.
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
        - name: ancestorId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Ranked note-body hits (up to 50)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SearchHitDto"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /config:
