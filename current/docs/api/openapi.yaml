  /events:
    get:
      summary: Server-Sent Events stream
      operationId: getEvents
      tags: [events]
      description: |
        Real-time SSE stream. Auth runs in a pre-flight plugin phase (before the SSE handler
        commits the 200 response). Requires read or admin capability.

        This route is exempted from the global auth plugin via publicPaths (matched against the
        request path only, not the full URI, so ?token= and other query strings still match) and
        honors API_AUTH_MODE=none + API_ALLOW_UNAUTHENTICATED=true (see api-rest.md §1) the same
        way the bearer route does — no token required when both opt-in keys are set.

        Browser clients cannot use native EventSource because it does not support custom headers.
        Use a fetch-based SSE library (e.g. @microsoft/fetch-event-source) with
        Authorization: Bearer, or enable API_ALLOW_QUERY_TOKEN_FOR_SSE=true for ?token= access.

        Scope filtering: root scope (?root= intersected with principal.scope.rootIds) is applied
        identically to the live stream and to Last-Event-ID replay — ring-buffer entries carry
        affectedRoots metadata so replay is not unfiltered. A root-scoped principal (non-null
        scope.rootIds) whose ?root= values do not intersect that scope gets 403 insufficient_scope
        before the SSE stream opens; ?root= present with zero valid UUIDs gets 400 validation_error
        (mixed valid/invalid values narrow and are accepted). A principal with scope.tags_include set
        is additionally filtered per event (live and replay alike), using the same allowsItemTags
        predicate as the REST collection endpoints; see api-rest.md §21/§3. KNOWN LIMITATION:
        item.deleted is dropped for a tag-scoped connection (its tags can no longer be resolved once
        the item is gone), and dependency.* events on an ancestor-cache miss now fail CLOSED — they
        reach only unrestricted subscribers (no ?root= filter, no scope.rootIds), never a root-scoped
        one — see api-rest.md §25.

        A tags_include-scoped token additionally requires the route's WorkItemRepository wiring;
        if that is unavailable the pre-flight plugin rejects the connection with 403
        insufficient_scope rather than serving an unfiltered stream.

        Event ID namespace is independent from /mcp SSE channel. Do NOT reuse Last-Event-ID
        values across the two channels.
      parameters:
        - name: root
          in: query
          schema:
            type: string
            format: uuid
          description: Root-subtree filter (repeatable); intersected with principal scope
        - name: types
          in: query
          schema:
            type: string
          description: >-
            Comma-separated event type filter. Exempt: sync.lost and auth.expired (control
            events) are always delivered regardless of this filter.
        - name: token
          in: query
          schema:
            type: string
          description: Bearer token (only accepted when API_ALLOW_QUERY_TOKEN_FOR_SSE=true)
        - name: Last-Event-ID
          in: header
          schema:
            type: string
          description: >-
            Resume from this event ID; replay is filtered by root and tags_include the same way
            the live stream is. When the id is no longer replayable — older than the retained
            ring buffer, above the current high-water mark (e.g. after a server restart, since
            the id counter restarts at 0), or unparsable — the server emits a sync.lost event
            with a reason (buffer_evicted or unknown_event_id) as the first frame, then
            immediately replays the FULL retained buffer after it (replay resumes from the
            sentinel's own id, not the client's cursor — no second reconnect needed). A blank or
            absent header is not a resume attempt and never triggers sync.lost.
            API_SSE_BUFFER_SIZE=0 legally retains nothing, so every resume attempt that carries a
            Last-Event-ID yields buffer_evicted with no events to replay.
      responses:
        "200":
          description: SSE stream (text/event-stream)
          content:
            text/event-stream:
              schema:
                type: string
                description: |
                  Each event: id:<n>\nevent:<type>\ndata:<ApiEvent JSON>\n\n
                  Event types: item.created, item.updated, item.deleted, item.advanced,
                  note.upserted, note.deleted, dependency.added, dependency.removed,
                  scope.entered, scope.left, sync.lost, auth.expired

                  ApiEvent JSON fields: id, event, itemId (null for sync.lost/auth.expired),
                  modifiedAt, newRole (item.advanced only), and reason — set only on sync.lost,
                  one of queue_overflow (per-connection queue overflowed), buffer_evicted
                  (resumed Last-Event-ID older than the retained ring buffer), or
                  unknown_event_id (resumed Last-Event-ID above the high-water mark or
                  unparsable); null/absent on every other event type.

                  auth.expired: sent and the stream closed when the connection's token expires
                  (checked every API_SSE_AUTH_CHECK_INTERVAL_SECONDS). Fires for every JWKS session
                  (exp is a required claim in jwks mode — a token with no exp is rejected at auth
                  time, 401 invalid_token). Does not fire for API_AUTH_MODE=none unauthenticated
                  sessions or for a bearer token with no expires_at — neither has an expiry to watch.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
