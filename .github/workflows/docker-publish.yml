name: Build, Publish, and Release

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read
      checks: write   # action-junit-report (test.yml) needs checks:write on the calling workflow

  build:
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write
      id-token: write   # GitHub OIDC login for mcp-publisher

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Make gradlew executable
      run: chmod +x gradlew

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Get version
      id: version
      run: |
        VERSION=$(./gradlew -q :current:printTagVersion)
        echo "version=${VERSION}" >> $GITHUB_OUTPUT
        echo "Building version: ${VERSION}"

    - name: Verify tag matches version.properties
      run: |
        VERSION=${{ steps.version.outputs.version }}
        TAG_VERSION="${GITHUB_REF_NAME#v}"
        if [ "$VERSION" != "$TAG_VERSION" ]; then
          echo "ERROR: Tag ${GITHUB_REF_NAME} does not match version.properties (${VERSION})"
          exit 1
        fi

    - name: Verify server.json matches release version
      run: |
        VERSION=${{ steps.version.outputs.version }}
        SJ_VERSION=$(jq -r '.version' server.json)
        SJ_IMAGE=$(jq -r '.packages[] | select(.registryType == "oci") | .identifier' server.json)
        EXPECTED_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION}"
        if [ "$SJ_VERSION" != "$VERSION" ]; then
          echo "ERROR: server.json version (${SJ_VERSION}) does not match release version (${VERSION})"
          exit 1
        fi
        if [ "$SJ_IMAGE" != "$EXPECTED_IMAGE" ]; then
          echo "ERROR: server.json OCI identifier (${SJ_IMAGE}) must be the immutable release tag (${EXPECTED_IMAGE})"
          exit 1
        fi

    - name: Extract Docker metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=raw,value=latest
          type=raw,value=${{ steps.version.outputs.version }}
          type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.version }}

    - name: Build runtime-current image (amd64, local load only, pre-push gate)
      uses: docker/build-push-action@v5
      with:
        context: .
        target: runtime-current
        push: false
        load: true
        platforms: linux/amd64
        tags: task-orchestrator:release-gate
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Smoke-test the built image
      run: scripts/ci/smoke-test-image.sh task-orchestrator:release-gate

    - name: Run Trivy vulnerability scanner (CRITICAL, must be fixable — blocks the release on failure)
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        image-ref: task-orchestrator:release-gate
        format: 'table'
        severity: 'CRITICAL'
        ignore-unfixed: true
        exit-code: '1'

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        target: runtime-current
        push: true
        platforms: linux/amd64,linux/arm64
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Install mcp-publisher
      run: |
        OS=$(uname -s | tr '[:upper:]' '[:lower:]')
        ARCH=$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')
        URL="https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_${OS}_${ARCH}.tar.gz"
        curl -fsSL "$URL" | tar xz mcp-publisher
        ./mcp-publisher --version

    # Publishes the immutable per-release record (server.json pins the :<version> image tag,
    # so the registry entry never follows a mutable tag). OIDC authenticates the io.github.jpicklyk
    # namespace; the registry also verifies the image's io.modelcontextprotocol.server.name label.
    - name: Publish to MCP Registry
      run: |
        ./mcp-publisher login github-oidc
        ./mcp-publisher publish

    - name: Create GitHub Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create "${{ github.ref_name }}" \
          --title "${{ github.ref_name }}" \
          --generate-notes \
          --verify-tag
