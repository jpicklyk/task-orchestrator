name: Run Tests

on:
  push:
    branches: ['**']
  pull_request:
    branches: [ main ]
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Needed for version calculation

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Make gradlew executable
      run: chmod +x gradlew

    - name: Lint check
      run: ./gradlew :current:ktlintCheck --no-daemon

    - name: Run tests
      run: ./gradlew :current:test --no-daemon

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Run plugin hook tests
      run: |
        set -o pipefail
        node --test "claude-plugins/task-orchestrator/hooks/tests/*.test.mjs" | tee /tmp/hook-test-output.txt
        test_count=$(grep '^# tests ' /tmp/hook-test-output.txt | awk '{print $3}')
        if [ -z "$test_count" ] || [ "$test_count" -lt 1 ]; then
          echo "::error::No plugin hook tests ran (test_count=${test_count:-0}) — the test glob matched nothing. Failing so an empty glob can't go silently green."
          exit 1
        fi
        echo "Ran $test_count plugin hook tests."

    - name: Run plugin script tests
      run: |
        set -o pipefail
        node --test "claude-plugins/task-orchestrator/scripts/tests/*.test.mjs" | tee /tmp/script-test-output.txt
        test_count=$(grep '^# tests ' /tmp/script-test-output.txt | awk '{print $3}')
        if [ -z "$test_count" ] || [ "$test_count" -lt 1 ]; then
          echo "::error::No plugin script tests ran (test_count=${test_count:-0}) — the test glob matched nothing. Failing so an empty glob can't go silently green."
          exit 1
        fi
        echo "Ran $test_count plugin script tests."

    - name: Publish Test Report
      uses: mikepenz/action-junit-report@v4
      if: always()
      with:
        report_paths: '**/build/test-results/test/TEST-*.xml'
        check_name: 'Test Results'

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: |
          **/build/test-results/test/TEST-*.xml
          **/build/reports/tests/test/**

  image-smoke:
    needs: test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build runtime-current image (amd64, local load only)
      uses: docker/build-push-action@v5
      with:
        context: .
        target: runtime-current
        push: false
        load: true
        platforms: linux/amd64
        tags: task-orchestrator:ci
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Smoke-test the built image
      run: scripts/ci/smoke-test-image.sh task-orchestrator:ci

    - name: Run Trivy vulnerability scanner (CRITICAL, must be fixable)
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        image-ref: task-orchestrator:ci
        format: 'table'
        severity: 'CRITICAL'
        ignore-unfixed: true
        exit-code: '1'
